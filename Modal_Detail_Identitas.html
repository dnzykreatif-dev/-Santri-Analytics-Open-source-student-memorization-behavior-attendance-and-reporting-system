<div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
  <div class="lg:col-span-2 space-y-4">
    <div class="rounded-2xl border border-gray-100 bg-white p-4">
      <div class="flex items-center justify-between gap-3 mb-4">
        <div>
          <h4 class="font-bold text-lg">Biodata Inti</h4>
          <p class="text-sm text-gray-500">Ringkasan profil santri yang siap dipakai untuk kartu identitas.</p>
        </div>
        <div class="flex flex-col sm:flex-row gap-2">
          <button
            type="button"
            x-show="canEditStudentProfile() && !editingStudentProfile"
            class="px-4 py-2 rounded-xl bg-[#0f5f4a] text-white text-sm font-bold"
            @click="startStudentProfileEdit()"
          >
            Edit Biodata
          </button>
          <button
            type="button"
            class="px-4 py-2 rounded-xl bg-white border border-gray-200 text-gray-700 text-sm font-bold"
            @click="issueSelectedStudentQr()"
          >
            Buat / Perbarui QR
          </button>
        </div>
      </div>

      <div
        x-show="editingStudentProfile"
        x-cloak
        class="mb-5 rounded-2xl border border-emerald-100 bg-emerald-50/60 p-4"
      >
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <label class="block">
            <span class="text-xs font-bold text-gray-500 uppercase">Nama Lengkap</span>
            <input
              type="text"
              x-model="studentEditForm.Name"
              class="mt-1 w-full rounded-xl border border-gray-200 bg-white px-3 py-3 text-sm focus:ring-2 focus:ring-[#0f5f4a]"
              placeholder="Nama santri"
            />
          </label>
          <label class="block">
            <span class="text-xs font-bold text-gray-500 uppercase">NIS</span>
            <input
              type="text"
              x-model="studentEditForm.NIS"
              class="mt-1 w-full rounded-xl border border-gray-200 bg-white px-3 py-3 text-sm focus:ring-2 focus:ring-[#0f5f4a]"
              placeholder="Nomor induk"
            />
          </label>
          <label class="block">
            <span class="text-xs font-bold text-gray-500 uppercase">Kelas / Level</span>
            <input
              type="text"
              x-model="studentEditForm.ClassLevel"
              list="student-class-options"
              class="mt-1 w-full rounded-xl border border-gray-200 bg-white px-3 py-3 text-sm focus:ring-2 focus:ring-[#0f5f4a]"
              placeholder="Contoh: 10 Ikhwan"
            />
          </label>
          <label class="block">
            <span class="text-xs font-bold text-gray-500 uppercase">Gender</span>
            <select
              x-model="studentEditForm.Gender"
              class="mt-1 w-full rounded-xl border border-gray-200 bg-white px-3 py-3 text-sm focus:ring-2 focus:ring-[#0f5f4a]"
            >
              <option value="">Belum diisi</option>
              <option value="Ikhwan">Ikhwan</option>
              <option value="Akhwat">Akhwat</option>
            </select>
          </label>
          <label class="block">
            <span class="text-xs font-bold text-gray-500 uppercase">Nomor Wali</span>
            <input
              type="text"
              x-model="studentEditForm.ParentContact"
              class="mt-1 w-full rounded-xl border border-gray-200 bg-white px-3 py-3 text-sm focus:ring-2 focus:ring-[#0f5f4a]"
              placeholder="Nomor HP wali"
            />
          </label>
          <label class="block">
            <span class="text-xs font-bold text-gray-500 uppercase">Status Santri</span>
            <select
              x-model="studentEditForm.Status"
              class="mt-1 w-full rounded-xl border border-gray-200 bg-white px-3 py-3 text-sm focus:ring-2 focus:ring-[#0f5f4a]"
            >
              <option value="Active">Aktif</option>
              <option value="Inactive">Non-aktif</option>
              <option value="Graduated">Lulus</option>
              <option value="Stopped">Berhenti</option>
            </select>
          </label>
        </div>
        <datalist id="student-class-options">
          <template x-for="className in uniqueClasses" :key="className">
            <option :value="className"></option>
          </template>
        </datalist>
        <div class="mt-4 flex flex-col sm:flex-row gap-2 sm:justify-end">
          <button
            type="button"
            class="w-full sm:w-auto px-4 py-3 rounded-xl bg-white border border-gray-200 text-gray-700 text-sm font-bold"
            @click="cancelStudentProfileEdit()"
            :disabled="savingStudentProfile"
          >
            Batal
          </button>
          <button
            type="button"
            class="w-full sm:w-auto px-5 py-3 rounded-xl bg-[#0f5f4a] text-white text-sm font-bold disabled:opacity-60"
            @click="saveStudentProfile()"
            :disabled="savingStudentProfile"
          >
            <span x-show="!savingStudentProfile">Simpan Biodata</span>
            <span x-show="savingStudentProfile">Menyimpan...</span>
          </button>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <div class="space-y-3 text-sm">
            <div class="flex justify-between gap-4 border-b border-gray-100 pb-2">
              <span class="text-gray-400">NIS</span>
              <span class="font-semibold" x-text="selectedStudent?.NIS || '-'"></span>
            </div>
            <div class="flex justify-between gap-4 border-b border-gray-100 pb-2">
              <span class="text-gray-400">Nama</span>
              <span class="font-semibold text-right" x-text="selectedStudent?.Name || '-'"></span>
            </div>
            <div class="flex justify-between gap-4 border-b border-gray-100 pb-2">
              <span class="text-gray-400">Kelas</span>
              <span class="font-semibold text-right" x-text="selectedStudent?.['Class/Level'] || '-'"></span>
            </div>
            <div class="flex justify-between gap-4 border-b border-gray-100 pb-2">
              <span class="text-gray-400">Gender</span>
              <span class="font-semibold text-right" x-text="selectedStudent?.Gender || '-'"></span>
            </div>
            <div class="flex justify-between gap-4 border-b border-gray-100 pb-2">
              <span class="text-gray-400">Tempat Lahir</span>
              <span class="font-semibold text-right" x-text="selectedStudent?.BirthPlace || '-'"></span>
            </div>
            <div class="flex justify-between gap-4 border-b border-gray-100 pb-2">
              <span class="text-gray-400">Tanggal Lahir</span>
              <span class="font-semibold text-right" x-text="selectedStudent?.BirthDate || '-'"></span>
            </div>
            <div class="flex justify-between gap-4 border-b border-gray-100 pb-2">
              <span class="text-gray-400">Lembaga</span>
              <span class="font-semibold text-right" x-text="selectedStudent?.SchoolUnit || '-'"></span>
            </div>
            <div class="flex justify-between gap-4 border-b border-gray-100 pb-2">
              <span class="text-gray-400">Status Tinggal</span>
              <span class="font-semibold text-right" x-text="selectedStudent?.ResidencyStatus || '-'"></span>
            </div>
            <div class="flex justify-between gap-4 border-b border-gray-100 pb-2">
              <span class="text-gray-400">Blok / Kamar</span>
              <span class="font-semibold text-right" x-text="((selectedStudent?.DormitoryBlock || '-') + ' / ' + (selectedStudent?.Room || '-'))"></span>
            </div>
            <div class="flex justify-between gap-4 border-b border-gray-100 pb-2">
              <span class="text-gray-400">Status</span>
              <span class="font-semibold text-right" x-text="selectedStudent?.Status || '-'"></span>
            </div>
          </div>
        </div>

        <div class="space-y-4">
          <div class="rounded-2xl bg-gray-50 border border-gray-100 p-4 text-center">
            <div class="mx-auto h-32 w-32 overflow-hidden rounded-2xl bg-white border border-gray-200 flex items-center justify-center">
              <template x-if="selectedStudent?.PhotoUrl">
                <img :src="selectedStudent.PhotoUrl" alt="Foto santri" class="h-full w-full object-cover" />
              </template>
              <template x-if="!selectedStudent?.PhotoUrl">
                <div class="text-xs text-gray-400 font-bold">Foto belum tersedia</div>
              </template>
            </div>
            <p class="mt-3 text-sm font-bold" x-text="selectedStudent?.Name || '-'"></p>
            <p class="text-xs text-gray-500" x-text="selectedStudent?.NIS || '-'"></p>
          </div>

          <div class="rounded-2xl border border-gray-100 bg-white p-4">
            <h4 class="font-bold mb-3">QR Identitas</h4>
            <template x-if="selectedStudent?.QrImageUrl">
              <img :src="selectedStudent.QrImageUrl" alt="QR identitas santri" class="w-full max-w-[240px] mx-auto rounded-xl border border-gray-100" />
            </template>
            <template x-if="!selectedStudent?.QrImageUrl">
              <div class="app-empty-state">
                <div class="app-empty-icon">QR</div>
                <p class="text-sm">Belum ada QR identitas untuk santri ini.</p>
              </div>
            </template>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="space-y-4">
    <div class="rounded-2xl border border-gray-100 bg-white p-4">
      <h4 class="font-bold mb-3">Kontak & Domisili</h4>
      <div class="space-y-2 text-sm">
        <div class="flex justify-between gap-3">
          <span class="text-gray-400">Orang tua</span>
          <span class="font-semibold text-right" x-text="selectedStudent?.ParentContact || '-'"></span>
        </div>
        <div class="flex justify-between gap-3">
          <span class="text-gray-400">Provinsi</span>
          <span class="font-semibold text-right" x-text="selectedStudent?.Province || '-'"></span>
        </div>
        <div class="flex justify-between gap-3">
          <span class="text-gray-400">Kabupaten</span>
          <span class="font-semibold text-right" x-text="selectedStudent?.Regency || '-'"></span>
        </div>
        <div class="flex justify-between gap-3">
          <span class="text-gray-400">Wali Username</span>
          <span class="font-semibold text-right" x-text="selectedStudent?.WaliUsername || '-'"></span>
        </div>
      </div>
    </div>
  </div>
</div>
