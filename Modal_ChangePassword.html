<!-- Modal Change Password -->
<div
  x-show="showChangePasswordModal"
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4"
  x-cloak
>
  <div class="w-full max-w-md overflow-hidden rounded-3xl bg-white shadow-2xl">
    <div class="border-b border-gray-100 px-6 py-5">
      <p class="text-[11px] font-black uppercase tracking-widest text-[#0f5f4a]">
        Keamanan Akun
      </p>
      <div class="mt-2 flex items-start justify-between gap-4">
        <div>
          <h3 class="text-2xl font-black text-gray-900">Ganti Password</h3>
          <p class="mt-1 text-sm text-gray-500">
            Perbarui password untuk akun yang sedang login.
          </p>
        </div>
        <button
          type="button"
          @click="closeChangePasswordModal()"
          class="rounded-full p-2 text-gray-400 transition-colors hover:bg-gray-100 hover:text-gray-700"
          aria-label="Tutup"
        >
          <svg
            class="h-5 w-5"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            ></path>
          </svg>
        </button>
      </div>
    </div>

    <form class="space-y-4 px-6 py-6" @submit.prevent="submitChangePasswordForm()">
      <div>
        <label class="app-label">Password Lama</label>
        <input
          type="password"
          x-model="changePasswordForm.oldPassword"
          autocomplete="current-password"
          placeholder="Masukkan password lama"
          class="app-input"
          required
        />
      </div>

      <div>
        <label class="app-label">Password Baru</label>
        <input
          type="password"
          x-model="changePasswordForm.newPassword"
          autocomplete="new-password"
          placeholder="Minimal 6 karakter"
          class="app-input"
          required
        />
      </div>

      <div>
        <label class="app-label">Konfirmasi Password Baru</label>
        <input
          type="password"
          x-model="changePasswordForm.confirmPassword"
          autocomplete="new-password"
          placeholder="Ulangi password baru"
          class="app-input"
          required
        />
      </div>

      <div
        x-show="changePasswordError"
        class="rounded-2xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700"
        x-cloak
      >
        <span x-text="changePasswordError"></span>
      </div>

      <div class="flex gap-3 pt-2">
        <button
          type="button"
          @click="closeChangePasswordModal()"
          class="app-btn app-btn-ghost flex-1"
        >
          Batal
        </button>
        <button
          type="submit"
          :disabled="loadingChangePassword"
          class="app-btn app-btn-primary flex-1"
        >
          <span x-show="!loadingChangePassword">Simpan Password</span>
          <span x-show="loadingChangePassword">Menyimpan...</span>
        </button>
      </div>
    </form>
  </div>
</div>
