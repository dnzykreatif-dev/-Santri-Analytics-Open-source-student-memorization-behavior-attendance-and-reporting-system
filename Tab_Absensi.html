                <th class="px-4 py-3 text-center text-xs font-bold text-gray-500 uppercase">Hadir</th>
                <th class="px-4 py-3 text-center text-xs font-bold text-gray-500 uppercase">Izin</th>
                <th class="px-4 py-3 text-center text-xs font-bold text-gray-500 uppercase">Sakit</th>
                <th class="px-4 py-3 text-center text-xs font-bold text-gray-500 uppercase">Alpa</th>
                <th class="px-4 py-3 text-center text-xs font-bold text-gray-500 uppercase">%</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
              <template x-for="row in attendanceRecap?.byStudent || []" :key="row.StudentID">
                <tr>
                  <td class="px-4 py-3 text-sm font-bold text-gray-900" x-text="row.Name"></td>
                  <td class="px-4 py-3 text-sm text-gray-600" x-text="row.ClassOrGroupName"></td>
                  <td class="px-4 py-3 text-sm text-center" x-text="row.hadir"></td>
                  <td class="px-4 py-3 text-sm text-center" x-text="row.izin"></td>
                  <td class="px-4 py-3 text-sm text-center" x-text="row.sakit"></td>
                  <td class="px-4 py-3 text-sm text-center" x-text="row.alpa"></td>
                  <td class="px-4 py-3 text-sm text-center font-black" x-text="row.percentage + '%'"></td>
                </tr>
              </template>
              <tr x-show="!(attendanceRecap?.byStudent || []).length">
                <td colspan="7" class="px-4 py-8 text-center text-gray-500">Belum ada data rekap.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div x-show="showManualAttendanceModal" class="fixed inset-0 z-50 overflow-y-auto" style="display: none;">
      <div class="flex items-center justify-center min-h-screen px-4 pt-4 pb-20 text-center sm:p-0">
        <div class="fixed inset-0 transition-opacity bg-gray-500 bg-opacity-75" @click="showManualAttendanceModal = false"></div>
        <div class="relative inline-block w-full max-w-md p-6 overflow-hidden text-left align-middle transition-all transform bg-white shadow-xl rounded-lg">
          <h3 class="text-lg font-black leading-6 text-gray-900 mb-4">Absensi Manual</h3>
          <div class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-gray-700">Jenis</label>
              <select x-model="manualAttendanceForm.Type" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md">
                <option value="Pondok">Pondok</option>
                <option value="KBM">KBM</option>
                <option value="Kegiatan">Kegiatan</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700">Kelas / Asrama</label>
              <select x-model="manualAttendanceForm.ClassOrGroupName" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md">
                <option value="">-- Pilih Kelas --</option>
                <template x-for="cls in getUniqueClasses()" :key="cls">
                  <option :value="cls" x-text="cls"></option>
                </template>
              </select>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700">Mapel / Kegiatan</label>
              <input type="text" x-model="manualAttendanceForm.SubjectOrActivityName" placeholder="Kehadiran Pondok, Tahfizh, Kajian..." class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md">
            </div>
          </div>
          <div class="mt-6 flex justify-end gap-3">
            <button class="px-4 py-2 text-sm text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50" @click="showManualAttendanceModal = false">Batal</button>
            <button class="px-4 py-2 text-sm text-white bg-blue-600 rounded-lg hover:bg-blue-700" @click="startManualAttendanceSession()">Mulai Absen</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>
