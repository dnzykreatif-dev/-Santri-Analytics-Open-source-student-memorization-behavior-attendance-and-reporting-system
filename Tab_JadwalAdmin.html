<!-- Tab: Manajemen Jadwal -->
<template x-if="currentTab === 'jadwal_admin' && (user?.Role === 'Mudir' || user?.Role === 'Admin')">
  <div class="space-y-6">
    <!-- Header -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
      <div>
        <h2 class="text-2xl font-bold text-gray-800">Manajemen Jadwal</h2>
        <p class="text-gray-600 mt-1">
          Kelola jadwal mengajar KBM dan Kegiatan untuk Ustadz
        </p>
      </div>
      <div class="flex gap-3">
        <button
          @click="loadSchedules()"
          class="px-4 py-2 bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 rounded-lg font-medium flex items-center gap-2"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8 8 0 004.582 9m0 0H9m11 11v-5h-.581m0 0A8.001 8.001 0 014.582 15m15.356 2H15"/></svg>
          Refresh
        </button>
        <button
          @click="openAddScheduleModal()"
          class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium flex items-center gap-2"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
          Tambah Jadwal
        </button>
        <button
          @click="runSeedSchedules()"
          class="px-4 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg font-medium flex items-center gap-2"
          title="Import jadwal KBM dan kegiatan luar KBM dari database master 2026"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
          Import Jadwal Master 2026
        </button>
      </div>
    </div>

    <section class="bg-white border border-gray-200 rounded-lg p-4" aria-label="Audit integritas absensi">
      <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-3">
        <div>
          <h3 class="font-bold text-gray-900">Audit Sinkronisasi Absensi</h3>
          <p class="text-sm text-gray-600">Periksa akun pengajar, jadwal, kelas, santri, dan sesi sebelum memperbaiki data.</p>
        </div>
        <div class="flex flex-wrap gap-2">
          <button type="button" @click="runAttendanceAudit()" :disabled="attendanceAuditLoading"
            class="px-3 py-2 border border-gray-300 rounded-lg text-sm font-bold disabled:opacity-50">
            <span x-text="attendanceAuditLoading ? 'Memeriksa...' : 'Jalankan Audit'"></span>
          </button>
          <button type="button" @click="previewAttendanceRepair()" :disabled="attendanceAuditLoading"
            class="px-3 py-2 border border-blue-300 text-blue-700 rounded-lg text-sm font-bold disabled:opacity-50">
            Pratinjau Perbaikan
          </button>
          <button type="button" @click="applyAttendanceRepair()" :disabled="attendanceAuditLoading || !attendanceRepairPreview"
            class="px-3 py-2 bg-green-700 text-white rounded-lg text-sm font-bold disabled:opacity-50"
            x-text="attendanceRepairConfirming ? 'Klik Lagi untuk Terapkan' : 'Terapkan Perbaikan'">
          </button>
          <button x-show="attendanceRepairConfirming" type="button" @click="attendanceRepairConfirming = false"
            class="px-3 py-2 border border-gray-300 rounded-lg text-sm font-bold">Batal</button>
        </div>
      </div>

      <div x-show="attendanceAudit" class="mt-4">
        <div class="grid grid-cols-2 md:grid-cols-4 gap-2 text-sm">
          <div class="border-l-4 border-blue-500 pl-3 py-1"><strong x-text="attendanceAudit?.summary?.activeSchedules || 0"></strong><br><span class="text-gray-500">Jadwal aktif</span></div>
          <div class="border-l-4 border-green-500 pl-3 py-1"><strong x-text="attendanceAudit?.summary?.students || 0"></strong><br><span class="text-gray-500">Santri aktif</span></div>
          <div class="border-l-4 border-red-500 pl-3 py-1"><strong x-text="attendanceAudit?.summary?.critical || 0"></strong><br><span class="text-gray-500">Kritis</span></div>
          <div class="border-l-4 border-yellow-500 pl-3 py-1"><strong x-text="attendanceAudit?.summary?.warning || 0"></strong><br><span class="text-gray-500">Peringatan</span></div>
        </div>
        <div x-show="attendanceRepairPreview" class="mt-3 p-3 bg-blue-50 border border-blue-200 rounded-lg text-sm text-blue-900">
          Pratinjau siap: <strong x-text="attendanceRepairPreview?.actions?.schedulesRegenerated || 0"></strong> jadwal direkonsiliasi dan
          <strong x-text="attendanceRepairPreview?.actions?.draftSessionsBackedUp || 0"></strong> draft kosong dicadangkan sebelum dibersihkan.
        </div>
        <div x-show="(attendanceAudit?.issues || []).length" class="mt-3 max-h-52 overflow-auto border-t border-gray-200">
          <template x-for="issue in (attendanceAudit?.issues || []).slice(0, 30)" :key="issue.code + ':' + issue.entityId">
            <div class="py-2 border-b border-gray-100 text-sm flex gap-2">
              <span class="font-bold" :class="issue.severity === 'critical' ? 'text-red-700' : 'text-yellow-700'" x-text="issue.severity"></span>
              <span class="text-gray-800" x-text="issue.code"></span>
              <span class="text-gray-500 truncate" x-text="issue.entityId"></span>
            </div>
          </template>
        </div>
      </div>
    </section>

    <!-- Filters -->
    <div class="bg-white rounded-xl p-4 shadow-sm grid grid-cols-1 md:grid-cols-3 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Filter Hari</label>
        <select x-model="scheduleFilterDay" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
          <option value="">Semua Hari</option>
          <option value="Senin">Senin</option>
          <option value="Selasa">Selasa</option>
          <option value="Rabu">Rabu</option>
          <option value="Kamis">Kamis</option>
          <option value="Jumat">Jumat</option>
          <option value="Sabtu">Sabtu</option>
          <option value="Ahad">Ahad</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Pencarian</label>
        <input type="text" x-model="scheduleSearchQuery" placeholder="Cari Ustadz, Mapel, Kelas..." class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
      </div>
    </div>

    <!-- Table -->
    <div class="bg-white rounded-xl shadow-sm overflow-hidden">
      <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200">
          <thead class="bg-gray-50">
            <tr>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Hari</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Tipe</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Waktu</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Mapel/Kegiatan</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Kelas/Asrama</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Pengajar</th>
              <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Aksi</th>
            </tr>
          </thead>
          <tbody class="bg-white divide-y divide-gray-200">
            <template x-for="item in filteredSchedules" :key="item.ScheduleID">
              <tr class="hover:bg-gray-50">
                <td class="px-6 py-4 whitespace-nowrap text-sm font-bold text-gray-900" x-text="item.DayOfWeek"></td>
                <td class="px-6 py-4 whitespace-nowrap text-sm">
                  <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full"
                    :class="item.Type === 'KBM' ? 'bg-blue-100 text-blue-800' : 'bg-purple-100 text-purple-800'"
                    x-text="item.Type"></span>
                </td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 font-medium" x-text="(item.StartTime || '-') + ' - ' + (item.EndTime || '-')"></td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" x-text="item.SubjectOrActivityName"></td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" x-text="item.ClassOrGroupName"></td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" x-text="getUserNameById(item.TeacherID)"></td>
                <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                  <button @click="deleteSchedule(item.ScheduleID)" class="text-red-600 hover:text-red-900">Hapus</button>
                </td>
              </tr>
            </template>
            <tr x-show="filteredSchedules.length === 0">
              <td colspan="7" class="px-6 py-8 text-center text-gray-500">
                Tidak ada jadwal yang ditemukan
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Add Schedule Modal -->
    <div x-show="showAddScheduleModal" class="fixed inset-0 z-50 overflow-y-auto" style="display: none;">
      <div class="flex items-center justify-center min-h-screen px-4 pt-4 pb-20 text-center sm:p-0">
        <div class="fixed inset-0 transition-opacity bg-gray-500 bg-opacity-75" @click="showAddScheduleModal = false"></div>
        <div class="relative inline-block w-full max-w-lg p-6 overflow-hidden text-left align-middle transition-all transform bg-white shadow-xl rounded-2xl">
          <h3 class="text-lg font-medium leading-6 text-gray-900 mb-4">Tambah Jadwal Baru</h3>

          <form @submit.prevent="submitScheduleForm">
            <div class="space-y-4">
              <div>
                <label class="block text-sm font-medium text-gray-700">Tipe Jadwal</label>
                <select x-model="scheduleForm.Type" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                  <option value="Pondok">Pondok (Kehadiran Harian)</option>
                  <option value="KBM">KBM (Akademik)</option>
                  <option value="Kegiatan">Kegiatan (Non-KBM)</option>
                </select>
              </div>

              <div>
                <label class="block text-sm font-medium text-gray-700">Hari</label>
                <select x-model="scheduleForm.DayOfWeek" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                  <option value="">-- Pilih Hari --</option>
                  <option value="Senin">Senin</option>
                  <option value="Selasa">Selasa</option>
                  <option value="Rabu">Rabu</option>
                  <option value="Kamis">Kamis</option>
                  <option value="Jumat">Jumat</option>
                  <option value="Sabtu">Sabtu</option>
                  <option value="Ahad">Ahad</option>
                </select>
              </div>
              <div class="grid grid-cols-2 gap-4">
                <div>
                  <label class="block text-sm font-medium text-gray-700">Jam Mulai</label>
                  <input type="time" x-model="scheduleForm.StartTime" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700">Jam Selesai</label>
                  <input type="time" x-model="scheduleForm.EndTime" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                </div>
              </div>

              <div>
                <label class="block text-sm font-medium text-gray-700">Kelas / Asrama</label>
                <select x-model="scheduleForm.ClassOrGroupName" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                  <option value="">-- Pilih Kelas --</option>
                  <template x-for="cls in getUniqueClasses()" :key="cls">
                    <option :value="cls" x-text="cls"></option>
                  </template>
                </select>
              </div>

              <div x-show="scheduleForm.Type === 'KBM'">
                <label class="block text-sm font-medium text-gray-700">Mata Pelajaran</label>
                <select x-model="scheduleForm.SubjectOrActivityName" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500" :required="scheduleForm.Type === 'KBM'">
                  <option value="">-- Pilih Mapel --</option>
                  <template x-for="sub in academicSetup?.subjects || []" :key="sub.Name">
                    <option :value="sub.Name" x-text="sub.Name"></option>
                  </template>
                </select>
              </div>

              <div x-show="scheduleForm.Type !== 'KBM'">
                <label class="block text-sm font-medium text-gray-700">Nama Kegiatan</label>
                <input type="text" x-model="scheduleForm.SubjectOrActivityName" placeholder="Contoh: Kehadiran Pondok, Kajian Bakti, Halaqoh Subuh" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500" :required="scheduleForm.Type !== 'KBM'">
              </div>

              <div>
                <label class="block text-sm font-medium text-gray-700">Pengajar / Musyrif</label>
                <select x-model="scheduleForm.TeacherID" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                  <option value="">-- Pilih Pengajar --</option>
                  <template x-for="usr in users.filter(u => u.Role === 'Ustadz' || u.Role === 'Mudir')" :key="usr.UserID">
                    <option :value="usr.Username" x-text="usr.Name + ' (@' + usr.Username + ')'"></option>
                  </template>
                </select>
              </div>
            </div>

            <div class="mt-6 flex justify-end gap-3">
              <button type="button" class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50" @click="showAddScheduleModal = false">
                Batal
              </button>
              <button type="submit" class="px-4 py-2 text-sm font-medium text-white bg-blue-600 border border-transparent rounded-lg hover:bg-blue-700" :disabled="loading">
                Simpan Jadwal
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</template>
