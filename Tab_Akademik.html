                    <input
                      type="text"
                      x-model="raportSetup.kitabMap[raportKitabFilterClass + '::' + item.subject]"
                      class="app-input text-xs py-1.5 bg-white border-amber-300 focus:border-emerald-600 focus:ring-1 focus:ring-emerald-500 font-medium"
                      :placeholder="(raportSetup.kitabMap && raportSetup.kitabMap[item.subject]) || item.kitab || 'Kitab Standar'"
                      @input="saveLocalRaportDraft()"
                    />
                    <p class="text-[10px] text-gray-500 flex items-center justify-between flex-wrap gap-1">
                      <span>Rujukan umum: <strong class="text-gray-700" x-text="(raportSetup.kitabMap && raportSetup.kitabMap[item.subject]) || item.kitab || 'Kitab Standar'"></strong></span>
                      <span class="text-gray-400 italic">Boleh dikosongkan jika sama</span>
                    </p>
                  </div>
                </template>
              </div>
            </div>
          </template>
        </div>

        <!-- TOMBOL SIMPAN UTAMA SETUP RAPORT -->
        <div class="pt-4 border-t border-gray-100 flex flex-wrap items-center justify-between gap-3">
          <div class="text-xs text-gray-500 flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <span>Draf tersimpan di perangkat. Terakhir ke server: </span>
            <span class="font-bold text-emerald-800" x-text="lastRaportSavedAt ? ('Pukul ' + lastRaportSavedAt) : 'Belum disimpan ke server'"></span>
          </div>
          <button
            type="button"
            class="app-btn bg-[#0f5f4a] text-white hover:bg-[#0b4939] px-6 py-3 font-black text-sm shadow-md flex items-center gap-2 transition-transform hover:scale-105 active:scale-95"
            :disabled="savingRaportSetup"
            @click="saveRaportSetup()"
          >
            <span>💾</span>
            <span x-text="savingRaportSetup ? 'Menyimpan Pengaturan...' : 'Simpan Seluruh Pengaturan Raport'"></span>
          </button>
        </div>
      </div>

      <!-- STICKY FLOATING SAVE PILL (DIPOSISIKAN SIMETRIS DI TENGAH BAWAH, BEBAS TABRAKAN DENGAN ACTION BUTTONS BROWSER) -->
      <div class="fixed bottom-6 left-1/2 -translate-x-1/2 z-40 bg-white/95 backdrop-blur-md border border-emerald-600/60 shadow-2xl px-4 py-2.5 rounded-full flex items-center gap-4 transition-all">
        <div class="text-xs hidden sm:flex flex-col pl-1">
          <div class="flex items-center gap-1.5 font-black text-gray-900 leading-tight">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <span>Progres Setup Raport</span>
          </div>
          <p class="text-[10px] text-gray-500 leading-tight" x-text="lastRaportSavedAt ? ('Tersimpan di Cloud: ' + lastRaportSavedAt) : (raportDraftSavedAt ? ('Draf Lokal: ' + raportDraftSavedAt) : 'Draf aman di perangkat')"></p>
        </div>
        <button
          type="button"
          class="app-btn bg-[#0f5f4a] hover:bg-[#0b4939] text-white px-4 py-2 rounded-full font-black text-xs shadow-md flex items-center gap-2 transition-transform hover:scale-105 active:scale-95 whitespace-nowrap"
          :disabled="savingRaportSetup"
          @click="saveRaportSetup()"
        >
          <span>💾</span>
          <span x-text="savingRaportSetup ? 'Menyimpan...' : 'Simpan Pengaturan'"></span>
        </button>
      </div>

    </div>

    <!-- ================= SEKSI 4: MASTER PERIODE & MAPEL (LANJUTAN) ================= -->
    <div x-show="academicSection === 'setup' && (user.Role === 'Mudir' || user.Role === 'Admin')" class="grid grid-cols-1 xl:grid-cols-2 gap-6">
      <div class="app-card p-6 bg-white space-y-4">
        <div class="flex items-center justify-between gap-3">
          <div>
            <h3 class="font-black text-gray-900">Periode Raport</h3>
            <p class="text-sm text-gray-500">Draft bisa diedit, Published tampil ke Wali.</p>
          </div>
          <button type="button" class="app-btn app-btn-soft" @click="resetAcademicPeriodForm()">Baru</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <input type="text" x-model="academicPeriodForm.AcademicYear" class="app-input" placeholder="2026/2027" />
          <select x-model="academicPeriodForm.Semester" class="app-input">
            <option value="">Semester</option>
            <option value="Ganjil">Ganjil</option>
            <option value="Genap">Genap</option>
          </select>
          <input type="text" x-model="academicPeriodForm.Title" class="app-input md:col-span-2" placeholder="Raport Semester Ganjil 2026/2027" />
          <input type="date" x-model="academicPeriodForm.StartDate" class="app-input" />
          <input type="date" x-model="academicPeriodForm.EndDate" class="app-input" />
          <select x-show="academicSetup.features?.reportV2" x-model="academicPeriodForm.GradeMode" class="app-input" disabled>
            <option value="SemesterExamOnly">Ujian Semester 100%</option>
            <option value="WeightedComponents">Komponen lama</option>
          </select>
          <label x-show="academicSetup.features?.reportV2" class="text-xs font-bold text-gray-500">
            Ambang kehadiran ujian (%)
            <input type="number" min="0" max="100" step="0.1" x-model.number="academicPeriodForm.AttendanceThreshold" class="app-input mt-1" />
          </label>
        </div>
        <button type="button" class="app-btn app-btn-primary w-full" @click="saveAcademicPeriod()">Simpan Periode</button>

        <div class="space-y-2 max-h-80 overflow-y-auto">
          <template x-for="period in academicSetup.periods" :key="period.PeriodID">
            <div class="rounded-xl border p-3 flex items-center justify-between gap-3">
              <button type="button" class="text-left min-w-0" @click="editAcademicPeriod(period)">
                <p class="font-bold text-gray-900 truncate" x-text="period.Title"></p>
                <p class="text-xs text-gray-500" x-text="period.AcademicYear + ' - ' + period.Semester"></p>
              </button>
              <div class="flex items-center gap-2">
                <span class="app-badge" :class="period.Status === 'Published' ? 'app-badge-success' : 'app-badge-warning'" x-text="period.Status"></span>
                <button type="button" class="app-btn app-btn-soft text-xs" @click="setAcademicPeriodStatus(period, period.Status === 'Published' ? 'Draft' : 'Published')">
                  <span x-text="period.Status === 'Published' ? 'Buka Draft' : 'Publish'"></span>
                </button>
              </div>
            </div>
          </template>
        </div>
      </div>

      <div class="app-card p-6 bg-white space-y-4">
        <div class="flex items-center justify-between gap-3">
          <div>
            <h3 class="font-black text-gray-900">Master Mata Pelajaran</h3>
            <p class="text-sm text-gray-500">Bisa dibatasi jenjang, gender, atau kelas tertentu.</p>
          </div>
          <button type="button" class="app-btn app-btn-soft" @click="resetAcademicSubjectForm()">Baru</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <input type="text" x-model="academicSubjectForm.Name" class="app-input md:col-span-2" placeholder="Nama mapel" />
          <select x-model="academicSubjectForm.Category" class="app-input">
            <option value="Agama">Agama</option>
            <option value="Umum">Umum</option>
          </select>
          <select x-model="academicSubjectForm.Level" class="app-input">
            <option value="Semua">Semua jenjang</option>
            <option value="SMP">SMP</option>
            <option value="SMA">SMA</option>
          </select>
          <select x-model="academicSubjectForm.Gender" class="app-input">
            <option value="Semua">Ikhwan & Akhwat</option>
            <option value="Ikhwan">Ikhwan</option>
            <option value="Akhwat">Akhwat</option>
          </select>
          <input type="number" x-model="academicSubjectForm.DefaultKKM" class="app-input" placeholder="KKM" />
          <input type="text" x-model="academicSubjectForm.Classes" class="app-input md:col-span-2" placeholder="Kelas khusus, pisahkan koma. Kosong = semua" />
          <label class="inline-flex items-center gap-2 text-sm font-bold text-gray-600">
            <input type="checkbox" x-model="academicSubjectForm.IsActive" />
            Aktif
          </label>
        </div>
        <button type="button" class="app-btn app-btn-primary w-full" @click="saveAcademicSubject()">Simpan Mapel</button>

        <div class="space-y-2 max-h-80 overflow-y-auto">
          <template x-for="subject in academicSetup.subjects" :key="subject.SubjectID">
            <button type="button" class="w-full rounded-xl border p-3 text-left hover:bg-gray-50" @click="editAcademicSubject(subject)">
              <div class="flex items-center justify-between gap-3">
                <p class="font-bold text-gray-900" x-text="subject.Name"></p>
                <span class="app-badge" :class="subject.IsActive ? 'app-badge-success' : 'app-badge-danger'" x-text="subject.IsActive ? 'Aktif' : 'Nonaktif'"></span>
              </div>
              <p class="text-xs text-gray-500" x-text="(subject.Category || 'Umum') + ' / ' + (subject.Level || 'Semua') + ' / ' + (subject.Gender || 'Semua')"></p>
            </button>
          </template>
        </div>
      </div>
    </div>

    <!-- ================= SEKSI 5: PROFIL AKADEMIK SANTRI ================= -->
    <div x-show="academicSection === 'profil' && (user.Role === 'Mudir' || user.Role === 'Admin')" class="app-card p-6 bg-white">
      <h3 class="font-black text-gray-900 mb-4">Profil Akademik Santri</h3>
      <div class="overflow-x-auto">
        <table class="w-full min-w-[680px] text-sm">
          <thead>
            <tr class="text-left text-gray-400 border-b">
              <th class="py-3">Santri</th>
              <th class="py-3">Kelas</th>
              <th class="py-3">Jenjang</th>
              <th class="py-3">Gender</th>
              <th class="py-3 text-right">Aksi</th>
            </tr>
          </thead>
          <tbody class="divide-y">
            <template x-for="student in students" :key="student.StudentID">
              <tr>
                <td class="py-3 font-bold" x-text="student.Name"></td>
                <td class="py-3" x-text="student['Class/Level']"></td>
                <td class="py-3">
                  <select x-model="student.Level" class="app-input w-28">
                    <option value="">Auto</option>
                    <option value="SMP">SMP</option>
                    <option value="SMA">SMA</option>
                  </select>
                </td>
                <td class="py-3">
                  <select x-model="student.Gender" class="app-input w-32">
                    <option value="">Belum diisi</option>
                    <option value="Ikhwan">Ikhwan</option>
                    <option value="Akhwat">Akhwat</option>
                  </select>
                </td>
                <td class="py-3 text-right">
                  <button type="button" class="app-btn app-btn-soft text-xs" @click="saveStudentAcademicProfile(student)">
                    Simpan
                  </button>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</template>
