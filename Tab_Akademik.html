        <button type="button" class="app-btn app-btn-primary w-full" @click="saveAcademicPeriod()">Simpan Periode</button>

        <div class="space-y-2 max-h-80 overflow-y-auto">
          <template x-for="period in academicSetup.periods" :key="period.PeriodID">
            <div class="rounded-xl border p-3 flex items-center justify-between gap-3">
              <button type="button" class="text-left min-w-0" @click="editAcademicPeriod(period)">
                <p class="font-bold text-gray-900 truncate" x-text="period.Title"></p>
                <p class="text-xs text-gray-500" x-text="period.AcademicYear + ' - ' + period.Semester"></p>
              </button>
              <div class="flex items-center gap-2">
                <span class="app-badge" :class="period.Status === 'Published' ? 'app-badge-success' : 'app-badge-warning'" x-text="period.Status"></span>
                <button type="button" class="app-btn app-btn-soft text-xs" @click="setAcademicPeriodStatus(period, period.Status === 'Published' ? 'Draft' : 'Published')">
                  <span x-text="period.Status === 'Published' ? 'Buka Draft' : 'Publish'"></span>
                </button>
              </div>
            </div>
          </template>
        </div>
      </div>

      <div class="app-card p-6 bg-white space-y-4">
        <div class="flex items-center justify-between gap-3">
          <div>
            <h3 class="font-black text-gray-900">Master Mata Pelajaran</h3>
            <p class="text-sm text-gray-500">Bisa dibatasi jenjang, gender, atau kelas tertentu.</p>
          </div>
          <button type="button" class="app-btn app-btn-soft" @click="resetAcademicSubjectForm()">Baru</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <input type="text" x-model="academicSubjectForm.Name" class="app-input md:col-span-2" placeholder="Nama mapel" />
          <select x-model="academicSubjectForm.Category" class="app-input">
            <option value="Umum">Umum</option>
            <option value="Agama">Agama</option>
          </select>
          <select x-model="academicSubjectForm.Level" class="app-input">
            <option value="Semua">Semua jenjang</option>
            <option value="SMP">SMP</option>
            <option value="SMA">SMA</option>
          </select>
          <select x-model="academicSubjectForm.Gender" class="app-input">
            <option value="Semua">Ikhwan & Akhwat</option>
            <option value="Ikhwan">Ikhwan</option>
            <option value="Akhwat">Akhwat</option>
          </select>
          <input type="number" x-model="academicSubjectForm.DefaultKKM" class="app-input" placeholder="KKM" />
          <input type="text" x-model="academicSubjectForm.Classes" class="app-input md:col-span-2" placeholder="Kelas khusus, pisahkan koma. Kosong = semua" />
          <label class="inline-flex items-center gap-2 text-sm font-bold text-gray-600">
            <input type="checkbox" x-model="academicSubjectForm.IsActive" />
            Aktif
          </label>
        </div>
        <button type="button" class="app-btn app-btn-primary w-full" @click="saveAcademicSubject()">Simpan Mapel</button>

        <div class="space-y-2 max-h-80 overflow-y-auto">
          <template x-for="subject in academicSetup.subjects" :key="subject.SubjectID">
            <button type="button" class="w-full rounded-xl border p-3 text-left hover:bg-gray-50" @click="editAcademicSubject(subject)">
              <div class="flex items-center justify-between gap-3">
                <p class="font-bold text-gray-900" x-text="subject.Name"></p>
                <span class="app-badge" :class="subject.IsActive ? 'app-badge-success' : 'app-badge-danger'" x-text="subject.IsActive ? 'Aktif' : 'Nonaktif'"></span>
              </div>
              <p class="text-xs text-gray-500" x-text="(subject.Category || 'Umum') + ' / ' + (subject.Level || 'Semua') + ' / ' + (subject.Gender || 'Semua')"></p>
            </button>
          </template>
        </div>
      </div>

      <div x-show="academicSetup.features?.reportV2" class="app-card p-6 bg-white space-y-4 xl:col-span-2">
        <div class="flex flex-wrap items-center justify-between gap-3">
          <div>
            <h3 class="font-black text-gray-900">Penugasan Guru Akademik</h3>
            <p class="text-sm text-gray-500">Penugasan ini membatasi input nilai dan akses raport guru.</p>
          </div>
          <div class="flex gap-2">
            <button type="button" class="app-btn app-btn-soft" @click="resetAcademicAssignmentForm()">Baru</button>
            <button type="button" class="app-btn app-btn-soft" @click="syncAcademicAssignments()">Sinkronkan Jadwal</button>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-3">
          <select x-model="academicAssignmentForm.PeriodID" class="app-input">
            <option value="">Periode</option>
            <template x-for="period in academicSetup.periods" :key="period.PeriodID">
              <option :value="period.PeriodID" x-text="period.Title"></option>
            </template>
          </select>
          <select x-model="academicAssignmentForm.SubjectID" class="app-input">
            <option value="">Mapel</option>
            <template x-for="subject in academicSetup.subjects" :key="subject.SubjectID">
              <option :value="subject.SubjectID" x-text="subject.Name"></option>
            </template>
          </select>
          <input type="text" x-model="academicAssignmentForm.ClassOrGroupName" class="app-input" placeholder="Kelas" />
          <select x-model="academicAssignmentForm.TeacherSourceID" @change="applyAcademicAssignmentTeacher()" class="app-input">
            <option value="">Guru</option>
            <template x-for="teacher in academicSetup.teacherOptions || []" :key="teacher.TeacherSourceID || teacher.TeacherID">
              <option :value="teacher.TeacherSourceID || teacher.TeacherID" x-text="teacher.TeacherID || teacher.TeacherSourceID"></option>
            </template>
          </select>
        </div>
        <button type="button" class="app-btn app-btn-primary" @click="saveAcademicAssignment()">Simpan Penugasan</button>

        <div class="overflow-x-auto">
          <table class="w-full min-w-[720px] text-sm">
            <thead><tr class="text-left text-gray-400 border-b"><th class="py-3">Periode</th><th class="py-3">Mapel</th><th class="py-3">Kelas</th><th class="py-3">Guru</th><th class="py-3 text-right">Status</th></tr></thead>
            <tbody class="divide-y">
              <template x-for="assignment in academicSetup.assignments || []" :key="assignment.AssignmentID">
                <tr>
                  <td class="py-3" x-text="academicPeriodTitle(assignment.PeriodID)"></td>
                  <td class="py-3" x-text="academicSubjectName(assignment.SubjectID)"></td>
                  <td class="py-3 font-bold" x-text="assignment.ClassOrGroupName"></td>
                  <td class="py-3" x-text="assignment.TeacherID || assignment.TeacherSourceID"></td>
                  <td class="py-3 text-right">
                    <button type="button" class="app-btn app-btn-soft text-xs" @click="setAcademicAssignmentStatus(assignment, !assignment.IsActive)" x-text="assignment.IsActive ? 'Nonaktifkan' : 'Aktifkan'"></button>
                    <button type="button" class="app-btn app-btn-soft text-xs" @click="editAcademicAssignment(assignment)">Edit</button>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>

      <div class="app-card p-6 bg-white space-y-4 xl:col-span-2">
        <h3 class="font-black text-gray-900">Komponen dan Bobot Nilai</h3>
        <div class="grid grid-cols-1 md:grid-cols-6 gap-3">
          <select x-model="academicComponentForm.PeriodID" class="app-input md:col-span-2">
            <option value="">Periode</option>
            <template x-for="period in academicSetup.periods" :key="period.PeriodID">
              <option :value="period.PeriodID" x-text="period.Title"></option>
            </template>
          </select>
          <select x-model="academicComponentForm.SubjectID" class="app-input md:col-span-2">
            <option value="">Mapel</option>
            <template x-for="subject in academicSetup.subjects" :key="subject.SubjectID">
              <option :value="subject.SubjectID" x-text="subject.Name"></option>
            </template>
          </select>
          <input type="text" x-model="academicComponentForm.Name" class="app-input" placeholder="Komponen" />
          <input type="number" x-model="academicComponentForm.Weight" class="app-input" placeholder="Bobot %" />
          <input type="number" x-model="academicComponentForm.MaxScore" class="app-input" placeholder="Maks" />
          <input type="number" x-model="academicComponentForm.SortOrder" class="app-input" placeholder="Urut" />
          <label class="inline-flex items-center gap-2 text-sm font-bold text-gray-600">
            <input type="checkbox" x-model="academicComponentForm.IsActive" />
            Aktif
          </label>
          <button type="button" class="app-btn app-btn-primary md:col-span-2" @click="saveAssessmentComponent()">Simpan Komponen</button>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead>
              <tr class="text-left text-gray-400 border-b">
                <th class="py-3">Periode</th>
                <th class="py-3">Mapel</th>
                <th class="py-3">Komponen</th>
                <th class="py-3">Bobot</th>
                <th class="py-3">Status</th>
              </tr>
            </thead>
            <tbody class="divide-y">
              <template x-for="component in academicSetup.components" :key="component.ComponentID">
                <tr class="cursor-pointer hover:bg-gray-50" @click="editAssessmentComponent(component)">
                  <td class="py-3" x-text="academicPeriodTitle(component.PeriodID)"></td>
                  <td class="py-3" x-text="academicSubjectName(component.SubjectID)"></td>
                  <td class="py-3 font-bold" x-text="component.Name"></td>
                  <td class="py-3" x-text="component.Weight + '%'"></td>
                  <td class="py-3" x-text="component.IsActive ? 'Aktif' : 'Nonaktif'"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div x-show="academicSection === 'profil' && (user.Role === 'Mudir' || user.Role === 'Admin')" class="app-card p-6 bg-white">
      <h3 class="font-black text-gray-900 mb-4">Profil Akademik Santri</h3>
      <div class="overflow-x-auto">
        <table class="w-full min-w-[680px] text-sm">
          <thead>
            <tr class="text-left text-gray-400 border-b">
              <th class="py-3">Santri</th>
              <th class="py-3">Kelas</th>
              <th class="py-3">Jenjang</th>
              <th class="py-3">Gender</th>
              <th class="py-3 text-right">Aksi</th>
            </tr>
          </thead>
          <tbody class="divide-y">
            <template x-for="student in students" :key="student.StudentID">
              <tr>
                <td class="py-3 font-bold" x-text="student.Name"></td>
                <td class="py-3" x-text="student['Class/Level']"></td>
                <td class="py-3">
                  <select x-model="student.Level" class="app-input w-28">
                    <option value="">Auto</option>
                    <option value="SMP">SMP</option>
                    <option value="SMA">SMA</option>
                  </select>
                </td>
                <td class="py-3">
                  <select x-model="student.Gender" class="app-input w-32">
                    <option value="">Belum diisi</option>
                    <option value="Ikhwan">Ikhwan</option>
                    <option value="Akhwat">Akhwat</option>
                  </select>
                </td>
                <td class="py-3 text-right">
                  <button type="button" class="app-btn app-btn-soft text-xs" @click="saveStudentAcademicProfile(student)">
                    Simpan
                  </button>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</template>
