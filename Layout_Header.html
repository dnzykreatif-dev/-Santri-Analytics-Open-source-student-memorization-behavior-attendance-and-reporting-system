<!-- Layout Header -->
<header class="app-topbar">
  <div class="min-w-0">
    <p class="text-[11px] font-black text-[#0f5f4a] uppercase tracking-widest">
      Santri Analytics
    </p>
    <h1 class="text-lg md:text-xl font-black text-gray-900 truncate">
      Assalamu'alaykum,
      <span x-text="user?.Name || user?.Username || 'User'"></span>
    </h1>
    <p class="text-xs text-gray-500">
      <span x-text="user?.Role || '-'"></span>
      <span class="hidden sm:inline"> - Monitor hafalan dan perilaku santri</span>
    </p>
  </div>

  <div class="flex items-center gap-2">
    <div class="hidden md:flex items-center gap-2 px-3 py-2 rounded-full bg-emerald-50">
      <span
        class="text-sm font-black text-emerald-700"
        x-text="summary.totalStudents || students.length || 0"
      ></span>
      <span class="text-xs font-bold text-emerald-600">Santri</span>
    </div>

    <div
      class="w-10 h-10 rounded-2xl bg-gradient-islamic text-white flex items-center justify-center font-black shadow-sm"
      x-text="(user?.Name || user?.Username || 'U').charAt(0).toUpperCase()"
    ></div>

    <button
      type="button"
      @click="logout()"
      class="app-btn app-btn-danger hidden sm:inline-flex"
    >
      <span class="w-4 h-4 inline-flex items-center justify-center" x-html="navIcon('logout')"></span>
      Keluar
    </button>
  </div>
</header>
