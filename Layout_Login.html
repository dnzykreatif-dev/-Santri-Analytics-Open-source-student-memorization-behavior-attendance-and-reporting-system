<!-- Layout Login -->
<div
  x-show="!isLoggedIn && !showRegister"
  class="min-h-screen flex items-center justify-center px-4 py-8"
  x-cloak
>
  <section class="login-upgrade-shell w-full max-w-md">
    <div class="app-card login-upgrade-card p-7 sm:p-8">
      <div class="text-center mb-7">
        <div class="login-upgrade-mark mx-auto mb-4">SA</div>
        <p class="text-[11px] font-black text-[#0f5f4a] uppercase tracking-widest">
          Santri Analytics
        </p>
        <h1 class="text-3xl font-black text-gray-900 mt-2">
          Masuk Dashboard
        </h1>
        <p class="text-sm text-gray-500 mt-2">
          Pilih role agar form login menyesuaikan kebutuhan pengguna.
        </p>
      </div>

      <div x-show="!loginRole" class="space-y-3">
        <button
          type="button"
          class="login-role-card-upgrade"
          @click="selectLoginRole('admin')"
        >
          <span class="login-role-icon-upgrade bg-emerald-50 text-emerald-700">A</span>
          <span class="min-w-0 flex-1">
            <span class="block font-black text-gray-900">Mudir / Admin</span>
            <span class="block text-xs text-gray-500 mt-1">
              Akses manajemen, data santri, user, dan health check.
            </span>
          </span>
        </button>

        <button
          type="button"
          class="login-role-card-upgrade"
          @click="selectLoginRole('ustadz')"
        >
          <span class="login-role-icon-upgrade bg-blue-50 text-blue-700">U</span>
          <span class="min-w-0 flex-1">
            <span class="block font-black text-gray-900">Ustadz</span>
            <span class="block text-xs text-gray-500 mt-1">
              Input hafalan, perilaku, keterangan, dan aktivitas harian.
            </span>
          </span>
        </button>

        <button
          type="button"
          class="login-role-card-upgrade"
          @click="selectLoginRole('wali')"
        >
          <span class="login-role-icon-upgrade bg-amber-50 text-amber-700">W</span>
          <span class="min-w-0 flex-1">
            <span class="block font-black text-gray-900">Wali Santri</span>
            <span class="block text-xs text-gray-500 mt-1">
              Pantau perkembangan dan laporan santri terkait.
            </span>
          </span>
        </button>
      </div>

      <form x-show="loginRole" class="space-y-5" @submit.prevent="handleLogin">
        <button
          type="button"
          class="app-btn app-btn-ghost px-0 min-h-0"
          @click="resetLoginRole()"
        >
          &larr; Ganti role
        </button>

        <div class="login-selected-role-upgrade">
          <span
            class="login-role-icon-upgrade bg-emerald-50 text-emerald-700"
            x-text="loginRoleIcon()"
          ></span>
          <span>
            <span class="block text-[11px] font-black text-gray-400 uppercase">
              Login sebagai
            </span>
            <span
              class="block font-black text-gray-900"
              x-text="loginRoleLabel()"
            ></span>
          </span>
        </div>

        <div>
          <label class="app-label" x-text="loginIdentityLabel()"></label>
          <input
            type="text"
            x-model="loginForm.username"
            :placeholder="loginIdentityPlaceholder()"
            :autocomplete="loginRole === 'wali' ? 'tel' : 'username'"
            :inputmode="loginRole === 'wali' ? 'tel' : 'text'"
            class="app-input"
            required
          />
        </div>

        <div>
          <label class="app-label">Password</label>
          <input
            type="password"
            x-model="loginForm.password"
            placeholder="Masukkan password"
            autocomplete="current-password"
            class="app-input"
            required
          />
        </div>

        <button
          type="submit"
          class="app-btn app-btn-primary w-full"
          :disabled="loading"
        >
          <span x-show="!loading">Masuk ke Dashboard</span>
          <span x-show="loading">Memproses...</span>
        </button>

        <p
          x-show="loginRole === 'wali'"
          class="text-xs text-gray-400 text-center"
        >
          Wali dapat memakai No HP terdaftar atau username yang sudah dibuat.
        </p>

        <p x-show="error" x-text="error" class="text-red-500 text-sm text-center"></p>

        <button
          type="button"
          @click="showRegister = true; resetLoginRole()"
          class="w-full text-xs font-bold text-gray-500 hover:text-[#0f5f4a]"
        >
          Daftar akun wali santri
        </button>
      </form>
    </div>
  </section>
</div>
