<!-- Tab Perilaku List -->
<!-- TAB: LIST PERILAKU -->
<div
  x-show="currentTab === 'list_perilaku'"
  x-transition:enter="transition ease-out duration-300"
  class="space-y-6"
>
  <div class="bento-card p-6 bg-white">
    <div class="flex flex-col md:flex-row md:justify-between md:items-center gap-4 mb-6">
      <div>
        <h3 class="font-bold text-xl text-gray-800">Daftar Kasus Perilaku</h3>
        <p
          class="text-xs text-gray-400 mt-1"
          x-text="filteredRecentIncidents.length + ' catatan ditampilkan berdasarkan filter'"
        ></p>
      </div>
      <button
        @click="currentTab = 'pelanggaran'"
        class="bg-red-500 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-sm"
      >
        + Tambah Catatan
      </button>
    </div>
    <div class="flex flex-wrap gap-2 mb-4">
      <button
        type="button"
        @click="globalBehaviorFilter = 'all'; globalBehaviorVisibleCount = 5"
        class="px-3 py-1 rounded-full text-xs font-bold border"
        :class="globalBehaviorFilter === 'all' ? 'bg-gray-800 text-white border-gray-800' : 'bg-white text-gray-500 border-gray-200'"
      >
        Semua
      </button>
      <button
        type="button"
        @click="globalBehaviorFilter = 'Violation'; globalBehaviorVisibleCount = 5"
        class="px-3 py-1 rounded-full text-xs font-bold border"
        :class="globalBehaviorFilter === 'Violation' ? 'bg-red-500 text-white border-red-500' : 'bg-white text-gray-500 border-gray-200'"
      >
        Pelanggaran
      </button>
      <button
        type="button"
        @click="globalBehaviorFilter = 'Improvement'; globalBehaviorVisibleCount = 5"
        class="px-3 py-1 rounded-full text-xs font-bold border"
        :class="globalBehaviorFilter === 'Improvement' ? 'bg-green-500 text-white border-green-500' : 'bg-white text-gray-500 border-gray-200'"
      >
        Prestasi
      </button>
    </div>
    <div class="space-y-4">
      <template x-if="filteredRecentIncidents.length === 0">
        <p class="text-center text-gray-400 py-10">
          Belum ada catatan perilaku.
        </p>
      </template>
      <template x-for="inc in visibleRecentIncidents" :key="inc.IncidentID">
        <div
          class="p-4 border border-gray-100 rounded-xl hover:bg-red-50 transition-all border-l-4"
          :class="inc.IncidentType === 'Violation' ? 'border-red-400' : 'border-green-400'"
        >
          <div class="flex justify-between items-start">
            <div class="flex-1">
              <div class="flex justify-between items-center mb-1">
                <p
                  class="font-bold text-gray-900 cursor-pointer hover:text-blue-600"
                  @click="openStudentDetail(students.find(s => s.StudentID === inc.StudentID))"
                  x-text="inc.StudentName"
                ></p>
                <span
                  class="text-[10px] font-bold px-2 py-1 rounded"
                  :class="inc.IncidentType === 'Violation' ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'"
                  x-text="behaviorTypeLabel(inc.IncidentType)"
                ></span>
              </div>
              <p
                class="text-sm text-gray-600 mt-1"
                x-text="inc.Description"
              ></p>
              <div class="flex justify-between items-center mt-2">
                <p
                  class="text-[10px] text-gray-400 font-mono"
                  x-text="formatDate(inc.DateOfIncident) + ' • ' + inc.Points + ' Poin • Ustadz: ' + inc.ReportedBy"
                ></p>
                <!-- Edit & Delete Buttons (only for Mudir/Ustadz) -->
                <template
                  x-if="user?.Role === 'Mudir' || user?.Role === 'Ustadz'"
                >
                  <div class="flex gap-2">
                    <button
                      @click.stop="editPerilaku(inc); currentTab = 'pelanggaran'"
                      class="text-[10px] text-blue-500 font-bold hover:underline"
                    >
                      Edit
                    </button>
                    <button
                      @click.stop="deletePerilaku(inc.IncidentID)"
                      class="text-[10px] text-red-500 font-bold hover:underline"
                    >
                      Hapus
                    </button>
                  </div>
                </template>
              </div>
            </div>
          </div>
        </div>
      </template>
      <button
        x-show="hasMoreRecentIncidents"
        type="button"
        @click="globalBehaviorVisibleCount += 5"
        class="w-full py-2 rounded-xl bg-gray-100 text-gray-600 text-xs font-bold hover:bg-gray-200"
      >
        Muat Lagi
      </button>
    </div>
  </div>
</div>
