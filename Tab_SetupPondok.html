<template x-if="currentTab === 'setup_pondok' && (user.Role === 'Mudir' || user.Role === 'Admin')">
  <div class="space-y-6">
    <div class="flex flex-col gap-4 md:flex-row md:items-end md:justify-between">
      <div>
        <p class="text-xs font-bold uppercase tracking-[0.18em] text-emerald-700">Produk & Setup</p>
        <h2 class="mt-1 text-2xl font-bold text-gray-900">Setup Pondok</h2>
        <p class="mt-1 text-sm text-gray-600">Pusat persiapan aplikasi untuk pondok ini, demo calon pembeli, dan paket fitur.</p>
      </div>
      <button type="button" class="app-btn app-btn-primary" @click="loadProductReadiness()" :disabled="productLoading">
        Refresh
      </button>
    </div>

    <div class="grid grid-cols-1 gap-4 md:grid-cols-4">
      <div class="rounded-lg border border-emerald-100 bg-white p-4 shadow-sm">
        <p class="text-xs font-bold uppercase text-gray-500">Kesiapan</p>
        <p class="mt-2 text-3xl font-bold text-emerald-700" x-text="productSetupPercent + '%'"></p>
        <p class="mt-1 text-xs text-gray-500" x-text="(productReadiness.summary.checklistDone || 0) + ' dari ' + (productReadiness.summary.checklistTotal || 0) + ' selesai'"></p>
      </div>
      <div class="rounded-lg border border-blue-100 bg-white p-4 shadow-sm">
        <p class="text-xs font-bold uppercase text-gray-500">Paket</p>
        <p class="mt-2 text-xl font-bold text-gray-900" x-text="productEntitlements.packageName || productSettingsForm.PRODUCT_PACKAGE_NAME || 'Internal'"></p>
        <p class="mt-1 text-xs text-gray-500" x-text="'Mode modul: ' + (productEntitlements.gatingMode || 'off')"></p>
      </div>
      <div class="rounded-lg border border-amber-100 bg-white p-4 shadow-sm">
        <p class="text-xs font-bold uppercase text-gray-500">Modul Aktif</p>
        <p class="mt-2 text-3xl font-bold text-amber-700" x-text="productReadiness.summary.activeModules || 0"></p>
        <p class="mt-1 text-xs text-gray-500">Fitur yang masuk paket pondok</p>
      </div>
      <div class="rounded-lg border border-purple-100 bg-white p-4 shadow-sm">
        <p class="text-xs font-bold uppercase text-gray-500">Akun Demo</p>
        <p class="mt-2 text-3xl font-bold text-purple-700" x-text="(productReadiness.demoAccounts || []).length"></p>
        <p class="mt-1 text-xs text-gray-500" x-text="'Mode demo: ' + (productSettingsForm.DEMO_MODE || 'off')"></p>
      </div>
    </div>

    <div class="rounded-lg border border-slate-200 bg-slate-50 p-4 shadow-sm">
      <div class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
        <div>
          <p class="text-xs font-bold uppercase tracking-wide text-slate-500">Kepemilikan Instalasi</p>
          <p class="mt-1 text-sm font-semibold text-slate-900" x-text="productReadiness.installation?.mode === 'tenant' ? 'Mode pondok aktif' : 'Mode lama / kompatibilitas'"></p>
          <p class="mt-1 text-xs text-slate-600" x-text="productReadiness.installation?.note || 'Periksa konfigurasi instalasi.'"></p>
        </div>
        <div class="flex items-center gap-3">
          <span class="rounded-full px-3 py-1 text-xs font-bold" :class="productReadiness.installation?.ready ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'" x-text="productReadiness.installation?.ready ? 'Siap diserahterimakan' : 'Perlu dilengkapi'"></span>
          <span class="text-xs text-slate-500" x-text="productReadiness.installation?.tenantId ? 'TenantID: ' + productReadiness.installation.tenantId : 'TenantID belum diisi'"></span>
        </div>
      </div>
    </div>

    <div class="rounded-lg border border-indigo-100 bg-indigo-50 p-4 shadow-sm">
      <div class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
        <div>
          <p class="text-xs font-bold uppercase tracking-wide text-indigo-700">Versi Aplikasi</p>
          <p class="mt-1 text-sm font-semibold text-indigo-950" x-text="'Wrapper ' + (productReadiness.release?.wrapperVersion || '-') + ' | Inti lokal ' + (productReadiness.release?.localCoreVersion || '-')"></p>
          <p class="mt-1 text-xs text-indigo-800" x-text="productReadiness.release?.note || 'Status versi belum diperiksa.'"></p>
        </div>
        <div class="flex items-center gap-3">
          <span class="rounded-full bg-white px-3 py-1 text-xs font-bold text-indigo-800" x-text="productReadiness.release?.sharedCore?.channel || 'stable'"></span>
          <span class="rounded-full px-3 py-1 text-xs font-bold" :class="productReadiness.release?.updateReady ? 'bg-emerald-100 text-emerald-800' : 'bg-white text-indigo-800'" x-text="productReadiness.release?.updateReady ? 'Inti bersama tercatat' : 'Belum terhubung'"></span>
        </div>
      </div>
    </div>

    <!-- Tab Navigasi Setup Pondok: 2 Mode Utama yang Jelas -->
    <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between border-b border-gray-200 pb-3">
      <div class="flex flex-wrap items-center gap-2">
        <button type="button" class="app-btn flex items-center gap-2 py-2 px-4"
          :class="productSection === 'wizard' ? 'app-btn-primary shadow-sm' : 'app-btn-soft'"
          @click="productSection = 'wizard'">
          <span class="font-bold">🚀 1. Wizard Setup (Pondok Aktif)</span>
          <span class="rounded-full bg-emerald-800/20 px-2 py-0.5 text-xs font-semibold"
            x-text="(productReadiness.summary.checklistDone || 0) + '/' + (productReadiness.summary.checklistTotal || 0) + ' Selesai'"></span>
        </button>

        <button type="button" class="app-btn flex items-center gap-2 py-2 px-4"
          :class="productSection === 'workspace' ? 'app-btn-primary shadow-sm' : 'app-btn-soft'"
          @click="loadActiveSetupWorkspace()">
          <span class="font-bold">📋 2. Riwayat Setup & Kontrol Pelanggan</span>
          <span class="rounded-full bg-blue-800/20 px-2 py-0.5 text-xs font-semibold"
            x-text="(productReadiness.workspaces || []).length + ' Pondok'"></span>
        </button>
      </div>

      <!-- Mode Detail / Lanjutan (Opsional) -->
      <div class="flex items-center gap-1.5 self-end sm:self-auto">
        <span class="text-xs text-gray-400 font-medium">Tabel Detail:</span>
        <button type="button" class="text-xs px-2.5 py-1.5 rounded-md border font-semibold transition"
          :class="['modul', 'checklist', 'demo'].includes(productSection) ? 'bg-slate-800 text-white border-slate-800' : 'bg-white text-gray-700 border-gray-300 hover:bg-gray-50'"
          @click="productSection = ['modul', 'checklist', 'demo'].includes(productSection) ? 'wizard' : 'modul'"
          title="Tabel teknis modul, checklist, dan akun demo">
          ⚙️ Modul & Teknis
        </button>
      </div>
    </div>

    <section x-show="productSection === 'workspace'" class="space-y-5">
      <div class="rounded-lg border border-emerald-100 bg-emerald-50 p-5 shadow-sm">
        <div class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
          <div>
            <h3 class="text-lg font-bold text-emerald-950">Riwayat Setup & Kontrol Pelanggan Pondok</h3>
            <p class="mt-1 text-sm text-emerald-900">Semua progres setup tercatat otomatis di sini. Jika terjadi kendala di tengah jalan, Anda bisa langsung memilih <strong>Lanjutkan Setup</strong> dari langkah terakhir atau <strong>Hapus</strong> riwayat. Saat aplikasi dijual, kelola data paket, layanan, pembayaran, dan masa aktif seluruh pondok dari satu panel ini.</p>
          </div>
          <div class="flex flex-wrap gap-2">
            <button type="button" class="app-btn app-btn-soft" @click="startNewSetupWorkspace()">+ Setup Pondok Baru</button>
            <button type="button" class="app-btn app-btn-primary" @click="productSection = 'wizard'">Buka Wizard Setup</button>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-1 gap-4 md:grid-cols-4">
        <div class="rounded-lg border border-gray-200 bg-white p-4 shadow-sm">
          <p class="text-xs font-bold uppercase text-gray-500">Total Pondok Tercatat</p>
          <p class="mt-2 text-3xl font-bold text-gray-900" x-text="workspaceStats.total"></p>
          <p class="mt-1 text-xs text-emerald-700" x-text="workspaceStats.active + ' aktif / siap pakai'"></p>
        </div>
        <div class="rounded-lg border border-amber-200 bg-white p-4 shadow-sm">
          <p class="text-xs font-bold uppercase text-gray-500">Proses & Terkendala</p>
          <p class="mt-2 text-3xl font-bold text-amber-700" x-text="workspaceStats.inProgress"></p>
          <p class="mt-1 text-xs text-red-600" x-text="workspaceStats.blocked + ' butuh tindak lanjut kendala'"></p>
        </div>
        <div class="rounded-lg border border-blue-200 bg-white p-4 shadow-sm">
          <p class="text-xs font-bold uppercase text-gray-500">Status Pembayaran</p>
          <p class="mt-2 text-3xl font-bold text-blue-700" x-text="workspaceStats.paid + ' Lunas'"></p>
          <p class="mt-1 text-xs text-gray-500" x-text="workspaceStats.unpaid + ' belum lunas / DP'"></p>
        </div>
        <div class="rounded-lg border border-purple-200 bg-white p-4 shadow-sm">
          <p class="text-xs font-bold uppercase text-gray-500">Total Pembayaran Masuk</p>
          <p class="mt-2 text-xl font-bold text-purple-700" x-text="formatRupiah(workspaceStats.totalPaid)"></p>
          <p class="mt-1 text-xs text-gray-500" x-text="'Dari tagihan ' + formatRupiah(workspaceStats.totalPrice)"></p>
        </div>
      </div>

      <div class="grid grid-cols-1 gap-5 lg:grid-cols-12">
        <div class="rounded-lg border border-gray-200 bg-white p-5 shadow-sm lg:col-span-5">
          <!-- Status Banner Menjelaskan Data yang Ditampilkan -->
          <template x-if="setupWorkspaceForm.WorkspaceID && setupWorkspaceForm.WorkspaceID === productReadiness.activeWorkspaceId">
            <div class="mb-4 rounded-lg border border-emerald-300 bg-emerald-50/90 p-3.5">
              <div class="flex items-start justify-between gap-2">
                <div>
                  <div class="flex items-center gap-2">
                    <span class="inline-block h-2.5 w-2.5 rounded-full bg-emerald-600 animate-pulse"></span>
                    <span class="text-xs font-bold uppercase tracking-wider text-emerald-900">Pondok Aktif Saat Ini</span>
                  </div>
                  <p class="mt-1 text-sm font-bold text-emerald-950" x-text="setupWorkspaceForm.PondokName || 'Pondok Sedang Dikerjakan'"></p>
                  <p class="mt-0.5 text-xs text-emerald-800">Data di bawah ini adalah pondok yang sedang dikerjakan pada Wizard Setup. Perubahan paket, PIC, harga, dan pembayaran langsung tersimpan di sini.</p>
                </div>
                <button type="button" class="app-btn app-btn-soft shrink-0 text-xs py-1.5 px-3" @click="startNewSetupWorkspace()">
                  + Pondok Baru
                </button>
              </div>
            </div>
          </template>

          <template x-if="setupWorkspaceForm.WorkspaceID && setupWorkspaceForm.WorkspaceID !== productReadiness.activeWorkspaceId">
            <div class="mb-4 rounded-lg border border-blue-300 bg-blue-50/90 p-3.5">
              <div class="flex items-start justify-between gap-2">
                <div>
                  <span class="text-xs font-bold uppercase tracking-wider text-blue-900">Mengedit Pondok Pelanggan Lain</span>
                  <p class="mt-1 text-sm font-bold text-blue-950" x-text="setupWorkspaceForm.PondokName"></p>
                  <p class="mt-0.5 text-xs text-blue-800">Menampilkan rekaman pondok lain dalam katalog penjualan multi-pondok.</p>
                </div>
                <button type="button" class="app-btn app-btn-soft shrink-0 text-xs py-1.5 px-3" @click="loadActiveSetupWorkspace()">
                  Kembali ke Pondok Aktif
                </button>
              </div>
            </div>
          </template>

          <template x-if="!setupWorkspaceForm.WorkspaceID">
            <div class="mb-4 rounded-lg border border-amber-300 bg-amber-50/90 p-3.5">
              <div class="flex items-start justify-between gap-2">
                <div>
                  <span class="text-xs font-bold uppercase tracking-wider text-amber-900">Form Tambah Pondok / Pelanggan Baru</span>
                  <p class="mt-1 text-xs text-amber-800">Gunakan form ini jika ingin mendaftarkan pondok baru ke dalam katalog penjualan multi-pondok.</p>
                </div>
                <button type="button" class="app-btn app-btn-soft shrink-0 text-xs py-1.5 px-3" @click="loadActiveSetupWorkspace()">
                  Batal & Kembali ke Pondok Aktif
                </button>
              </div>
            </div>
          </template>

          <div class="flex items-center justify-between gap-2 border-b border-gray-100 pb-3">
            <h3 class="text-base font-bold text-gray-900" x-text="setupWorkspaceForm.WorkspaceID ? (setupWorkspaceForm.WorkspaceID === productReadiness.activeWorkspaceId ? 'Ubah Data Pondok Aktif' : 'Ubah Data Pondok Pelanggan') : 'Form Tambah Pondok Baru'"></h3>
            <button type="button" class="text-xs font-bold text-emerald-700 hover:underline" @click="resetSetupWorkspaceForm()">Reset Form Kosong</button>
          </div>

          <div class="mt-4 space-y-4">
            <div class="rounded-lg border border-gray-100 bg-gray-50 p-3 space-y-3">
              <p class="text-xs font-bold uppercase tracking-wide text-gray-600">1. Identitas & Kontak PIC Pondok</p>
              <div class="grid grid-cols-1 gap-3 md:grid-cols-2">
                <label class="block md:col-span-2"><span class="app-label">Nama Pondok *</span><input class="app-input" x-model="setupWorkspaceForm.PondokName" placeholder="Contoh: PP Darul Ulum"></label>
                <label class="block"><span class="app-label">Kota / Kabupaten</span><input class="app-input" x-model="setupWorkspaceForm.City" placeholder="Contoh: Pontianak"></label>
                <label class="block"><span class="app-label">Tenant ID</span><input class="app-input" x-model="setupWorkspaceForm.TenantID" placeholder="Otomatis jika kosong"></label>
                <label class="block"><span class="app-label">Nama PIC / Penanggung Jawab</span><input class="app-input" x-model="setupWorkspaceForm.ContactPerson" placeholder="Ust. Ahmad"></label>
                <label class="block"><span class="app-label">No. WhatsApp PIC</span><input class="app-input" x-model="setupWorkspaceForm.ContactPhone" placeholder="0812..."></label>
                <label class="block md:col-span-2"><span class="app-label">Email Pemilik / Admin Pondok</span><input class="app-input" type="email" x-model="setupWorkspaceForm.OwnerEmail" placeholder="admin@pondok.sch.id"></label>
              </div>
            </div>

            <div class="rounded-lg border border-blue-100 bg-blue-50/50 p-3 space-y-3">
              <p class="text-xs font-bold uppercase tracking-wide text-blue-800">2. Paket & Layanan Penjualan</p>
              <div class="grid grid-cols-1 gap-3 md:grid-cols-2">
                <label class="block">
                  <span class="app-label">Paket Produk</span>
                  <select class="app-input" x-model="setupWorkspaceForm.PackageName">
                    <option value="Starter">Starter</option>
                    <option value="Standar">Standar</option>
                    <option value="Pro Lengkap">Pro Lengkap</option>
                    <option value="Enterprise">Enterprise</option>
                    <option value="Internal">Internal</option>
                  </select>
                </label>
                <label class="block">
                  <span class="app-label">Jenis Layanan</span>
                  <select class="app-input" x-model="setupWorkspaceForm.ServiceType">
                    <option value="Web App">Web App</option>
                    <option value="Web App + APK Android">Web App + APK Android</option>
                    <option value="Terima Beres + Import Data">Terima Beres + Import Data</option>
                    <option value="Custom / Dedicated">Custom / Dedicated</option>
                  </select>
                </label>
                <label class="block"><span class="app-label">Kuota Maksimal Santri</span><input class="app-input" x-model="setupWorkspaceForm.MaxStudents" placeholder="Contoh: 300 (kosong = bebas)"></label>
                <label class="block"><span class="app-label">Modul Aktif</span><input class="app-input" x-model="setupWorkspaceForm.ActiveModules" placeholder="Tahfidz, Akademik, Raport, Absensi"></label>
              </div>
            </div>

            <div class="rounded-lg border border-purple-100 bg-purple-50/50 p-3 space-y-3">
              <p class="text-xs font-bold uppercase tracking-wide text-purple-800">3. Pembayaran & Masa Aktif</p>
              <div class="grid grid-cols-1 gap-3 md:grid-cols-2">
                <label class="block">
                  <span class="app-label">Siklus Tagihan</span>
                  <select class="app-input" x-model="setupWorkspaceForm.BillingCycle">
                    <option value="Tahunan">Tahunan</option>
                    <option value="Semesteran">Semesteran</option>
                    <option value="Bulanan">Bulanan</option>
                    <option value="Lisensi Putus">Lisensi Putus (Sekali Bayar)</option>
                  </select>
                </label>
                <label class="block">
                  <span class="app-label">Status Pembayaran</span>
                  <select class="app-input" x-model="setupWorkspaceForm.PaymentStatus">
                    <option value="Belum Bayar">Belum Bayar</option>
                    <option value="DP / Cicilan">DP / Cicilan</option>
                    <option value="Lunas">Lunas</option>
                    <option value="Perpanjangan">Perpanjangan</option>
                    <option value="Menunggak">Menunggak</option>
                  </select>
                </label>
                <label class="block"><span class="app-label">Harga Paket (Rp)</span><input class="app-input" type="number" x-model="setupWorkspaceForm.PriceAmount" placeholder="1500000"></label>
                <label class="block"><span class="app-label">Nominal Dibayar (Rp)</span><input class="app-input" type="number" x-model="setupWorkspaceForm.PaidAmount" placeholder="1500000"></label>
                <label class="block"><span class="app-label">Metode Pembayaran</span><input class="app-input" x-model="setupWorkspaceForm.PaymentMethod" placeholder="Transfer BSI / QRIS / Tunai"></label>
                <label class="block"><span class="app-label">Tanggal Bayar Terakhir</span><input class="app-input" type="date" x-model="setupWorkspaceForm.LastPaymentDate"></label>
                <label class="block"><span class="app-label">Mulai Aktif</span><input class="app-input" type="date" x-model="setupWorkspaceForm.StartDate"></label>
                <label class="block"><span class="app-label">Berakhir / Jatuh Tempo</span><input class="app-input" type="date" x-model="setupWorkspaceForm.ExpiryDate"></label>
              </div>
            </div>

            <div class="rounded-lg border border-amber-100 bg-amber-50/50 p-3 space-y-3">
              <p class="text-xs font-bold uppercase tracking-wide text-amber-900">4. Progres Setup & Link Teknis</p>
              <div class="grid grid-cols-1 gap-3 md:grid-cols-2">
                <label class="block">
                  <span class="app-label">Langkah Setup Terakhir</span>
                  <select class="app-input" x-model="setupWorkspaceForm.CurrentStep">
                    <option value="Profil">1. Profil</option>
                    <option value="Paket">2. Paket</option>
                    <option value="Data">3. Data</option>
                    <option value="Jadwal">4. Jadwal</option>
                    <option value="Akademik">5. Akademik</option>
                    <option value="Demo">6. Demo</option>
                    <option value="Cek">7. Cek</option>
                  </select>
                </label>
                <label class="block">
                  <span class="app-label">Status Pondok</span>
                  <select class="app-input" x-model="setupWorkspaceForm.Status">
                    <option value="Draft">Draft</option>
                    <option value="Proses">Proses Setup</option>
                    <option value="Terkendala">Terkendala</option>
                    <option value="Menunggu Data">Menunggu Data</option>
                    <option value="Siap">Siap Pakai</option>
                    <option value="Aktif">Aktif (Terjual)</option>
                    <option value="Masa Tenggang">Masa Tenggang</option>
                    <option value="Nonaktif">Nonaktif</option>
                  </select>
                </label>
                <label class="block md:col-span-2"><span class="app-label">ID Spreadsheet Database</span><input class="app-input" x-model="setupWorkspaceForm.DatabaseSpreadsheetID" placeholder="ID dari link Google Spreadsheet pondok"></label>
                <label class="block md:col-span-2"><span class="app-label">ID Template Raport</span><input class="app-input" x-model="setupWorkspaceForm.ReportTemplateID" placeholder="ID Google Docs template raport (opsional)"></label>
                <label class="block md:col-span-2"><span class="app-label">Link Aplikasi / Web App / APK</span><input class="app-input" x-model="setupWorkspaceForm.DeploymentUrl" placeholder="https://script.google.com/macros/s/.../exec"></label>
                <label class="block md:col-span-2"><span class="app-label">Kendala Terakhir (Kosongkan jika sudah teratasi)</span><input class="app-input" x-model="setupWorkspaceForm.LastError" placeholder="Catatan error/kendala saat setup"></label>
                <label class="block md:col-span-2"><span class="app-label">Catatan Admin</span><textarea class="app-input min-h-[70px]" x-model="setupWorkspaceForm.Notes" placeholder="Catatan kesepakatan paket, request khusus, atau progres setup"></textarea></label>
              </div>
            </div>

            <div class="flex flex-col gap-2 sm:flex-row">
              <button type="button" class="app-btn app-btn-primary flex-1" @click="saveSetupWorkspaceAction(false)" :disabled="productSaving">Simpan Data Pondok</button>
              <button type="button" class="app-btn app-btn-soft flex-1" @click="saveSetupWorkspaceAction(true)" :disabled="productSaving">Simpan & Lanjutkan Setup</button>
            </div>
          </div>
        </div>

        <div class="rounded-lg border border-gray-200 bg-white p-5 shadow-sm lg:col-span-7">
          <div class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
            <div>
              <h3 class="text-lg font-bold text-gray-900">Daftar Riwayat Setup & Pelanggan Pondok</h3>
              <p class="text-xs text-gray-500">Pilih <strong>Lanjutkan Setup</strong> untuk meneruskan dari langkah terakhir, atau <strong>Hapus</strong> jika batal.</p>
            </div>
            <span class="rounded-full bg-emerald-100 px-3 py-1 text-xs font-bold text-emerald-800" x-text="filteredSetupWorkspaces.length + ' dari ' + (productReadiness.workspaces || []).length + ' pondok'"></span>
          </div>

          <div class="mt-4 grid grid-cols-1 gap-3 md:grid-cols-3">
            <input class="app-input" x-model="workspaceSearchQuery" placeholder="Cari nama pondok, kota, PIC, paket...">
            <select class="app-input" x-model="workspaceFilterStatus">
              <option value="">Semua Status Setup</option>
              <option value="Draft">Draft</option>
              <option value="Proses">Proses Setup</option>
              <option value="Terkendala">Terkendala</option>
              <option value="Menunggu Data">Menunggu Data</option>
              <option value="Siap">Siap Pakai</option>
              <option value="Aktif">Aktif (Terjual)</option>
              <option value="Masa Tenggang">Masa Tenggang</option>
              <option value="Nonaktif">Nonaktif</option>
            </select>
            <select class="app-input" x-model="workspaceFilterPayment">
              <option value="">Semua Status Bayar</option>
              <option value="Belum Bayar">Belum Bayar</option>
              <option value="DP / Cicilan">DP / Cicilan</option>
              <option value="Lunas">Lunas</option>
              <option value="Perpanjangan">Perpanjangan</option>
              <option value="Menunggak">Menunggak</option>
            </select>
          </div>

          <div class="mt-4 space-y-4">
            <template x-if="!filteredSetupWorkspaces.length">
              <p class="rounded-lg border border-dashed p-6 text-center text-sm text-gray-500">Belum ada riwayat pondok yang sesuai filter. Setiap langkah setup akan otomatis tercatat di sini.</p>
            </template>

            <template x-for="workspace in filteredSetupWorkspaces" :key="workspace.WorkspaceID">

          <span class="app-label">URL Logo</span>
          <div class="rounded-lg border border-emerald-100 bg-emerald-50 p-3 md:col-span-2">
            <label class="block"><span class="app-label">Upload Logo</span><input class="app-input" type="file" accept="image/png,image/jpeg,image/webp" @change="uploadTenantLogoAction($event)"></label>
            <p class="mt-1 text-xs text-emerald-800">PNG, JPG, atau WEBP. Pilih file dari komputer.</p>
            <input class="app-input mt-2" x-model="tenantProfileForm.LogoUrl" placeholder="Atau tempel link logo lama (opsional)">
          </div>
        </label>
        <label class="block md:col-span-2">
          <span class="app-label">Alamat</span>
          <textarea class="app-input min-h-[88px]" x-model="tenantProfileForm.Address"></textarea>
        </label>
        <label class="block">
          <span class="app-label">Kontak WhatsApp</span>
          <input class="app-input" x-model="tenantProfileForm.ContactPhone">
        </label>
        <label class="block">
          <span class="app-label">Email</span>
          <input class="app-input" x-model="tenantProfileForm.ContactEmail">
        </label>
        <label class="block">
          <span class="app-label">Tahun Ajaran</span>
          <input class="app-input" x-model="tenantProfileForm.AcademicYear" placeholder="2026/2027">
        </label>
        <label class="block">
          <span class="app-label">Semester</span>
          <input class="app-input" x-model="tenantProfileForm.Semester" placeholder="Ganjil">
        </label>
      </div>
    </section>

    <section x-show="productSection === 'modul'" class="rounded-lg border border-gray-200 bg-white p-5 shadow-sm">
      <div class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
        <h3 class="text-lg font-bold text-gray-900">Paket dan Modul</h3>
        <div class="flex flex-wrap gap-2">
          <button type="button" class="app-btn app-btn-soft" @click="saveProductSettingsAction()" :disabled="productSaving">Simpan Pengaturan</button>
          <button type="button" class="app-btn app-btn-primary" @click="saveModuleLicensesAction()" :disabled="productSaving">Simpan Modul</button>
        </div>
      </div>
      <div class="mt-4 grid grid-cols-1 gap-4 md:grid-cols-4">
        <label class="block">
          <span class="app-label">Mode Penguncian</span>
          <select class="app-input" x-model="productSettingsForm.PRODUCT_MODULE_GATING">
            <option value="off">Off - semua fitur lama tetap aktif</option>
            <option value="canary">Canary - uji Admin/Mudir</option>
            <option value="on">On - sesuai paket</option>
          </select>
        </label>
        <label class="block">
          <span class="app-label">Nama Paket</span>
          <input class="app-input" x-model="productSettingsForm.PRODUCT_PACKAGE_NAME">
        </label>
        <label class="block">
          <span class="app-label">Batas Santri</span>
          <input class="app-input" x-model="productSettingsForm.PRODUCT_MAX_STUDENTS" placeholder="kosong = tanpa batas">
        </label>
        <label class="block">
          <span class="app-label">Mode Demo</span>
          <select class="app-input" x-model="productSettingsForm.DEMO_MODE">
            <option value="off">Off</option>
            <option value="on">On</option>
          </select>
        </label>
      </div>
      <div class="mt-5 overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200 text-sm">
          <thead class="bg-gray-50">
            <tr>
              <th class="px-4 py-3 text-left font-bold text-gray-600">Aktif</th>
              <th class="px-4 py-3 text-left font-bold text-gray-600">Modul</th>
              <th class="px-4 py-3 text-left font-bold text-gray-600">Paket</th>
              <th class="px-4 py-3 text-left font-bold text-gray-600">Masa Aktif</th>
              <th class="px-4 py-3 text-left font-bold text-gray-600">Catatan</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-100">
            <template x-for="module in productReadiness.modules" :key="module.ModuleCode">
              <tr>
                <td class="px-4 py-3"><input type="checkbox" x-model="module.IsActive"></td>
                <td class="px-4 py-3 font-semibold text-gray-900" x-text="module.ModuleName"></td>
                <td class="px-4 py-3"><input class="app-input" x-model="module.PackageName"></td>
                <td class="px-4 py-3">
                  <div class="grid grid-cols-2 gap-2">
                    <input type="date" class="app-input" x-model="module.StartDate">
                    <input type="date" class="app-input" x-model="module.EndDate">
                  </div>
                </td>
                <td class="px-4 py-3"><input class="app-input" x-model="module.Notes"></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </section>

    <section x-show="productSection === 'checklist'" class="grid grid-cols-1 gap-5 lg:grid-cols-3">
      <div class="rounded-lg border border-gray-200 bg-white p-5 shadow-sm lg:col-span-1">
        <h3 class="text-lg font-bold text-gray-900">Tambah Checklist</h3>
        <div class="mt-4 space-y-3">
          <input class="app-input" x-model="setupChecklistForm.TaskName" placeholder="Nama tugas">
          <input class="app-input" x-model="setupChecklistForm.Category" placeholder="Kategori">
          <select class="app-input" x-model="setupChecklistForm.Status">
            <option>Belum</option>
            <option>Proses</option>
            <option>Selesai</option>
          </select>
          <textarea class="app-input min-h-[90px]" x-model="setupChecklistForm.Notes" placeholder="Catatan"></textarea>
          <button type="button" class="app-btn app-btn-primary w-full" @click="saveSetupChecklistAction()" :disabled="productSaving">Simpan Checklist</button>
        </div>
      </div>
      <div class="rounded-lg border border-gray-200 bg-white p-5 shadow-sm lg:col-span-2">
        <h3 class="text-lg font-bold text-gray-900">Daftar Checklist</h3>
        <div class="mt-4 space-y-3">
          <template x-for="item in productReadiness.checklist" :key="item.ChecklistID">
            <div class="flex flex-col gap-3 rounded-lg border border-gray-100 p-4 md:flex-row md:items-center md:justify-between">
              <div>
                <p class="font-bold text-gray-900" x-text="item.TaskName"></p>
                <p class="text-sm text-gray-500" x-text="item.Category + (item.Notes ? ' - ' + item.Notes : '')"></p>
              </div>
              <div class="flex items-center gap-2">
                <select class="app-input min-w-[130px]" x-model="item.Status" @change="saveSetupChecklistAction(item)">
                  <option>Belum</option>
                  <option>Proses</option>
                  <option>Selesai</option>
                </select>
                <button type="button" class="app-btn app-btn-soft" @click="editSetupChecklistItem(item)">Edit</button>
              </div>
            </div>
          </template>
        </div>
      </div>
    </section>

    <section x-show="productSection === 'demo'" class="grid grid-cols-1 gap-5 lg:grid-cols-3">
      <div class="rounded-lg border border-gray-200 bg-white p-5 shadow-sm">
        <h3 class="text-lg font-bold text-gray-900">Akun Demo</h3>
        <p class="mt-1 text-sm text-gray-600">Buat satu paket akun Mudir, Admin, Ustadz, dan Wali beserta data contoh.</p>
        <div class="mt-4 space-y-3">
          <input class="app-input" type="password" x-model="demoPackageForm.Password" placeholder="Password semua akun demo (min. 6 karakter)">
          <button type="button" class="app-btn app-btn-primary w-full" @click="createDemoPackageAction()" :disabled="productSaving">Buat Paket Demo Otomatis</button>
          <button type="button" class="app-btn app-btn-soft w-full" @click="syncDemoAccountsToUsersAction()" :disabled="productSaving">Aktifkan Login Akun Demo</button>
          <button type="button" class="app-btn app-btn-soft w-full" @click="resetDemoPackageAction()" :disabled="productSaving">Reset Data Demo</button>
          <div class="border-t border-gray-100 pt-3 text-xs text-gray-500">Akun demo bersifat hanya-baca untuk presentasi. Password tidak disimpan di daftar demo.</div>
          <div class="border-t border-gray-100 pt-3"></div>
          <select class="app-input" x-model="demoAccountForm.Role">
            <option>Mudir</option>
            <option>Admin</option>
            <option>Ustadz</option>
            <option>Wali</option>
          </select>
          <input class="app-input" x-model="demoAccountForm.Username" placeholder="Username">
          <input class="app-input" x-model="demoAccountForm.PasswordHint" placeholder="Petunjuk password">
          <select class="app-input" x-model="demoAccountForm.StudentID">
            <option value="">-- Pilih Santri untuk Wali (Otomatis santri pertama) --</option>
            <template x-for="stu in students" :key="stu.StudentID">
              <option :value="stu.StudentID" x-text="stu.Name + ' — ' + (stu['Class/Level'] || '-') + ' (' + stu.StudentID + ')'"></option>
            </template>
          </select>
          <label class="flex items-center gap-2 text-sm font-semibold text-gray-700"><input type="checkbox" x-model="demoAccountForm.IsActive"> Aktif</label>
          <label class="flex items-center gap-2 text-sm font-semibold text-gray-700"><input type="checkbox" x-model="demoAccountForm.IsReadOnly"> Read-only</label>
          <textarea class="app-input min-h-[90px]" x-model="demoAccountForm.Notes" placeholder="Catatan demo"></textarea>
          <button type="button" class="app-btn app-btn-primary w-full" @click="saveDemoAccountAction()" :disabled="productSaving">Simpan Akun Demo</button>
        </div>
      </div>
      <div class="rounded-lg border border-gray-200 bg-white p-5 shadow-sm lg:col-span-2">
        <h3 class="text-lg font-bold text-gray-900">Daftar Akun Demo</h3>
        <div class="mt-4 grid grid-cols-1 gap-3 md:grid-cols-2">
          <template x-for="account in productReadiness.demoAccounts" :key="account.DemoID">
            <button type="button" class="rounded-lg border border-gray-100 p-4 text-left hover:bg-gray-50" @click="editDemoAccount(account)">
              <div class="flex items-center justify-between gap-2">
                <p class="font-bold text-gray-900" x-text="account.Role + ' - ' + account.Username"></p>
                <span class="rounded-full px-2 py-1 text-xs font-bold" :class="account.IsActive ? 'bg-emerald-100 text-emerald-700' : 'bg-gray-100 text-gray-600'" x-text="account.IsActive ? 'Aktif' : 'Nonaktif'"></span>
              </div>
              <p class="mt-2 text-sm text-gray-500" x-text="account.Notes || account.PasswordHint || '-'"></p>
            </button>
          </template>
        </div>
      </div>
    </section>
  </div>
</template>
