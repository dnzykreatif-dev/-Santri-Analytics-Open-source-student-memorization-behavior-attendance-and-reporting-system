<!-- Layout Navigation Desktop -->
<aside class="app-sidebar hidden md:flex">
  <div class="app-sidebar-brand">
    <div class="app-sidebar-logo">SA</div>
    <div class="min-w-0">
      <p class="font-black text-gray-900 leading-tight">Monitor Santri</p>
      <p class="text-xs text-gray-500">Raudhatul Ulum</p>
    </div>
  </div>

  <nav class="app-sidebar-nav">
    <button
      type="button"
      @click="setCurrentTab('dashboard')"
      class="app-sidebar-item"
      :class="{ 'is-active': currentTab === 'dashboard' }"
    >
      <span class="app-sidebar-icon">D</span>
      <span>Dashboard</span>
    </button>

    <button
      type="button"
      @click="setCurrentTab('santri')"
      class="app-sidebar-item"
      :class="{ 'is-active': currentTab === 'santri' }"
    >
      <span class="app-sidebar-icon">S</span>
      <span>Santri</span>
    </button>

    <template x-if="user?.Role === 'Mudir' || user?.Role === 'Ustadz'">
      <div class="app-sidebar-section">
        <p class="app-sidebar-label">Operasional</p>

        <button
          type="button"
          @click="setCurrentTab('hafalan')"
          class="app-sidebar-item"
          :class="{ 'is-active': currentTab === 'hafalan' }"
        >
          <span class="app-sidebar-icon">H</span>
          <span>Input Hafalan</span>
        </button>

        <button
          type="button"
          @click="setCurrentTab('pelanggaran')"
          class="app-sidebar-item"
          :class="{ 'is-active': currentTab === 'pelanggaran' }"
        >
          <span class="app-sidebar-icon">P</span>
          <span>Input Perilaku</span>
        </button>

        <button
          type="button"
          @click="setCurrentTab('list_perilaku')"
          class="app-sidebar-item"
          :class="{ 'is-active': currentTab === 'list_perilaku' }"
        >
          <span class="app-sidebar-icon">C</span>
          <span>Catatan Perilaku</span>
        </button>

        <button
          type="button"
          @click="setCurrentTab('link_live')"
          class="app-sidebar-item"
          :class="{ 'is-active': currentTab === 'link_live' }"
        >
          <span class="app-sidebar-icon">L</span>
          <span>Link Hafalan</span>
        </button>
      </div>
    </template>

    <div class="app-sidebar-section">
      <p class="app-sidebar-label">Lainnya</p>

      <button
        type="button"
        @click="setCurrentTab('pulang_bulanan')"
        class="app-sidebar-item"
        :class="{ 'is-active': currentTab === 'pulang_bulanan' }"
      >
        <span class="app-sidebar-icon">B</span>
        <span>Pulang Bulanan</span>
      </button>

      <template x-if="user?.Role === 'Mudir' || user?.Role === 'Ustadz'">
        <button
          type="button"
          @click="setCurrentTab('panduan')"
          class="app-sidebar-item"
          :class="{ 'is-active': currentTab === 'panduan' }"
        >
          <span class="app-sidebar-icon">U</span>
          <span>Panduan Ustadz</span>
        </button>
      </template>

      <button
        type="button"
        @click="setCurrentTab('panduan_wali')"
        class="app-sidebar-item"
        :class="{ 'is-active': currentTab === 'panduan_wali' }"
      >
        <span class="app-sidebar-icon">W</span>
        <span>Panduan Wali</span>
      </button>
    </div>

    <template x-if="user?.Role === 'Mudir' || user?.Role === 'Admin'">
      <div class="app-sidebar-section">
        <p class="app-sidebar-label">Administrator</p>
        <button
          type="button"
          @click="setCurrentTab('users')"
          class="app-sidebar-item"
          :class="{ 'is-active': currentTab === 'users' }"
        >
          <span class="app-sidebar-icon">A</span>
          <span>Manajemen User</span>
        </button>
      </div>
    </template>
  </nav>

  <div class="app-sidebar-user">
    <div
      class="w-10 h-10 rounded-2xl bg-gradient-islamic text-white flex items-center justify-center font-black"
      x-text="(user?.Name || user?.Username || 'U').charAt(0).toUpperCase()"
    ></div>
    <div class="min-w-0 flex-1">
      <p class="font-black text-sm text-gray-900 truncate" x-text="user?.Name || user?.Username"></p>
      <p class="text-xs text-gray-500 truncate" x-text="user?.Role"></p>
    </div>
    <button type="button" @click="logout()" class="app-sidebar-logout">
      Out
    </button>
  </div>
</aside>
