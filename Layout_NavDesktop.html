<!-- Layout Navigation Desktop -->
<aside class="app-sidebar hidden md:flex">
  <div class="app-sidebar-brand">
    <div class="app-sidebar-logo">SA</div>
    <div class="min-w-0">
      <p class="font-black text-gray-900 leading-tight">Monitor Santri</p>
      <p class="text-xs text-gray-500">Raudhatul Ulum</p>
    </div>
  </div>

  <nav class="app-sidebar-nav">
    <template x-for="item in visibleNavigationItems('utama')" :key="item.id">
      <button type="button" @click="handleNavigationItem(item)" class="app-sidebar-item"
        :class="{ 'is-active': !item.external && currentTab === item.id }">
        <span class="app-sidebar-icon" x-html="navIcon(item.icon)"></span>
        <span x-text="item.label"></span>
      </button>
    </template>

    <template x-for="group in ['operasional', 'lainnya', 'administrator']" :key="group">
      <div class="app-sidebar-section" x-show="visibleNavigationItems(group).length">
        <p class="app-sidebar-label" x-text="navigationGroupLabel(group)"></p>
        <template x-for="item in visibleNavigationItems(group)" :key="item.id">
          <button type="button" @click="handleNavigationItem(item)" class="app-sidebar-item"
            :class="{ 'is-active': currentTab === item.id }">
            <span class="app-sidebar-icon" x-html="navIcon(item.icon)"></span>
            <span x-text="item.label"></span>
          </button>
        </template>
      </div>
    </template>
  </nav>

  <div class="app-sidebar-user">
    <div class="w-10 h-10 rounded-2xl bg-gradient-islamic text-white flex items-center justify-center font-black"
      x-text="(user?.Name || user?.Username || 'U').charAt(0).toUpperCase()"></div>
    <div class="min-w-0 flex-1">
      <p class="font-black text-sm text-gray-900 truncate" x-text="user?.Name || user?.Username"></p>
      <p class="text-xs text-gray-500 truncate" x-text="user?.Role"></p>
    </div>
    <button type="button" @click="logout()" class="app-sidebar-logout">
      <span class="w-4 h-4 inline-flex items-center justify-center" x-html="navIcon('logout')"></span>
      <span>Keluar</span>
    </button>
  </div>
</aside>
