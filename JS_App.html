    // ===== HELPER: Google Script Call Wrapper =====
    function callGoogleScript(methodName, ...args) {
      return {
        onSuccess: function (callback) {
          try {
            google.script.run
              .withSuccessHandler((res) => {
                if (res && res.ok) {
                  callback(null, res.data);
                } else {
                  callback(new Error(
                    res?.message ||
                    "Server tidak mengirim respons untuk " + methodName + ". Silakan refresh lalu coba lagi.",
                  ));
                }
              })
              .withFailureHandler((err) => callback(new Error(
                err?.message || String(err || "Koneksi ke server gagal."),
              )))
              .runAppAction({ action: methodName, args });
          } catch (err) {
            callback(new Error(err?.message || "Data tidak dapat dikirim ke server."));
          }
          return this;
        },
        onSuccessRaw: function (callback) {
          google.script.run
            .withSuccessHandler(callback)
            .withFailureHandler((err) => callback(null, null, err))
            .runAppAction({ action: methodName, args });
          return this;
        },
      };
    }

      // ===== COMPUTED =====
      get uniqueClasses() {
        const classes = this.students
          .map((s) => s["Class/Level"])
          .filter(Boolean);
        return [...new Set(classes)].sort();
      },

      get curriculumExamClasses() {
        const setupClasses = this.curriculumExamSetup.classes || [];
        if (setupClasses.length) return [...new Set(setupClasses)].sort();
        const classes = (this.curriculumExamSetup.items || [])
          .map((item) => item.ClassOrGroupName)
          .filter(Boolean);
        return [...new Set([...classes, ...this.uniqueClasses])].sort();
      },

      get curriculumExamPeriods() {
        const periods = this.curriculumExamSetup.periods || [];
        if (periods.length) return periods;
        return this.academicSetup.periods || [];
      },

      get filteredCurriculumExamItems() {
        const selectedClass = this.curriculumExamFilter.Class;
        return (this.curriculumExamSetup.items || []).filter((item) => {
          if (!selectedClass) return true;
          return String(item.ClassOrGroupName || "") === String(selectedClass);
        });
      },

      get productSetupPercent() {
        const total = Number(this.productReadiness.summary?.checklistTotal || 0);
        if (!total) return 0;
        return Math.round((Number(this.productReadiness.summary?.checklistDone || 0) / total) * 100);

      // ===== INITIALIZATION =====
      init() {
        this.initScheduleWatchers();
        const savedUser =
          localStorage.getItem("user") || sessionStorage.getItem("user");
        if (savedUser) {
          try {
            const storedUser = JSON.parse(savedUser);
            if (!localStorage.getItem("user")) {
              localStorage.setItem("user", savedUser);
            }
            if (storedUser?.SessionToken) {
              const savedView = this.readViewState(storedUser);
              const generation = ++this.authGeneration;
              this.loading = true;
              this.user = storedUser;
              this.isLoggedIn = true;
              callGoogleScript("resumeSession", storedUser).onSuccess((err, data) => {
                if (generation !== this.authGeneration) return;
                this.loading = false;
                const canonicalUser = data?.user;
                if (!err && canonicalUser?.SessionToken) {
                  this.resetUserScopedState();
                  this.user = canonicalUser;
                  this.isLoggedIn = true;
                  this.restoreViewState(savedView, canonicalUser);
                  this.authRestoring = false;
                  localStorage.setItem("user", JSON.stringify(canonicalUser));
                  sessionStorage.removeItem("user");
                  this.loadAppEntitlements();
                  this.refreshData();
                } else {
                  this.resetUserScopedState();
                  this.isLoggedIn = false;
                  this.user = { Username: "", Role: "" };
                  this.authRestoring = false;
                  localStorage.removeItem("user");
                  sessionStorage.removeItem("user");
                  this.loadPublicLandingInfo();
                }
              });
              return;
            }
          } catch (e) {
            // Data sesi yang rusak diperlakukan sebagai sesi yang sudah berakhir.
          }
        }
        localStorage.removeItem("user");
        sessionStorage.removeItem("user");
        this.isLoggedIn = false;
        this.user = { Username: "", Role: "" };
        this.authRestoring = false;
        this.loadPublicLandingInfo();
      },

      setCurrentTab(tab) {
        if (!this.isNavigationAllowed(tab)) tab = "dashboard";
        this.currentTab = tab;
        this.mobileMoreOpen = false;
        this.mobileDrawerOpen = false;
        if (tab === "dashboard") this.fetchSummary();
        if (tab === "santri") this.fetchStudents();
        if (tab === "users") this.fetchUsers();
        if (tab === "akademik") {
          this.fetchStudents();
          this.loadAcademicSetup();
        }
        if (tab === "jadwal_admin") {
          // The first view should answer the most common question: what is scheduled today?
          this.scheduleFilterDay = localDayName();
          this.loadSchedules();
        }
        if (tab === "absensi") this.loadMySchedulesToday();
        if (tab === "pulang_bulanan") this.loadPulangBulanan();
        if (tab === "setup_pondok") this.loadProductReadiness();
        if (tab === "informasi_pesantren") {
          this.pesantrenInfoSection = this.canManagePesantrenInfo()
            ? "kelola"
            : "beranda";
          this.loadPesantrenInfo();
        }
        this.saveViewState();
      },

      viewStateStorageKey(user = this.user) {
        const identity = String(user?.UserID || user?.Username || "").trim();
        return identity ? "santriAnalytics:view:" + encodeURIComponent(identity) : "";
      },

      isNavigationAllowed(tab, user = this.user) {
        const item = NAVIGATION_ITEMS.find(candidate => candidate.id === tab && !candidate.external);
        return !!item && item.roles.includes(user?.Role) && this.isNavItemAvailable(item);
      },

      readViewState(user = this.user) {
        const key = this.viewStateStorageKey(user);
        if (!key) return null;
        try {
          return JSON.parse(sessionStorage.getItem(key) || "null");
        } catch (error) {
          sessionStorage.removeItem(key);
          return null;
        }
      },

      saveViewState() {
        if (!this.isLoggedIn || this.authRestoring) return;
        const key = this.viewStateStorageKey();
        if (!key) return;
        const activeSchedule = this.attendanceActiveSession && this.attendanceSessionData
          ? this.attendanceSchedulePayload(this.attendanceSessionData)
          : null;
        sessionStorage.setItem(key, JSON.stringify({
          currentTab: this.currentTab,
          attendanceView: this.attendanceView,
          attendanceDate: this.attendanceDate,
          attendanceShowAllSchedules: !!this.attendanceShowAllSchedules,
          attendanceActiveSchedule: activeSchedule,
        }));
      },

      restoreViewState(state, user = this.user) {
        state = state || {};
        this.currentTab = this.isNavigationAllowed(state.currentTab, user)
          ? state.currentTab
          : "dashboard";
        const attendanceViews = ["today", "Pondok", "KBM", "Kegiatan", "recap"];
        this.attendanceView = attendanceViews.includes(state.attendanceView)
          ? state.attendanceView
          : "today";
        if (/^\d{4}-\d{2}-\d{2}$/.test(String(state.attendanceDate || ""))) {
          this.attendanceDate = state.attendanceDate;
        }
        this.attendanceShowAllSchedules =
          ["Mudir", "Admin"].includes(user?.Role) && !!state.attendanceShowAllSchedules;
        this.attendanceRestoreSchedule =
          this.currentTab === "absensi" && state.attendanceActiveSchedule
            ? state.attendanceActiveSchedule
            : null;
      },

      clearViewState(user = this.user) {
        const key = this.viewStateStorageKey(user);
        if (key) sessionStorage.removeItem(key);
      },

      visibleNavigationItems(group = "") {
        return NAVIGATION_ITEMS.filter(item =>
          (!group || item.group === group) &&
          item.roles.includes(this.user?.Role) &&
          this.isNavItemAvailable(item),
        );
      },

      isNavItemAvailable(item) {
        if (!item || item.external) return true;
        if (item.id === "setup_pondok") return ["Mudir", "Admin"].includes(this.user?.Role);
        const moduleCode = this.productEntitlements.navModules?.[item.id];
        if (!moduleCode) return true;
        return this.isProductModuleEnabled(moduleCode);
      },

      isProductModuleEnabled(moduleCode) {
        if (!moduleCode) return true;
        const mode = String(this.productEntitlements.gatingMode || "off").toLowerCase();
        if (mode === "off") return true;
        if (mode === "canary" && !["Mudir", "Admin"].includes(this.user?.Role)) return true;
        const modules = this.productEntitlements.modules || {};
        return modules[moduleCode] !== false;
      },

      navigationGroupLabel(group) {
        return { operasional: "Operasional", lainnya: "Lainnya", administrator: "Administrator" }[group] || "";
      },

      handleNavigationItem(item) {
        if (!item) return;
        if (item.external) this.openPublicWebsite();
        else this.setCurrentTab(item.id);
      },

      mobilePrimaryNavItems() {
        const role = this.user?.Role;
        const ids = role === "Wali"
          ? ["dashboard", "santri", "informasi_pesantren", "pulang_bulanan"]
          : role === "Admin"
            ? ["dashboard", "santri", "absensi", "users"]
            : ["dashboard", "santri", "absensi", "hafalan"];
        return ids
          .map(id => NAVIGATION_ITEMS.find(item => item.id === id))
          .filter(item => item && this.isNavItemAvailable(item));
      },

      mobileMoreNavItems() {
        const primary = new Set(this.mobilePrimaryNavItems().map(item => item.id));
        return this.visibleNavigationItems().filter(item => !item.external && !primary.has(item.id));
      },

      isMobileMoreActive() {
        return this.mobileMoreOpen || this.mobileMoreNavItems().some(item => item.id === this.currentTab);
      },

          return canonical.replace(/[?#].*$/, "").replace(/\/$/, "");

        return current.replace(/\/$/, "").replace(/\/userCodeAppPanel$/, "");

      handleLogin() {
        if (!this.loginRole) {
          this.error = "Pilih role login terlebih dahulu";
          return;
        }
        if (!this.loginForm.username || !this.loginForm.password) {
          this.error = "Username dan Password harus diisi";
          return;
        }
        const loginGeneration = ++this.authGeneration;
        this.loading = true;
        this.error = "";

        google.script.run
          .withSuccessHandler((res) => {
            if (loginGeneration !== this.authGeneration) return;
            this.loading = false;
            if (res.ok) {
              this.resetUserScopedState();
              this.user = res.user;
              localStorage.setItem("user", JSON.stringify(res.user));
              sessionStorage.removeItem("user");
              this.isLoggedIn = true;
              this.authRestoring = false;
              this.saveViewState();
              this.loadAppEntitlements();
              this.refreshData();
            } else {
              this.error = res.message;
            }
          })
          .withFailureHandler((err) => {
            if (loginGeneration !== this.authGeneration) return;
            this.loading = false;
            this.error = "Terjadi kesalahan koneksi: " + err;
          })
          .login(this.loginForm.username, this.loginForm.password);
      },

      handleRegister() {
        this.registerError = "";
        if (this.registerForm.password !== this.registerForm.confirmPassword) {
          this.registerError = "Password dan konfirmasi password tidak cocok.";
          return;
        }
        if (this.registerForm.password.length < 6) {
          this.registerError = "Password minimal 6 karakter.";
          return;
        }

        this.loading = true;
        google.script.run
          .withSuccessHandler((res) => {
            this.loading = false;
            if (res.ok) {
              this.showToast(res.message, "success");
              this.showRegister = false;
              this.resetForm("registerForm");
              this.error = "";
            } else {
              this.registerError = res.message;
            }
          })
          .createAccount(
            this.registerForm.username,
            this.registerForm.password,
            "Wali",
          );
      },

        this.changePasswordError = "";

      closeChangePasswordModal() {

        this.changePasswordError = "";
        this.loadingChangePassword = false;
        this.resetForm("changePasswordForm");
      },

      submitChangePasswordForm() {
        this.changePasswordError = "";

        if (
          !this.changePasswordForm.oldPassword ||
          !this.changePasswordForm.newPassword
        ) {
          this.changePasswordError = "Password lama dan baru wajib diisi.";
          return;
        }

        if (this.changePasswordForm.newPassword.length < 6) {
          this.changePasswordError = "Password baru minimal 6 karakter.";
          return;
        }

        if (
          this.changePasswordForm.newPassword !==
          this.changePasswordForm.confirmPassword
        ) {
          this.changePasswordError = "Password baru dan konfirmasi tidak cocok.";
          return;
        }

        if (
          this.changePasswordForm.oldPassword ===
          this.changePasswordForm.newPassword
        ) {
          this.changePasswordError =
            "Password baru harus berbeda dari password lama.";
          return;
        }

        this.loadingChangePassword = true;
        google.script.run
          .withSuccessHandler((res) => {
            this.loadingChangePassword = false;
            if (res.ok) {
              this.showToast(res.message, "success");
              this.closeChangePasswordModal();
              setTimeout(() => {
                this.logout();
              }, 300);
              return;
            }
            this.changePasswordError = res.message;
          })
          .withFailureHandler((err) => {
            this.loadingChangePassword = false;
            this.changePasswordError = "Terjadi kesalahan: " + err.message;
          })
          .changeOwnPassword(
            this.user,
            this.changePasswordForm.oldPassword,
            this.changePasswordForm.newPassword,
          );
      },

      refreshData() {
        if (this.isLoggedIn) {
          this.loadAppEntitlements();
        }
        this.fetchStudents();
        this.fetchSummary();
        if (this.user?.Role === "Mudir" || this.user?.Role === "Admin") {
          this.fetchUsers();
        }
        if (this.selectedStudent?.StudentID) {
          this.refreshStudentDetail();
          if (this.fullStudentReport) {
            this.loadFullStudentReport(
              this.selectedStudent.StudentID,
              this.selectedRaportPeriodId,
            );
          }
        }
        if (this.currentTab === "informasi_pesantren") {
          this.loadPesantrenInfo();
        }
        if (this.currentTab === "akademik") {
          this.loadAcademicSetup();
        }
        if (this.currentTab === "pulang_bulanan") {
          this.loadPulangBulanan();
        }
        if (this.currentTab === "jadwal_admin") {
          this.scheduleFilterDay = localDayName();
          this.loadSchedules();
        }
        if (this.currentTab === "setup_pondok") {
          this.loadProductReadiness();
        }
        if (this.currentTab === "absensi") {
          this.loadMySchedulesToday();
        }

          this.productEntitlements = {
            gatingMode: data.gatingMode || "off",
            packageName: data.packageName || "Internal",
            maxStudents: data.maxStudents || "",
            demoMode: data.demoMode || "off",
            modules: data.modules || {},
            navModules: data.navModules || {},
          };
          if (!this.isNavigationAllowed(this.currentTab)) {
            this.currentTab = "dashboard";
          }
        });

      importSetupExcelAction(event) {
        const file = event && event.target && event.target.files ? event.target.files[0] : null;

        if (typeof XLSX === "undefined") {
          this.showToast("Pembaca Excel belum siap. Muat ulang halaman.", "error");
          event.target.value = "";
          return;

        if (!/\.(xlsx|xls)$/i.test(file.name)) {
          this.showToast("Pilih file Excel XLSX atau XLS.", "error");
          event.target.value = "";

          this.showToast("File Excel terlalu besar. Maksimal 8 MB.", "error");

        const reader = new FileReader();

          try {
            const workbook = XLSX.read(reader.result, { type: "array", cellDates: false });
            const normalize = (value) => String(value || "")
              .toLowerCase()

                fields: {
                  Name: ["name", "nama", "namalengkap", "namauser", "namaakun", "fullname"],
                  Username: ["username", "namapengguna", "akun", "user", "login", "userid"],
                  Password: ["password", "katasandi", "sandi", "passwordawal", "passwordbaru"],
                  Salt: ["salt", "garamkeamanan"],
                  PasswordHash: ["passwordhash", "hashpassword", "hashsandi", "hashkatasandi"],
                  Role: ["role", "peran", "jabatan", "hakakses", "jenisuser", "tipeuser"],
                  Email: ["email", "alamatemail", "surel"],
                  Phone: ["phone", "telepon", "nohp", "nomorhp", "nomerhp", "whatsapp", "hp"],
                  StudentID: ["studentid", "idsantri", "nis", "nisn", "santriid"],
                  Class: ["class", "kelas", "classlevel", "rombel"],
                  TeacherSourceID: ["teachersourceid", "idguru", "kodeguru", "nip", "nuptk"],
                  Status: ["status", "keaktifan", "aktif"]
                },
                required: ["Name", "Username", "Role"]
              },
              schedules: {
                label: "Jadwal",
                fields: {
                  Type: ["type", "jenis", "kategori", "jeniskegiatan", "jenismapel"],
                  TeacherID: ["teacherid", "guruid", "usernameguru", "pengajar", "guru", "ustadz"],
                  TeacherSourceID: ["teachersourceid", "idguru", "kodeguru", "nipguru"],
                  SubjectOrActivityName: ["subjectoractivityname", "subject", "mapel", "matapelajaran", "kegiatan", "nama kegiatan", "namamapel", "materi"],
                  ClassOrGroupName: ["classorgroupname", "class", "kelas", "rombel", "group", "kelompok"],
                  DayOfWeek: ["dayofweek", "day", "hari", "harikegiatan"],
                  StartTime: ["starttime", "jammulai", "jam", "waktumulai", "mulai"],
                  EndTime: ["endtime", "jamselesai", "waktuselesai", "selesai"],
                  IsActive: ["isactive", "aktif", "status", "active"]
                },
                required: ["SubjectOrActivityName", "ClassOrGroupName", "DayOfWeek"]
              }
            };
            const findHeader = (matrix, definition) => {
              let best = { index: -1, score: 0, headers: [] };
              const aliases = Object.values(definition.fields).flat().map(normalize);
              matrix.slice(0, 15).forEach((row, index) => {
                const headers = row.map((cell) => String(cell || "").trim());
                const score = headers.filter((cell) => aliases.includes(normalize(cell))).length;
                if (score > best.score) best = { index, score, headers };
              });
              return best;
            };
            const classifySheet = (sheetName, matrix) => {
              const sheetHint = normalize(sheetName);
              let best = null;
              Object.entries(definitions).forEach(([kind, definition]) => {
                const header = findHeader(matrix, definition);
                const hint = definition.label === "Santri"
                  ? (sheetHint.includes("santri") || sheetHint.includes("student"))
                  : definition.label === "User"
                    ? (sheetHint.includes("user") || sheetHint.includes("akun") || sheetHint.includes("guru"))
                    : (sheetHint.includes("jadwal") || sheetHint.includes("schedule"));
                const score = header.score + (hint ? 2 : 0);
                if (header.index >= 0 && (!best || score > best.score)) best = { kind, score, header };
              });
              return best;
            };
            const toCanonicalCsv = (sheetName, definition, matrix, headerInfo) => {
              const aliases = {};
              Object.entries(definition.fields).forEach(([canonical, names]) => {
                names.forEach((name) => { aliases[normalize(name)] = canonical; });
              });
              const canonicalHeaders = Object.keys(definition.fields);
              const sourceHeaders = headerInfo.headers;
              const mapped = sourceHeaders.map((header) => aliases[normalize(header)] || "");
              const recognized = mapped.filter(Boolean).length;
              if (recognized < definition.required.length) return { error: "Kolom wajib pada sheet " + sheetName + " belum dikenali." };
              const mappedFields = new Set(mapped.filter(Boolean));
              if (definition === definitions.users && !mappedFields.has("Password") && !(mappedFields.has("Salt") && mappedFields.has("PasswordHash"))) {
                return { error: "Sheet " + sheetName + " tidak memiliki Password atau pasangan Salt dan PasswordHash." };
              }
              const output = [canonicalHeaders];
              matrix.slice(headerInfo.index + 1).forEach((row) => {
                if (!row.some((cell) => String(cell || "").trim())) return;
                const item = {};
                mapped.forEach((canonical, index) => {
                  if (canonical && item[canonical] === undefined) item[canonical] = row[index] === undefined ? "" : row[index];
                });
                output.push(canonicalHeaders.map((header) => item[header] === undefined ? "" : item[header]));
              });
              if (output.length < 2) return { error: "Sheet " + sheetName + " tidak memiliki baris data." };
              const canonicalSheet = XLSX.utils.aoa_to_sheet(output);
              return { csv: XLSX.utils.sheet_to_csv(canonicalSheet), recognized, headerRow: headerInfo.index + 1 };
            };
            const candidates = {};
            workbook.SheetNames.forEach((sheetName) => {
              const matrix = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { header: 1, defval: "" });
              const match = classifySheet(sheetName, matrix);
              if (match && (!candidates[match.kind] || match.score > candidates[match.kind].score)) candidates[match.kind] = { ...match, sheetName, matrix };
            });
            const csvFiles = Object.entries(definitions).map(([kind, definition]) => {
              const candidate = candidates[kind];
              if (!candidate) return { kind, label: definition.label, csv: "", error: "Sheet untuk " + definition.label + " tidak ditemukan." };
              const converted = toCanonicalCsv(candidate.sheetName, definition, candidate.matrix, candidate.header);
              return { kind, label: definition.label, sheetName: candidate.sheetName, ...converted };
            });
            const problems = csvFiles.filter((item) => item.error || !item.csv.trim());
            if (problems.length) {
              this.showToast("Excel belum dapat disesuaikan: " + problems.map((item) => item.error).join(" "), "error");
              event.target.value = "";
              return;
            }
            const summary = csvFiles.map((item) => item.label + " dari sheet '" + item.sheetName + "'").join("\n- ");
            if (!confirm("Aplikasi menemukan susunan berikut:\n- " + summary + "\n\nLanjutkan membaca data ini? Data belum masuk sebelum tombol Proses Import ditekan.")) {
              event.target.value = "";
              return;
            }
            this.productSaving = true;
            const uploadNext = (index) => {
              if (index >= csvFiles.length) {
                this.productSaving = false;
                event.target.value = "";
                this.showToast("Excel berhasil dibaca. Klik Preview sebelum Proses Import.", "success");
                return;
              }
              const item = csvFiles[index];
              const csvBlob = new Blob([item.csv], { type: "text/csv;charset=utf-8" });
              const csvReader = new FileReader();
              csvReader.onload = () => {
                const dataUrl = String(csvReader.result || "");
                const comma = dataUrl.indexOf(",");
                callGoogleScript("importSetupCsv", {
                  kind: item.kind,
                  fileName: file.name + " / " + item.kind,
                  contentBase64: comma < 0 ? dataUrl : dataUrl.slice(comma + 1),
                }, this.user).onSuccess((err) => {
                  if (err) {
                    this.productSaving = false;
                    event.target.value = "";
                    this.showToast(err.message || "Sheet Excel gagal dimuat.", "error");
                    return;
                  }
                  uploadNext(index + 1);
                });
              };
              csvReader.onerror = () => {
                this.productSaving = false;
                event.target.value = "";
                this.showToast("Sheet Excel tidak dapat dibaca.", "error");
              };
              csvReader.readAsDataURL(csvBlob);
            };
            uploadNext(0);
          } catch (error) {
            this.showToast("File Excel tidak dapat dibaca. Gunakan template resmi.", "error");
            event.target.value = "";
          }
        };
        reader.onerror = () => this.showToast("File Excel tidak dapat dibaca dari perangkat.", "error");
        reader.readAsArrayBuffer(file);
      },

      importSetupCsvAction(kind, event) {
        const file = event && event.target && event.target.files ? event.target.files[0] : null;
        if (!file) return;
        if (!/\.(csv|txt)$/i.test(file.name)) {
          this.showToast("Gunakan file CSV UTF-8 atau upload satu file Excel dari tombol di atas.", "error");
          event.target.value = "";
          return;
        }
        if (file.size > 3 * 1024 * 1024) {
          this.showToast("File terlalu besar. Pecah menjadi beberapa file CSV.", "error");
          event.target.value = "";
          return;
        }
        const reader = new FileReader();
        reader.onload = () => {
          const result = String(reader.result || "");
          const comma = result.indexOf(",");
          const contentBase64 = comma === -1 ? result : result.slice(comma + 1);
          this.productSaving = true;
          callGoogleScript("importSetupCsv", { kind, fileName: file.name, contentBase64 }, this.user).onSuccess((err, data) => {
            this.productSaving = false;
            event.target.value = "";
            if (err) {
              this.showToast(err.message || "File gagal dimuat.", "error");
              return;
            }
            this.showToast((data && data.message) || "File berhasil dimuat. Lanjutkan Preview.", "success");
          });
        };
        reader.onerror = () => this.showToast("File tidak dapat dibaca dari perangkat.", "error");
        reader.readAsDataURL(file);
      },

      uploadTenantLogoAction(event) {
        const file = event && event.target && event.target.files ? event.target.files[0] : null;
        if (!file) return;
        const allowed = ["image/png", "image/jpeg", "image/webp"];
        if (!allowed.includes(String(file.type || "").toLowerCase())) {
          this.showToast("Logo harus berupa PNG, JPG, atau WEBP.", "error");
          event.target.value = "";
          return;
        }
        const reader = new FileReader();
        reader.onload = () => {
          const image = new Image();
          image.onload = () => {
            const maxSide = 512;
            const scale = Math.min(1, maxSide / Math.max(image.width, image.height));
            const canvas = document.createElement("canvas");
            canvas.width = Math.max(1, Math.round(image.width * scale));
            canvas.height = Math.max(1, Math.round(image.height * scale));
            const context = canvas.getContext("2d");
            context.fillStyle = "#ffffff";
            context.fillRect(0, 0, canvas.width, canvas.height);
            context.drawImage(image, 0, 0, canvas.width, canvas.height);
            const dataUrl = canvas.toDataURL("image/jpeg", 0.78);
            if (dataUrl.length > 65000) {
              this.showToast("Logo terlalu besar. Pilih gambar yang lebih sederhana.", "error");
              return;
            }
            this.productSaving = true;
            callGoogleScript("uploadTenantLogo", { dataUrl }, this.user).onSuccess((err, data) => {
              this.productSaving = false;
              if (err) {
                this.showToast(err.message || "Logo gagal diunggah.", "error");
                return;
              }
              if (data?.logoUrl) this.tenantProfileForm.LogoUrl = data.logoUrl;
              this.showToast("Logo berhasil diunggah. Klik Simpan Profil.", "success");
            });
          };
          image.onerror = () => this.showToast("File logo tidak dapat dibaca.", "error");
          image.src = String(reader.result || "");
        };
        reader.onerror = () => this.showToast("File logo tidak dapat dibaca.", "error");
        reader.readAsDataURL(file);
      },

      syncAcademicAssignments() {
        const periodId = this.academicAssignmentForm.PeriodID || this.academicMatrixFilter.PeriodID;
        if (!periodId) return this.showToast("Pilih periode terlebih dahulu.", "error");
        this.loadingAcademic = true;
        google.script.run
          .withSuccessHandler((preview) => {
            this.loadingAcademic = false;
            if (!preview?.ok) return this.showToast(preview?.message || "Pratinjau gagal.", "error");
            const matches = preview.data?.matches?.filter(item => !item.alreadyExists).length || 0;
            const unmatched = preview.data?.unmatched?.length || 0;
            const unmatchedPreview = (preview.data?.unmatched || [])
              .slice(0, 10)
              .map(item => `${item.subject || '-'} / ${item.className || '-'} / ${item.teacher || '-'}`)
              .join("\n");
            const detail = unmatchedPreview ? `\n\nBelum cocok:\n${unmatchedPreview}` : "";
            if (!confirm(`Tambahkan ${matches} penugasan? ${unmatched} jadwal tidak cocok dan perlu diperiksa manual.${detail}`)) return;
            this.loadingAcademic = true;
            google.script.run
              .withSuccessHandler((res) => {
                this.loadingAcademic = false;
                if (res?.ok) {
                  this.showToast(`${res.data?.created || 0} penugasan ditambahkan.`, "success");
                  this.loadAcademicSetup();
                } else this.showToast(res?.message || "Sinkronisasi gagal.", "error");
              })
              .withFailureHandler((err) => {
                this.loadingAcademic = false;
                this.showToast(err.message || "Sinkronisasi gagal.", "error");
              })
              .syncAcademicTeacherAssignmentsFromSchedules(periodId, true, this.user);
          })
          .withFailureHandler((err) => {
            this.loadingAcademic = false;
            this.showToast(err.message || "Pratinjau gagal.", "error");
          })
          .syncAcademicTeacherAssignmentsFromSchedules(periodId, false, this.user);

        if (this.behaviorChartInstance) {
          this.behaviorChartInstance.destroy();
          this.behaviorChartInstance = null;

      renderDashboardCharts() {
        const self = this;

        // Debounce: prevent double render within 1 second
        const now = Date.now();
        if (this._lastChartRender && now - this._lastChartRender < 1000) {
          console.log("[Dashboard] Skipping render - called too soon");
          return;
        }
        this._lastChartRender = now;

        // Multiple attempts with increasing delays
        const attempts = [0, 100, 300, 500];
        let attemptIndex = 0;

        function tryRender() {
          // Skip if already rendered with data
          if (self.memoChartInstance && self.behaviorChartInstance) {
            console.log("[Dashboard] Charts already exist, skipping re-render");
            return;
          }
          self.destroyDashboardCharts();

          const memoCanvas = document.getElementById("memoChart");
          const behaviorCanvas = document.getElementById("behaviorChart");

          // Log for debugging
          console.log("[Dashboard] renderDashboardCharts called");
          console.log("[Dashboard] memoCanvas:", !!memoCanvas);
          console.log("[Dashboard] behaviorCanvas:", !!behaviorCanvas);
          console.log(
            "[Dashboard] memoChartData:",
            self.summary.memoChartData
              ? self.summary.memoChartData.length
              : "null",
          );
          console.log(
            "[Dashboard] behaviorChartData:",
            self.summary.behaviorChartData
              ? self.summary.behaviorChartData.length
              : "null",
          );

          // Memo Chart
          if (memoCanvas && self.summary.memoChartData) {
            const memoData = self.summary.memoChartData;

            // Get parent container and ensure it has proper styling
            const memoContainer = memoCanvas.parentElement;
            if (memoContainer) {
              memoContainer.style.position = "relative";
              memoContainer.style.height = "256px";
              memoContainer.style.width = "100%";
            }

            if (memoData.length > 0) {
              self.memoChartInstance = new Chart(memoCanvas, {
                type: "line",
                data: {
                  labels: memoData.map((d) => d.label),
                  datasets: [
                    {
                      label: "Total Setoran",
                      data: memoData.map((d) => d.total),
                      borderColor: "#22c55e",
                      backgroundColor: "rgba(34, 197, 94, 0.1)",
                      fill: true,
                      tension: 0.4,
                    },
                    {
                      label: "Disetujui",
                      data: memoData.map((d) => d.approved),
                      borderColor: "#16a34a",
                      backgroundColor: "rgba(22, 163, 74, 0.1)",
                      fill: true,
                      tension: 0.4,
                    },
                  ],
                },
                options: {
                  responsive: true,
                  maintainAspectRatio: false,
                  animation: { duration: 800 },
                  plugins: {
                    legend: { position: "bottom" },
                  },
                  scales: {
                    y: { beginAtZero: true, ticks: { stepSize: 1 } },
                  },
                },
              });
              console.log("[Dashboard] memoChart created successfully");
            }
          }

          // Behavior Score Chart
          if (behaviorCanvas && self.summary.behaviorChartData) {
            const behaviorData = self.summary.behaviorChartData;

            // Get parent container and ensure it has proper styling
            const behaviorContainer = behaviorCanvas.parentElement;
            if (behaviorContainer) {
              behaviorContainer.style.position = "relative";
              behaviorContainer.style.height = "256px";
              behaviorContainer.style.width = "100%";
            }

            if (behaviorData.length > 0) {
              self.behaviorChartInstance = new Chart(behaviorCanvas, {
                type: "line",
                data: {
                  labels: behaviorData.map((d) => d.label),
                  datasets: [
                    {
                      label: "Skor Perilaku Rata-rata",
                      data: behaviorData.map((d) => d.avgScore),
                      borderColor: "#f97316",
                      backgroundColor: "rgba(249, 115, 22, 0.1)",
                      fill: true,
                      tension: 0.4,
                    },
                  ],
                },
                options: {
                  responsive: true,
                  maintainAspectRatio: false,
                  animation: { duration: 800 },
                  plugins: {
                    legend: { position: "bottom" },
                  },
                  scales: {
                    y: { beginAtZero: false },
                  },
                },
              });
              console.log("[Dashboard] behaviorChart created successfully");
            }
          }
        }

        // Try rendering immediately and then with delays
        function scheduleNextAttempt() {
          if (attemptIndex < attempts.length) {
            setTimeout(function () {
              tryRender();
              attemptIndex++;
              scheduleNextAttempt();
            }, attempts[attemptIndex]);
          }
        }
        scheduleNextAttempt();
      },

      // ===== HELPER FUNCTIONS =====
      formatDate(isoString) {
        if (!isoString) return "-";
        const date = new Date(isoString);
        return date.toLocaleDateString("id-ID", {
          day: "numeric",
          month: "short",
        });
      },

      formatLongDate(value) {
        if (!value) return "-";
        const date = new Date(value);
        if (isNaN(date.getTime())) return value;
        return date.toLocaleDateString("id-ID", {
          weekday: "long",
          day: "numeric",
          month: "long",
          year: "numeric",
        });
      },

      setQuickFilter(type) {
        const now = new Date();
        const start = new Date();
        switch (type) {
          case "day":
            start.setHours(0, 0, 0, 0);
            break;
          case "week":
            start.setDate(now.getDate() - 7);
            break;
          case "month":
            start.setMonth(now.getMonth() - 1);
            break;
        }
        this.filters.startDate = localDateString(start);
        this.filters.endDate = localDateString(now);
        this.fetchSummary();
      },

        this.filters.startDate = "";
        this.filters.endDate = "";
        this.filters.classFilter = "";
        this.filters.memoCategory = "";

        this.studentEditForm = {

      saveStudentProfile() {
        if (!this.selectedStudent?.StudentID || this.savingStudentProfile) return;
        if (!String(this.studentEditForm.Name || "").trim()) {
          this.showToast("Nama santri wajib diisi.", "error");
          return;
        }
        if (!String(this.studentEditForm.ClassLevel || "").trim()) {
          this.showToast("Kelas/level wajib diisi.", "error");
          return;
        }

        this.savingStudentProfile = true;
        callGoogleScript(
          "updateStudentProfile",
          this.selectedStudent.StudentID,
          { ...this.studentEditForm },
          this.user,
        ).onSuccess((err, updatedStudent) => {
          this.savingStudentProfile = false;
          if (err) {
            this.showToast(err.message || "Gagal menyimpan biodata santri", "error");
            return;
          }

          const normalized = {
            ...this.selectedStudent,
            ...(updatedStudent || {}),
            Name: updatedStudent?.Name || this.studentEditForm.Name,
            NIS: updatedStudent?.NIS || this.studentEditForm.NIS,
            "Class/Level":
              updatedStudent?.["Class/Level"] || this.studentEditForm.ClassLevel,
            Gender: updatedStudent?.Gender || this.studentEditForm.Gender,
            ParentContact:
              updatedStudent?.ParentContact || this.studentEditForm.ParentContact,
            Status: updatedStudent?.Status || this.studentEditForm.Status,
          };

          this.selectedStudent = normalized;
          this.students = this.students.map((student) =>
            student.StudentID === normalized.StudentID
              ? { ...student, ...normalized }
              : student,
          );
          this.editingStudentProfile = false;
          this.studentEditForm = { ...FORM_DEFAULTS.studentEditForm };
          this.showToast("Biodata santri berhasil disimpan.", "success");
          this.fetchStudents();
        });

      syncWaliStudentDetail() {
        if (this.user?.Role !== "Wali") return;
        if (!Array.isArray(this.students) || this.students.length === 0) {
          this.selectedStudent = null;
          this.studentHistory = [];
          this.studentIncidents = [];
          this.raportData = null;
          this.fullStudentReport = false;
          this.selectedRaportPeriodId = "";
          return;
        }

        const currentId = this.selectedStudent?.StudentID || "";
        const matched =
          this.students.find((student) => student.StudentID === currentId) ||
          this.students[0];

        if (!matched) return;

        const changed = matched.StudentID !== currentId;
        this.selectedStudent = { ...matched };
        this.studentDetailTab = this.studentDetailTab || "hafalan";
        this.showDetailModal = false;

        if (changed || !this.studentHistory.length || !this.studentIncidents.length) {
          this.studentHistory = [];
          this.studentIncidents = [];
          this.behaviorFilter = "all";
          this.behaviorVisibleCount = 5;
          this.memoFilter = "all";
          this.memoVisibleCount = 5;
          this.fullStudentReport = false;
          this.raportLoadError = "";
          this.raportData = null;
          this.selectedRaportPeriodId = "";
          this.refreshStudentDetail();
          this.loadFullStudentReport(matched.StudentID);
        }
      },

      // ===== PULL TO REFRESH =====
      handleTouchStart(e) {
        if (window.scrollY === 0 && !this.isRefreshing) {
          this.pullStartY = e.touches[0].clientY;
          this.pullMoveY = this.pullStartY;
          this.pullDistance = 0;
        }
      },
      handleTouchMove(e) {
        if (this.pullStartY > 0 && !this.isRefreshing) {
          this.pullMoveY = e.touches[0].clientY;
          let diff = this.pullMoveY - this.pullStartY;
          
          if (diff > 0 && window.scrollY === 0) {
            // Add resistance
            this.pullDistance = diff * 0.4;
            if (this.pullDistance > 80) this.pullDistance = 80;
            // Prevent default scroll on some browsers
            if (e.cancelable && diff > 10) e.preventDefault(); 
          } else {
            this.pullDistance = 0;
          }
        }
      },
      handleTouchEnd() {
        if (this.pullDistance > 60 && !this.isRefreshing) {
          this.triggerRefresh();
        } else if (!this.isRefreshing) {
          // Reset pull if not refreshing
          this.pullStartY = 0;
          this.pullMoveY = 0;
          this.pullDistance = 0;
        }

        this.isRefreshing = true;
        this.pullDistance = 60; // Keep spinner visible at 60px
        
        // Vibrate to provide feedback if supported
        if (navigator.vibrate) navigator.vibrate(50);
        
        // Trigger data refresh depending on tab
        this.refreshData();
        
        // Artificial delay for UI smoothness (ensure spinner is seen for at least 800ms)
        await new Promise(resolve => setTimeout(resolve, 800));
        
        this.isRefreshing = false;
        this.pullStartY = 0;
        this.pullMoveY = 0;
        this.pullDistance = 0;

      // ===== REPORT ACTIONS =====
      generatePDF() {
        if (!this.selectedStudent?.StudentID || !this.selectedRaportPeriodId) {
          this.showToast("Pilih periode raport terlebih dahulu.", "error");
          return;
        }
        this.loadingReport = true;
        google.script.run
          .withSuccessHandler((res) => {
            this.loadingReport = false;
            if (res?.ok && res.data?.base64) {
              const binary = atob(res.data.base64);
              const bytes = new Uint8Array(binary.length);
              for (let index = 0; index < binary.length; index++) {
                bytes[index] = binary.charCodeAt(index);
              }
              const blob = new Blob([bytes], {
                type: res.data.mimeType || "application/pdf",
              });
              const url = URL.createObjectURL(blob);
              const link = document.createElement("a");
              link.href = url;
              link.download = res.data.filename || "raport-santri.pdf";
              document.body.appendChild(link);
              link.click();
              document.body.removeChild(link);
              URL.revokeObjectURL(url);
              this.showToast("Raport PDF berhasil diunduh.", "success");
            } else {
              this.showToast(res?.message || "Gagal membuat PDF.", "error");
            }
          })
          .withFailureHandler((err) => {
            this.loadingReport = false;
            this.showToast("Gagal membuat PDF: " + err.message, "error");
          })
          .downloadStudentReportPdf(
            this.selectedStudent.StudentID,
            this.selectedRaportPeriodId,
            this.user,
          );
      },

      shareReportToWali() {
        if (!this.selectedStudent?.StudentID || !this.selectedRaportPeriodId) {
          this.showToast("Pilih periode raport terlebih dahulu.", "error");
          return;
        }
        this.loadingReport = true;
        google.script.run
          .withSuccessHandler((previewRes) => {
            if (!previewRes?.ok || !previewRes.data) {
              this.loadingReport = false;
              this.showToast(previewRes?.message || "Gagal menyiapkan laporan wali.", "error");
              return;
            }
            const preview = previewRes.data;
            if (!preview.isValidPhone || !preview.link) {
              this.loadingReport = false;
              this.showToast(preview.note || "Nomor wali belum siap.", "error");
              return;
            }
            google.script.run
              .withSuccessHandler((pdfRes) => {
                this.loadingReport = false;
                if (!pdfRes?.ok || !pdfRes.data?.base64) {
                  this.showToast(pdfRes?.message || "PDF belum berhasil dibuat.", "error");
                  return;
                }
                const binary = atob(pdfRes.data.base64);
                const bytes = new Uint8Array(binary.length);
                for (let index = 0; index < binary.length; index++) bytes[index] = binary.charCodeAt(index);
                const blob = new Blob([bytes], { type: pdfRes.data.mimeType || "application/pdf" });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.href = url;
                link.download = pdfRes.data.filename || preview.pdfFilename || "raport-santri.pdf";
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
                window.open(preview.link, "_blank", "noopener,noreferrer");
                this.showToast("PDF diunduh dan WhatsApp wali siap dibuka.", "success");
              })
              .withFailureHandler((err) => {
                this.loadingReport = false;
                this.showToast("Gagal membuat PDF: " + (err?.message || "Terjadi kesalahan."), "error");
              })
              .downloadStudentReportPdf(this.selectedStudent.StudentID, this.selectedRaportPeriodId, this.user);

            this.showToast("Gagal menyiapkan share: " + (err?.message || "Terjadi kesalahan."), "error");
          })
          .getGuardianReportSharePreview(this.selectedStudent.StudentID, this.selectedRaportPeriodId, this.user);

        ) {
          this.userFormError = "Nama, Username, dan Role wajib diisi.";

          (!this.userForm.Password || this.userForm.Password.length < 6)
        ) {
          this.userFormError = "Password minimal 6 karakter.";
          return;
        }

        if (

        ) {

          return;

          Phone: this.userForm.Phone,
          Role: this.userForm.Role,

      toInputDate(value) {
        if (!value) {
          return "";
        }
        if (typeof value === "string" && /^\d{4}-\d{2}-\d{2}$/.test(value)) {
          return value;
        }
        const d = new Date(value);
        if (isNaN(d.getTime())) {
          return value;
        }
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      },

      loadSchedules() {
        if (this.user?.Role !== "Admin" && this.user?.Role !== "Mudir") return;
        const generation = this.authGeneration;
        this.loading = true;
        callGoogleScript("getSchedules", this.user)
          .onSuccess((err, data) => {
            if (generation !== this.authGeneration) return;
            this.loading = false;
            if (err) return this.showToast(err.message, "error");
            this.schedules = data.schedules || [];
            this.selectedScheduleIds = [];
            this.filterSchedules();
            this.loadScheduleEditorData();
          });

      loadScheduleEditorData() {
        callGoogleScript("getScheduleEditorData", this.user).onSuccess((err, data) => {
          if (!err && data) this.scheduleEditorData = data;
        });

      runSeedSchedules() {
        if (this.scheduleEditorData?.installationMode === "tenant") {
          this.showToast("Mode pondok tidak memakai master jadwal bawaan. Buat jadwal dari aplikasi atau impor template pondok.", "info");
          return;
        }
        if (this.importingMasterSchedules) return;
        if (!confirm("Gunakan master jadwal demo/kompatibilitas untuk mengisi Schedules? Jadwal master dengan ID MASTER- akan diperbarui; jadwal manual lain tetap dipertahankan.")) return;
        this.importingMasterSchedules = true;
        this.importMasterResult = null;
        this.loading = true;
        callGoogleScript("importMasterScheduleForAttendance", this.user)
          .onSuccess((err, data) => {
            this.loading = false;
            this.importingMasterSchedules = false;
            if (err) return this.showToast(err.message, "error");
            this.importMasterResult = data || null;
            this.clearAttendanceCaches();
            this.showToast(data.message || "Berhasil", "success");
            this.loadSchedules();
            this.loadMySchedulesToday();
          });

      filterSchedules() {
        let filtered = this.schedules;
        if (this.scheduleFilterDay) {
          filtered = filtered.filter(s => s.DayOfWeek === this.scheduleFilterDay);
        }
        if (this.scheduleFilterType) {
          filtered = filtered.filter(s => s.Type === this.scheduleFilterType);
        }
        if (!this.scheduleShowInactive) {
          filtered = filtered.filter(s => s.IsActive !== false && String(s.IsActive).toLowerCase() !== "false");
        }
        if (this.scheduleSearchQuery) {
          const q = this.scheduleSearchQuery.toLowerCase();
          filtered = filtered.filter(s =>
            (s.SubjectOrActivityName && s.SubjectOrActivityName.toLowerCase().includes(q)) ||
            (s.ClassOrGroupName && s.ClassOrGroupName.toLowerCase().includes(q)) ||
            (s.TeacherID && s.TeacherID.toLowerCase().includes(q)) ||
            (this.getUserNameById(s.TeacherID) && this.getUserNameById(s.TeacherID).toLowerCase().includes(q))
          );
        }
        this.filteredSchedules = filtered;
      },

      isScheduleSelected(id) {
        return this.selectedScheduleIds.includes(String(id));
      },

      toggleScheduleSelection(id) {
        const key = String(id || "");
        if (!key) return;
        this.selectedScheduleIds = this.isScheduleSelected(key)
          ? this.selectedScheduleIds.filter(item => item !== key)
          : [...this.selectedScheduleIds, key];
      },

      toggleVisibleScheduleSelection() {
        const visible = this.filteredSchedules.map(item => String(item.ScheduleID || "")).filter(Boolean);
        const allSelected = visible.length > 0 && visible.every(id => this.isScheduleSelected(id));
        this.selectedScheduleIds = allSelected
          ? this.selectedScheduleIds.filter(id => !visible.includes(id))
          : Array.from(new Set([...this.selectedScheduleIds, ...visible]));
      },

      openScheduleBulkModal() {
        if (!this.selectedScheduleIds.length) return this.showToast("Pilih jadwal terlebih dahulu.", "error");
        this.scheduleBulkForm = { operation: "move_day", DayOfWeek: "", StartTime: "", EndTime: "", TeacherID: "", ClassOrGroupName: "", IsActive: true };
        this.scheduleBulkPreview = null;
        this.showScheduleBulkModal = true;
      },

      previewScheduleBulk() {
        const form = this.scheduleBulkForm;
        if (form.operation === "move_day" && !form.DayOfWeek) return this.showToast("Pilih hari tujuan.", "error");
        if (form.operation === "move_time" && (!form.StartTime || !form.EndTime)) return this.showToast("Isi jam mulai dan selesai.", "error");
        if (form.operation === "replace_teacher" && !form.TeacherID) return this.showToast("Pilih pengajar pengganti.", "error");
        if (form.operation === "replace_class" && !form.ClassOrGroupName) return this.showToast("Pilih kelas pengganti.", "error");
        callGoogleScript("bulkUpdateSchedules", { ...form, scheduleIds: this.selectedScheduleIds, preview: true }, this.user)
          .onSuccess((err, data) => {
            if (err) return this.showToast(err.message, "error");
            this.scheduleBulkPreview = data;
          });

      applyScheduleBulk() {
        if (!this.scheduleBulkPreview) return this.previewScheduleBulk();
        if (!confirm("Terapkan perubahan pada " + this.scheduleBulkPreview.count + " jadwal?")) return;
        this.loading = true;
        callGoogleScript("bulkUpdateSchedules", { ...this.scheduleBulkForm, scheduleIds: this.selectedScheduleIds, preview: false }, this.user)
          .onSuccess((err, data) => {
            this.loading = false;
            if (err) return this.showToast(err.message, "error");
            this.showScheduleBulkModal = false;
            this.scheduleBulkPreview = null;
            this.clearAttendanceCaches();
            this.showToast(data.message || "Perubahan massal berhasil diterapkan.", "success");
            this.loadSchedules();

      runScheduleValidation() {
