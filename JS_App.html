            .withSuccessHandler((res) => {
              if (res && res.ok) {
                callback(null, res.data);
              } else {
                callback(new Error(res ? res.message : "Unknown error"));
              }
            })
            .withFailureHandler((err) => callback(err))
            [methodName](...args);
          return this;
        },
        onSuccessRaw: function (callback) {
          google.script.run
            .withSuccessHandler(callback)
            .withFailureHandler((err) => callback(null, null, err))
            [methodName](...args);
          return this;
        },

      // ===== INITIALIZATION =====
      init() {
        const savedUser = sessionStorage.getItem("user");
        if (savedUser) {
          try {
            this.user = JSON.parse(savedUser);
            if (this.user?.SessionToken) {
              this.isLoggedIn = true;
              this.refreshData();
            } else {
              sessionStorage.removeItem("user");
              this.user = { Username: "", Role: "" };
            }
          } catch (e) {
            sessionStorage.removeItem("user");
          }
        }
        if (!this.isLoggedIn) {
          this.loadPublicLandingInfo();
        }
      },

        this.currentTab = tab;
        this.mobileMoreOpen = false;
        this.mobileDrawerOpen = false;
        if (tab === "dashboard") this.fetchSummary();
        if (tab === "santri") this.fetchStudents();
        if (tab === "users") this.fetchUsers();
        if (tab === "akademik") {
          this.fetchStudents();
          this.loadAcademicSetup();
        }
        if (tab === "pulang_bulanan") this.loadPulangBulanan();
        if (tab === "informasi_pesantren") {
          this.pesantrenInfoSection = this.canManagePesantrenInfo()
            ? "kelola"
            : "beranda";
          this.loadPesantrenInfo();
        }

      // ===== HELPER: SCROLL TO FORM =====
      scrollToForm() {
        const bentoCard = this.$el?.querySelector(".bento-card");
        if (bentoCard) {
          bentoCard.scrollIntoView({ behavior: "smooth" });
        }
      },

      scrollToLogin() {
        const loginCard = document.getElementById("login");
        if (loginCard) {
          loginCard.scrollIntoView({ behavior: "smooth", block: "start" });
        }
      },

      getAppBaseUrl() {
        const canonical = String(window.APP_SCRIPT_URL || "").trim();
        if (canonical) {
          return canonical.replace(/[?#].*$/, "").replace(/\/$/, "");
        }

        const current = String(window.location.href || "").split("#")[0].split("?")[0];
        return current.replace(/\/$/, "").replace(/\/userCodeAppPanel$/, "");
      },

      getPublicWebsiteUrl() {
        const baseUrl = this.getAppBaseUrl();
        return baseUrl ? `${baseUrl}?page=public` : "?page=public";
      },

      navigateTop(url) {
        if (!url) return;
        const opened = window.open(url, "_blank", "noopener");
        if (!opened) {
          window.location.href = url;
        }
      },

      goToDashboard() {
        const url = this.getAppBaseUrl();
        if (!url) return;
        try {
          this.navigateTop(url);
        } catch (error) {
          window.location.href = url;
        }
      },

      openPublicWebsite() {
        const url = this.getPublicWebsiteUrl();
        try {
          this.navigateTop(url);
        } catch (error) {
          window.location.href = url;
        }
      },

      scrollToPesantrenInfoForm() {
        const editorCard = this.$el?.querySelector(".pesantren-info-editor");
        if (editorCard) {
          editorCard.scrollIntoView({ behavior: "smooth", block: "start" });
        }
      },

      // ===== HELPER: REFRESH STUDENT DETAIL =====
      refreshStudentDetail() {
        if (!this.selectedStudent?.StudentID) return;

        google.script.run
          .withSuccessHandler((res) => {
            if (res && res.ok && res.data) {
              this.studentHistory = res.data.memos;
              this.studentIncidents = res.data.incidents;
              this.$nextTick(() => {
                this.renderCharts();
              });
            }
          })
          .getStudentDetailData(this.selectedStudent.StudentID, this.user);

          this.$nextTick(() => this.scrollToPesantrenInfoForm());

      behaviorTypeLabel(type) {
        if (type === "Violation") return "Pelanggaran";
        if (type === "Improvement") return "Prestasi";
        return String(type || "-");
      },

      handleLogin() {
        if (!this.loginRole) {
          this.error = "Pilih role login terlebih dahulu";
          return;
        }
        if (!this.loginForm.username || !this.loginForm.password) {
          this.error = "Username dan Password harus diisi";
          return;
        }
        this.loading = true;
        this.error = "";

        google.script.run
          .withSuccessHandler((res) => {
            this.loading = false;
            if (res.ok) {
              this.user = res.user;
              sessionStorage.setItem("user", JSON.stringify(res.user));
              this.isLoggedIn = true;
              this.refreshData();
            } else {
              this.error = res.message;
            }
          })
          .withFailureHandler((err) => {
            this.loading = false;
            this.error = "Terjadi kesalahan koneksi: " + err;
          })
          .login(this.loginForm.username, this.loginForm.password);
      },

      handleRegister() {
        this.registerError = "";
        if (this.registerForm.password !== this.registerForm.confirmPassword) {
          this.registerError = "Password dan konfirmasi password tidak cocok.";
          return;
        }
        if (this.registerForm.password.length < 6) {
          this.registerError = "Password minimal 6 karakter.";
          return;
        }

        this.loading = true;
        google.script.run
          .withSuccessHandler((res) => {
            this.loading = false;
            if (res.ok) {
              this.showToast(res.message, "success");
              this.showRegister = false;
              this.resetForm("registerForm");
              this.error = "";
            } else {
              this.registerError = res.message;
            }
          })
          .createAccount(
            this.registerForm.username,
            this.registerForm.password,
            "Wali",
          );
      },

      logout() {
        if (this.user?.SessionToken) {
          try {
            google.script.run.logoutSession(this.user);
          } catch (e) {}
        }
        this.isLoggedIn = false;
        this.user = { Username: "", Role: "" };
        this.mobileMoreOpen = false;
        this.mobileDrawerOpen = false;
        this.showChangePasswordModal = false;
        this.changePasswordError = "";
        this.loadingChangePassword = false;
        this.publicLandingItems = [];
        this.publicLandingSummary = {
          total: 0,
          published: 0,
          draft: 0,
          archived: 0,
          pinned: 0,
          upcoming: 0,
        };
        this.loadingPublicLanding = false;
        this.pesantrenInfoSection = "beranda";
        this.pesantrenInfoList = [];
        this.pesantrenInfoFilters = {
          Category: "",
          Status: "",
          Audience: "",
          Search: "",
          PinnedOnly: false,
        };
        this.pesantrenInfoSummary = {
          total: 0,
          published: 0,
          draft: 0,
          archived: 0,
          pinned: 0,
          upcoming: 0,
        };
        this.loadingPesantrenInfo = false;
        this.editModePesantrenInfo = null;
        this.academicSection = "nilai";
        this.academicSetup = {
          periods: [],
          subjects: [],
          components: [],
          importHeaders: [],
          defaultComponents: [],
        };
        this.academicMatrix = {
          period: null,
          subject: null,
          components: [],
          rows: [],
          isLocked: false,
        };
        this.selectedRaportPeriodId = "";
        this.resetPesantrenInfoForm();
        this.resetLoginRole();
        this.resetForm("changePasswordForm");
        sessionStorage.removeItem("user");
        this.loadPublicLandingInfo();
      },

      openChangePasswordModal() {
        this.changePasswordError = "";
        this.resetForm("changePasswordForm");
        this.showChangePasswordModal = true;
        this.mobileMoreOpen = false;
        this.mobileDrawerOpen = false;
      },

      closeChangePasswordModal() {
        this.showChangePasswordModal = false;
        this.changePasswordError = "";
        this.loadingChangePassword = false;
        this.resetForm("changePasswordForm");
      },

      submitChangePasswordForm() {
        this.changePasswordError = "";

        if (
          !this.changePasswordForm.oldPassword ||
          !this.changePasswordForm.newPassword
        ) {
          this.changePasswordError = "Password lama dan baru wajib diisi.";
          return;
        }

        if (this.changePasswordForm.newPassword.length < 6) {
          this.changePasswordError = "Password baru minimal 6 karakter.";
          return;
        }

        if (
          this.changePasswordForm.newPassword !==
          this.changePasswordForm.confirmPassword
        ) {
          this.changePasswordError = "Password baru dan konfirmasi tidak cocok.";
          return;
        }

        if (
          this.changePasswordForm.oldPassword ===
          this.changePasswordForm.newPassword
        ) {
          this.changePasswordError =
            "Password baru harus berbeda dari password lama.";
          return;
        }

        this.loadingChangePassword = true;
        google.script.run
          .withSuccessHandler((res) => {
            this.loadingChangePassword = false;
            if (res.ok) {
              this.showToast(res.message, "success");
              this.closeChangePasswordModal();
              setTimeout(() => {
                this.logout();
              }, 300);
              return;
            }
            this.changePasswordError = res.message;
          })
          .withFailureHandler((err) => {
            this.loadingChangePassword = false;
            this.changePasswordError = "Terjadi kesalahan: " + err.message;
          })
          .changeOwnPassword(
            this.user,
            this.changePasswordForm.oldPassword,
            this.changePasswordForm.newPassword,
          );
      },

      // ===== DATA FETCHING =====
      refreshData() {
        this.fetchStudents();
        this.fetchSummary();
        if (this.user?.Role === "Mudir" || this.user?.Role === "Admin") {
          this.fetchUsers();
        }
        if (this.selectedStudent?.StudentID) {
          this.refreshStudentDetail();
          if (this.fullStudentReport) {
            this.loadFullStudentReport(
              this.selectedStudent.StudentID,
              this.selectedRaportPeriodId,
            );
          }
        }
        if (this.currentTab === "informasi_pesantren") {
          this.loadPesantrenInfo();
        }
        if (this.currentTab === "akademik") {
          this.loadAcademicSetup();
        }
        if (this.currentTab === "pulang_bulanan") {
          this.loadPulangBulanan();
        }
      },

      loadPublicLandingInfo() {
        this.loadingPublicLanding = true;
        google.script.run
          .withSuccessHandler((res) => {
            this.loadingPublicLanding = false;
            if (res && res.ok) {
              this.publicLandingItems = res.data?.items || [];
              this.publicLandingSummary = res.data?.summary || {
                total: 0,
                published: 0,
                draft: 0,
                archived: 0,
                pinned: 0,
                upcoming: 0,
              };
            }
          })
          .withFailureHandler(() => {
            this.loadingPublicLanding = false;
          })
          .getPublicPesantrenInfo({});
      },

      fetchSummary() {
        if (this.students.length === 0) this.loading = true;

        google.script.run
          .withSuccessHandler((res) => {
            this.loading = false;
            if (res.ok) {
              this.summary = res.data;
              this.$nextTick(() => {
                this.renderDashboardCharts();
              });
            }
          })
          .withFailureHandler(() => {
            this.loading = false;
            this.showToast("Gagal memuat ringkasan data", "error");
          })
          .getDashboardSummary(this.user, this.filters);
      },

      loadPesantrenInfo() {
        if (!this.user) return;

        this.loadingPesantrenInfo = true;
        this.pesantrenInfoVisibleCount = 6;
        google.script.run
          .withSuccessHandler((res) => {
            this.loadingPesantrenInfo = false;
            if (res && res.ok) {
              this.pesantrenInfoList = res.data?.items || [];
              this.pesantrenInfoSummary = res.data?.summary || {
                total: 0,
                published: 0,
                draft: 0,
                archived: 0,
                pinned: 0,
                upcoming: 0,
              };
              this.pesantrenInfoCategories =
                res.data?.categories || this.pesantrenInfoCategories;
              this.pesantrenInfoAudiences =
                res.data?.audiences || this.pesantrenInfoAudiences;
              this.pesantrenInfoStatuses =
                res.data?.statuses || this.pesantrenInfoStatuses;
              this.pesantrenInfoPriorities =
                res.data?.priorities || this.pesantrenInfoPriorities;
            } else {
              this.showToast(res?.message || "Gagal memuat informasi pesantren", "error");
            }
          })
          .withFailureHandler((err) => {
            this.loadingPesantrenInfo = false;
            this.showToast(
              err.message || "Gagal memuat informasi pesantren",
              "error",
            );
          })
          .getPesantrenInfo(this.user, this.pesantrenInfoFilters);
      },

        this.editModePesantrenInfo = null;
        this.pesantrenInfoForm = {
          InfoID: "",
          Title: "",
          Category: "Pengumuman",
          Summary: "",
          Content: "",
          DisplayDate: new Date().toISOString().split("T")[0],
          EventDate: "",
          EndDate: "",
          Location: "",
          Priority: "Normal",
          IsPinned: false,

          Status: "Published",
          AttachmentTitle: "",

          ContactName: "",
          ContactPhone: "",
        };
      },

      editPesantrenInfo(item) {
        this.editModePesantrenInfo = item.InfoID;
        this.pesantrenInfoForm = {
          InfoID: item.InfoID || "",
          Title: item.Title || "",
          Category: item.Category || "Pengumuman",
          Summary: item.Summary || "",
          Content: item.Content || "",
          DisplayDate: this.toInputDate(item.DisplayDate),
          EventDate: this.toInputDate(item.EventDate),
          EndDate: this.toInputDate(item.EndDate),
          Location: item.Location || "",
          Priority: item.Priority || "Normal",
          IsPinned: !!item.IsPinned,
          Audience: item.Audience || "Semua",
          Status: item.Status || "Published",
          AttachmentTitle: item.AttachmentTitle || "",
          AttachmentURL: item.AttachmentURL || "",
          ContactName: item.ContactName || "",
          ContactPhone: item.ContactPhone || "",
        };
        this.$nextTick(() => this.scrollToPesantrenInfoForm());
      },

      cancelPesantrenInfoEdit() {
        this.resetPesantrenInfoForm();
      },

      submitPesantrenInfoForm() {
        if (!this.canManagePesantrenInfo()) {
          this.showToast("Akses ditolak.", "error");
          return;
        }

        if (
          !this.pesantrenInfoForm.Title ||
          !this.pesantrenInfoForm.Category ||
          !this.pesantrenInfoForm.Content
        ) {
          this.showToast(
            "Judul, kategori, dan isi informasi wajib diisi.",
            "error",
          );
          return;
        }

        this.loadingPesantrenInfo = true;
        const payload = {
          ...this.pesantrenInfoForm,
          IsPinned: !!this.pesantrenInfoForm.IsPinned,
        };

        google.script.run
          .withSuccessHandler((res) => {
            this.loadingPesantrenInfo = false;
            if (res && res.ok) {
              this.showToast(res.message || "Informasi tersimpan.", "success");
              this.resetPesantrenInfoForm();
              this.loadPesantrenInfo();
            } else {
              this.showToast(res?.message || "Gagal menyimpan informasi.", "error");
            }
          })
          .withFailureHandler((err) => {
            this.loadingPesantrenInfo = false;
            this.showToast(
              err.message || "Gagal menyimpan informasi.",
              "error",
            );
          })
          .savePesantrenInfo(payload, this.user);
      },

      updatePesantrenInfoStatus(infoId, status) {

      destroyDashboardCharts() {
        if (this.memoChartInstance) {
          this.memoChartInstance.destroy();
          this.memoChartInstance = null;
        }
        if (this.behaviorChartInstance) {
          this.behaviorChartInstance.destroy();
          this.behaviorChartInstance = null;
        }
      },

      renderDashboardCharts() {
        const self = this;

        // Debounce: prevent double render within 1 second
        const now = Date.now();
        if (this._lastChartRender && now - this._lastChartRender < 1000) {
          console.log("[Dashboard] Skipping render - called too soon");
          return;
        }
        this._lastChartRender = now;

        // Multiple attempts with increasing delays
        const attempts = [0, 100, 300, 500];
        let attemptIndex = 0;

        function tryRender() {
          // Skip if already rendered with data
          if (self.memoChartInstance && self.behaviorChartInstance) {
            console.log("[Dashboard] Charts already exist, skipping re-render");
            return;
          }
          self.destroyDashboardCharts();

          const memoCanvas = document.getElementById("memoChart");
          const behaviorCanvas = document.getElementById("behaviorChart");

          // Log for debugging
          console.log("[Dashboard] renderDashboardCharts called");
          console.log("[Dashboard] memoCanvas:", !!memoCanvas);
          console.log("[Dashboard] behaviorCanvas:", !!behaviorCanvas);
          console.log(
            "[Dashboard] memoChartData:",
            self.summary.memoChartData
              ? self.summary.memoChartData.length
              : "null",
          );
          console.log(
            "[Dashboard] behaviorChartData:",
            self.summary.behaviorChartData
              ? self.summary.behaviorChartData.length
              : "null",
          );

          // Memo Chart
          if (memoCanvas && self.summary.memoChartData) {
            const memoData = self.summary.memoChartData;

            // Get parent container and ensure it has proper styling
            const memoContainer = memoCanvas.parentElement;
            if (memoContainer) {
              memoContainer.style.position = "relative";
              memoContainer.style.height = "256px";
              memoContainer.style.width = "100%";
            }

            if (memoData.length > 0) {
              self.memoChartInstance = new Chart(memoCanvas, {
                type: "line",
                data: {
                  labels: memoData.map((d) => d.label),
                  datasets: [
                    {
                      label: "Total Setoran",
                      data: memoData.map((d) => d.total),
                      borderColor: "#22c55e",
                      backgroundColor: "rgba(34, 197, 94, 0.1)",
                      fill: true,
                      tension: 0.4,
                    },
                    {
                      label: "Disetujui",
                      data: memoData.map((d) => d.approved),
                      borderColor: "#16a34a",
                      backgroundColor: "rgba(22, 163, 74, 0.1)",
                      fill: true,
                      tension: 0.4,
                    },
                  ],
                },
                options: {
                  responsive: true,
                  maintainAspectRatio: false,
                  animation: { duration: 800 },
                  plugins: {
                    legend: { position: "bottom" },
                  },
                  scales: {
                    y: { beginAtZero: true, ticks: { stepSize: 1 } },
                  },
                },
              });
              console.log("[Dashboard] memoChart created successfully");
            }
          }

          // Behavior Score Chart
          if (behaviorCanvas && self.summary.behaviorChartData) {
            const behaviorData = self.summary.behaviorChartData;

            // Get parent container and ensure it has proper styling
            const behaviorContainer = behaviorCanvas.parentElement;
            if (behaviorContainer) {
              behaviorContainer.style.position = "relative";
              behaviorContainer.style.height = "256px";
              behaviorContainer.style.width = "100%";
            }

            if (behaviorData.length > 0) {
              self.behaviorChartInstance = new Chart(behaviorCanvas, {
                type: "line",
                data: {
                  labels: behaviorData.map((d) => d.label),
                  datasets: [
                    {
                      label: "Skor Perilaku Rata-rata",
                      data: behaviorData.map((d) => d.avgScore),
                      borderColor: "#f97316",
                      backgroundColor: "rgba(249, 115, 22, 0.1)",
                      fill: true,
                      tension: 0.4,
                    },
                  ],
                },
                options: {
                  responsive: true,
                  maintainAspectRatio: false,
                  animation: { duration: 800 },
                  plugins: {
                    legend: { position: "bottom" },
                  },
                  scales: {
                    y: { beginAtZero: false },
                  },
                },
              });
              console.log("[Dashboard] behaviorChart created successfully");
            }
          }
        }

        // Try rendering immediately and then with delays
        function scheduleNextAttempt() {
          if (attemptIndex < attempts.length) {
            setTimeout(function () {
              tryRender();
              attemptIndex++;
              scheduleNextAttempt();
            }, attempts[attemptIndex]);
          }
        }
        scheduleNextAttempt();
      },

      // ===== HELPER FUNCTIONS =====
      formatDate(isoString) {
        if (!isoString) return "-";
        const date = new Date(isoString);
        return date.toLocaleDateString("id-ID", {
          day: "numeric",
          month: "short",
        });
      },

      formatLongDate(value) {
        if (!value) return "-";
        const date = new Date(value);
        if (isNaN(date.getTime())) return value;
        return date.toLocaleDateString("id-ID", {
          weekday: "long",
          day: "numeric",
          month: "long",
          year: "numeric",
        });
      },

      setQuickFilter(type) {
        const now = new Date();
        const start = new Date();
        switch (type) {
          case "day":
            start.setHours(0, 0, 0, 0);
            break;
          case "week":
            start.setDate(now.getDate() - 7);
            break;
          case "month":
            start.setMonth(now.getMonth() - 1);
            break;
        }
        this.filters.startDate = start.toISOString().split("T")[0];
        this.filters.endDate = now.toISOString().split("T")[0];
        this.fetchSummary();
      },

        this.filters.endDate = "";
        this.filters.classFilter = "";

      syncWaliStudentDetail() {
        if (this.user?.Role !== "Wali") return;
        if (!Array.isArray(this.students) || this.students.length === 0) {
          this.selectedStudent = null;
          this.studentHistory = [];
          this.studentIncidents = [];
          this.raportData = null;
          this.fullStudentReport = false;
          this.selectedRaportPeriodId = "";
          return;
        }

        const currentId = this.selectedStudent?.StudentID || "";
        const matched =
          this.students.find((student) => student.StudentID === currentId) ||
          this.students[0];

        if (!matched) return;

        const changed = matched.StudentID !== currentId;
        this.selectedStudent = { ...matched };
        this.studentDetailTab = this.studentDetailTab || "hafalan";
        this.showDetailModal = false;

        if (changed || !this.studentHistory.length || !this.studentIncidents.length) {
          this.studentHistory = [];
          this.studentIncidents = [];
          this.behaviorFilter = "all";
          this.behaviorVisibleCount = 5;
          this.memoFilter = "all";
          this.memoVisibleCount = 5;
          this.fullStudentReport = false;
          this.raportData = null;
          this.selectedRaportPeriodId = "";
          this.refreshStudentDetail();
          this.loadFullStudentReport(matched.StudentID);
        }
      },

      // ===== CHART RENDERING =====
      renderCharts() {
        google.script.run
          .withSuccessHandler((res) => {
            if (!res.ok) return;

            const ctxMemo = document.getElementById("studentMemoChart");
            const ctxInc = document.getElementById("studentIncidentChart");

            if (!ctxMemo || !ctxInc) return;

            // Destroy existing charts to prevent overlay issues
            if (this.charts.memo) this.charts.memo.destroy();
            if (this.charts.incident) this.charts.incident.destroy();

            // Common chart options
            const commonOptions = {
              responsive: true,
              plugins: { legend: { display: false } },
            };

            // Memo Chart (Line)
            this.charts.memo = new Chart(ctxMemo.getContext("2d"), {
              type: "line",
              data: {
                labels: res.data.labels,
                datasets: [
                  {
                    label: "Jumlah Setoran",
                    data: res.data.memos,
                    borderColor: "#80A1C1",
                    backgroundColor: "#80A1C122",
                    fill: true,
                    tension: 0.4,
                  },
                ],
              },
              options: commonOptions,
            });

            // Incident Chart (Bar)
            this.charts.incident = new Chart(ctxInc.getContext("2d"), {
              type: "bar",
              data: {
                labels: res.data.labels,
                datasets: [
                  {
                    label: "Poin Perilaku",
                    data: res.data.points,
                    backgroundColor: res.data.points.map((p) =>
                      p >= 0 ? "#16A34A" : "#DC2626",
                    ),
                    borderRadius: 8,
                  },
                ],
              },
              options: commonOptions,
            });
          })
          .getStudentAnalytics(this.selectedStudent.StudentID, this.user);
      },

      fetchUsers() {

          .withSuccessHandler((res) => {

                return created >= thirtyDaysAgo;

              this.showToast(res.message, "error");

            this.loading = false;
            this.showToast("Gagal memuat data user", "error");

      submitUserForm() {
        // Validate form
        this.userFormError = "";

        if (
          !this.userForm.Name ||
          !this.userForm.Username ||
          !this.userForm.Role
        ) {
          this.userFormError = "Nama, Username, dan Role wajib diisi.";
          return;
        }

        if (
          !this.editModeUser &&
          (!this.userForm.Password || this.userForm.Password.length < 6)
        ) {
          this.userFormError = "Password minimal 6 karakter.";
          return;
        }

        if (
          this.userForm.Password &&
          this.userForm.Password !== this.userForm.ConfirmPassword
        ) {
          this.userFormError = "Password dan konfirmasi password tidak cocok.";
          return;
        }

        this.loadingUserForm = true;

        const userData = {
          Name: this.userForm.Name,
          Username: this.userForm.Username,
          Email: this.userForm.Email,
          Phone: this.userForm.Phone,
          Role: this.userForm.Role,
          StudentID: this.userForm.StudentID,
          Class: this.userForm.Class,
          Status: this.userForm.Status,
        };

        // Only include password if provided
        if (this.userForm.Password) {
          userData.Password = this.userForm.Password;
        }

        if (this.editModeUser) {
          // Update existing user
          google.script.run
            .withSuccessHandler((res) => {
              this.loadingUserForm = false;
              if (res.ok) {
                this.showToast(res.message, "success");
                this.fetchUsers();
                this.fetchStudents(); // Refresh student list to sync status changes
                this.closeUserModal();
              } else {
                this.userFormError = res.message;
              }
            })
            .withFailureHandler((err) => {
              this.loadingUserForm = false;
              this.userFormError = "Terjadi kesalahan: " + err.message;
            })
            .updateUser(this.editModeUser, userData, this.user);
        } else {
          // Add new user
          google.script.run
            .withSuccessHandler((res) => {
              this.loadingUserForm = false;
              if (res.ok) {
                this.showToast(res.message, "success");
                this.fetchUsers();
                this.closeUserModal();
              } else {
                this.userFormError = res.message;
              }
            })
            .withFailureHandler((err) => {
              this.loadingUserForm = false;
              this.userFormError = "Terjadi kesalahan: " + err.message;
            })
            .addUser(userData, this.user);
        }
      },

      runHealthCheck() {
        this.loading = true;
        google.script.run
          .withSuccessHandler((res) => {
            this.loading = false;
            if (res.ok) {
              this.showToast(res.message, "success");
              return;
            }

            const sheetIssues = res.data?.sheets
              ?.filter((sheet) => !sheet.ok)
              .map((sheet) => `${sheet.name}: ${sheet.message}`)
              .join("\n");
            const functionIssues = res.data?.functions
              ?.filter((fn) => !fn.ok)
              .map((fn) => `Function missing: ${fn.name}`)
              .join("\n");
            const details = [sheetIssues, functionIssues]
              .filter(Boolean)
              .join("\n");

            this.showToast(res.message || "Health check gagal", "error");
            if (details) alert(details);
          })
          .withFailureHandler((err) => {
            this.loading = false;
            this.showToast("Health check gagal: " + err.message, "error");
          })
          .runHealthCheck(this.user);

          TanggalKembali: this.toInputDate(item.TanggalKembali),
          JamKembali: item.JamKembali || "",
          BatasJamKembali: "17:00",
          Penjemput: item.Penjemput || "",
          HubunganPenjemput: item.HubunganPenjemput || "",
          Phone: item.Phone || "",
          Notes: item.Notes || "",
        };
        this.showPulangBulananModal = true;
      },

      toInputDate(value) {
        if (!value) {
          return "";
        }
        if (typeof value === "string" && /^\d{4}-\d{2}-\d{2}$/.test(value)) {
          return value;
        }
        const d = new Date(value);
        if (isNaN(d.getTime())) {
          return value;
        }
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      },

      closePulangBulananModal() {
        this.showPulangBulananModal = false;
      },

      savePulangBulananAction() {
        if (!this.pulangForm.StudentID) {
          this.showToast("Santri wajib dipilih.", "error");
          return;
        }
        if (!this.pulangForm.Month) {
          this.showToast("Bulan wajib dipilih.", "error");
          return;
        }
        if (!this.pulangForm.Year) {
          this.showToast("Tahun wajib diisi.", "error");
          return;
        }
        if (!this.pulangForm.StatusPulang) {
          this.showToast("Status pulang wajib dipilih.", "error");
          return;
        }
        this.syncPulangStudent();
        if (this.pulangEditMode) {
          google.script.run
            .withSuccessHandler((res) => {
              if (res && (res.success || res.ok)) {
                this.showToast(
                  res.message || "Data berhasil diperbarui.",
                  "success",
                );
                this.closePulangBulananModal();
                this.loadPulangBulanan();
              } else {
                this.showToast(
                  res.message || "Gagal memperbarui data.",
                  "error",
                );
              }
            })
            .withFailureHandler((err) => {
              this.showToast(err.message || "Gagal memperbarui data.", "error");
            })
            .updatePulangBulanan(
              this.pulangForm.PulangID,
              this.pulangForm,
              this.user,
            );
        } else {
          google.script.run
            .withSuccessHandler((res) => {
              if (res && (res.success || res.ok)) {
                this.showToast(
                  res.message || "Data berhasil disimpan.",
                  "success",
                );
                this.closePulangBulananModal();
                this.loadPulangBulanan();
              } else {
                this.showToast(res.message || "Gagal menyimpan data.", "error");
              }
            })
            .withFailureHandler((err) => {
              this.showToast(err.message || "Gagal menyimpan data.", "error");
            })
            .savePulangBulanan(this.pulangForm, this.user);
        }
      },

      deletePulangBulananAction(item) {
        if (
          !confirm("Hapus data pulang bulanan untuk " + item.StudentName + "?")
        ) {
          return;
        }
        google.script.run
          .withSuccessHandler((res) => {
            if (res && (res.success || res.ok)) {
              this.showToast(
                res.message || "Data berhasil dihapus.",
                "success",
              );
              this.loadPulangBulanan();
            } else {
              this.showToast(res.message || "Gagal menghapus data.", "error");
            }
          })
          .withFailureHandler((err) => {
            this.showToast(err.message || "Gagal menghapus data.", "error");
          })
          .deletePulangBulanan(item.PulangID, this.user);
      },

      // ===== CLEANUP =====
      destroy() {
        if (this.charts.memo) {
          this.charts.memo.destroy();
          this.charts.memo = null;
        }
        if (this.charts.incident) {
          this.charts.incident.destroy();
          this.charts.incident = null;
        }
      },
    };
  };
</script>
