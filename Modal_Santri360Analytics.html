<!-- MODAL SANTRI 360° INTELLIGENCE (ANALYTICS PRO) -->
<div
  x-show="showSantriAnalyticsModal"
  class="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-0 md:p-4 overflow-y-auto"
  x-cloak
>
  <div class="bg-[#FFF5E6] w-full max-w-5xl min-h-screen md:min-h-0 md:max-h-[94vh] flex flex-col md:rounded-3xl shadow-2xl overflow-hidden">
    
    <!-- MODAL TOP TOOLBAR (NO-PRINT) -->
    <div class="p-4 md:p-6 bg-white border-b border-gray-200 flex flex-wrap items-center justify-between gap-4 no-print sticky top-0 z-20 shadow-sm">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-2xl bg-gradient-islamic text-white flex items-center justify-center font-black text-xl shadow-md">
          <span>🧠</span>
        </div>
        <div>
          <div class="flex items-center gap-2 flex-wrap">
            <h3 class="font-black text-lg md:text-xl text-gray-900 leading-tight" x-text="analytics360Data?.data?.student?.name || selectedStudent?.Name || 'Santri Analytics 360°'"></h3>
            <span class="bg-amber-100 text-amber-900 text-[10px] font-black px-2.5 py-0.5 rounded-full uppercase tracking-wider border border-amber-300">
              PRO INTELLIGENCE
            </span>
          </div>
          <p class="text-xs text-gray-500 mt-0.5">
            <span x-text="'Kelas: ' + (analytics360Data?.data?.student?.class || selectedStudent?.['Class/Level'] || '-')"></span>
            <span class="text-gray-300 mx-1.5">•</span>
            <span x-text="'Asrama: ' + (analytics360Data?.data?.student?.dorm || '-')"></span>
            <span class="text-gray-300 mx-1.5">•</span>
            <span class="font-bold text-[#0f5f4a]" x-text="'Periode: ' + (analytics360Data?.data?.period || 'Semester Aktif')"></span>
          </p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button
          type="button"
          x-show="analytics360Data?.isPro"
          @click="printStudent360Portfolio()"
          class="app-btn app-btn-primary text-xs flex items-center gap-2 shadow-sm"
          title="Cetak lembar profil analitik 1 halaman resmi"
        >
          <span>🖨️</span>
          <span>Cetak Portofolio (PDF)</span>
        </button>

        <button
          type="button"
          @click="showSantriAnalyticsModal = false"
          class="p-2 text-gray-400 hover:text-gray-700 rounded-full hover:bg-gray-100 transition-colors ml-1"
        >
          ✕
        </button>
      </div>
    </div>

    <!-- MAIN SCROLLABLE BODY & PRINT CONTAINER -->
    <div class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6" id="analytics360PrintArea">
      
      <!-- LOADING STATE -->
      <div x-show="loadingAnalytics360" class="py-20 text-center no-print">
        <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-[#0f5f4a] border-t-transparent mb-4"></div>
        <p class="font-bold text-gray-700">Menganalisis profil 360° santri...</p>
        <p class="text-xs text-gray-400 mt-1">Mengalkulasi simulasi multi-data operasional (perilaku, presensi, halaqah, dan akademik).</p>
      </div>

      <!-- ERROR STATE -->
      <div x-show="!loadingAnalytics360 && analytics360Error" class="py-16 text-center max-w-md mx-auto no-print">
        <div class="w-14 h-14 bg-rose-100 text-rose-600 rounded-2xl flex items-center justify-center text-2xl mx-auto mb-3">⚠️</div>
        <h4 class="font-bold text-gray-800 text-base">Gagal Memuat Analisis</h4>
        <p class="text-xs text-gray-500 mt-1" x-text="analytics360Error"></p>
        <button
          type="button"
          @click="openStudent360Analytics(selectedStudent)"
          class="mt-4 app-btn app-btn-primary text-xs"
        >
          Coba Lagi
        </button>
      </div>

      <!-- UPSELL BANNER (JIKA LISENSI PRO BELUM DIAKTIFKAN PONDOK) -->
      <template x-if="!loadingAnalytics360 && analytics360Data && !analytics360Data.isPro">
        <div class="bg-white rounded-3xl p-8 md:p-12 border-2 border-dashed border-amber-300 shadow-xl text-center max-w-2xl mx-auto my-8 no-print">
          <div class="w-20 h-20 bg-gradient-to-tr from-amber-400 to-amber-200 rounded-3xl mx-auto flex items-center justify-center text-4xl shadow-lg mb-6">
            👑
          </div>
          <span class="bg-amber-100 text-amber-900 text-xs font-black px-3 py-1 rounded-full uppercase tracking-widest border border-amber-200">
            Fitur Eksklusif PRO
          </span>
          <h2 class="text-2xl font-black text-gray-900 mt-3" x-text="analytics360Data?.teaser?.title || 'Buka Layanan Santri Analytics PRO'"></h2>
          <p class="text-sm text-gray-600 mt-2 leading-relaxed" x-text="analytics360Data?.teaser?.description || 'Dapatkan analisis mendalam perkembangan santri, deteksi bakat tersembunyi, dan sistem peringatan dini kedisiplinan.'"></p>

          <div class="my-6 text-left bg-amber-50/70 border border-amber-100 rounded-2xl p-5 space-y-2.5">
            <p class="text-xs font-black uppercase text-amber-900 tracking-wider">Keunggulan Layanan PRO:</p>
            <template x-for="item in (analytics360Data?.teaser?.benefits || [])" :key="item">
              <div class="flex items-center gap-2 text-xs text-amber-950">
                <span class="text-emerald-600 font-bold">✓</span>
                <span x-text="item"></span>
              </div>
            </template>
          </div>

          <div class="flex flex-col sm:flex-row justify-center gap-3">
            <template x-if="user?.Role === 'Mudir' || user?.Role === 'Admin'">
              <button
                type="button"
                @click="activateAnalyticsProForTenant()"
                class="app-btn app-btn-primary text-sm font-bold shadow-md"
              >
                ⚡ Aktifkan Santri Analytics PRO Sekarang
              </button>
            </template>
            <a
              href="https://wa.me/6281234567890?text=Halo%20Admin,%20saya%20tertarik%20upgrade%20ke%20Santri%20Analytics%20PRO"
              target="_blank"
              class="app-btn app-btn-soft text-sm font-bold flex items-center justify-center gap-2"
            >
              <span>💬</span>
              <span>Hubungi Penyedia Aplikasi</span>
            </a>
          </div>
        </div>
      </template>

      <!-- ACTIVE PRO DASHBOARD & PRINTABLE EXECUTIVE DOSSIER -->
      <template x-if="!loadingAnalytics360 && analytics360Data?.isPro">
        <div class="space-y-6">

          <!-- KOP SURAT RESMI (HANYA MUNCUL DI CETAK PDF ATAU TAMPILAN RESMI) -->
          <div class="border-b-2 border-double border-gray-800 pb-3 mb-6 text-center print-only">
            <div class="flex items-center justify-center gap-4">
              <div class="w-14 h-14 rounded-full border-2 border-[#0f5f4a] flex items-center justify-center p-1 bg-white text-[#0f5f4a] font-black text-xl">
                <span>🕌</span>
              </div>
              <div>
                <h4 class="font-bold text-gray-500 text-[10px] tracking-widest uppercase" x-text="analytics360Data?.data?.tenantProfile?.YayasanName || 'YAYASAN PENDIDIKAN PESANTREN'"></h4>
                <h2 class="font-black text-base text-gray-900 tracking-wide uppercase" x-text="analytics360Data?.data?.tenantProfile?.InstitutionName || 'PONDOK PESANTREN RAUDHATUL ULUM'"></h2>
                <p class="text-[9px] text-gray-500 leading-tight mt-0.5" x-text="(analytics360Data?.data?.tenantProfile?.Address || 'Jl. Pesantren No. 01') + (analytics360Data?.data?.tenantProfile?.Phone ? ' — Telp: ' + analytics360Data.data.tenantProfile.Phone : '')"></p>
              </div>
            </div>
            <div class="mt-3 text-center">
              <h3 class="font-black text-sm tracking-wider uppercase underline underline-offset-4 text-[#0f5f4a]">
                PORTOFOLIO EVALUASI & ANALISIS PERKEMBANGAN SANTRI (360° INTELLIGENCE)
              </h3>
              <p class="text-[10px] text-gray-500 mt-0.5" x-text="'Tahun Ajaran: 2026/2027 — Periode: ' + (analytics360Data?.data?.period || 'Semester Ganjil')"></p>
            </div>
          </div>

          <!-- IDENTITAS SANTRI (PRINT VIEW & SCREEN) -->
          <div class="grid grid-cols-2 md:grid-cols-4 gap-3 bg-white p-4 rounded-2xl border border-gray-200 shadow-sm text-xs">
            <div>
              <p class="text-[10px] text-gray-400 uppercase font-bold">Nama Lengkap</p>
              <p class="font-black text-gray-900 text-sm mt-0.5" x-text="analytics360Data?.data?.student?.name"></p>
            </div>
            <div>
              <p class="text-[10px] text-gray-400 uppercase font-bold">NIS / ID</p>
              <p class="font-bold text-gray-700 mt-0.5" x-text="analytics360Data?.data?.student?.id"></p>
            </div>
            <div>
              <p class="text-[10px] text-gray-400 uppercase font-bold">Kelas / Asrama</p>
              <p class="font-bold text-gray-700 mt-0.5" x-text="(analytics360Data?.data?.student?.class || '-') + ' / ' + (analytics360Data?.data?.student?.dorm || '-')"></p>
            </div>
            <div>
              <p class="text-[10px] text-gray-400 uppercase font-bold">Status Perkembangan</p>
              <span
                class="inline-block mt-0.5 px-2.5 py-0.5 rounded-full text-[10px] font-black uppercase tracking-wider"
                :class="{
                  'bg-red-600 text-white animate-pulse shadow-xs': (analytics360Data?.data?.growthTrajectory?.status || '').includes('PEMBINAAN INTENSIF') || (analytics360Data?.data?.growthTrajectory?.totalBehaviorScore < 30),
                  'bg-yellow-500 text-white': (analytics360Data?.data?.growthTrajectory?.status || '').includes('PERLU'),
                  'bg-blue-500 text-white': (analytics360Data?.data?.growthTrajectory?.status || '').includes('NORMAL') || (analytics360Data?.data?.growthTrajectory?.status || '').includes('STABIL'),
                  'bg-green-600 text-white': (analytics360Data?.data?.growthTrajectory?.status || '').includes('UNGGUL') || (analytics360Data?.data?.growthTrajectory?.status || '').includes('POSITIF')
                }"
                x-text="analytics360Data?.data?.growthTrajectory?.status || 'Santri Normal'"
              ></span>
            </div>
          </div>

          <!-- SEKSI 0.5: SIMULASI & DIAGNOSIS MULTI-DATA OPERASIONAL (BENTO 4 KARTU) -->
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            
            <!-- KARTU 1: PERILAKU & TATA TERTIB -->
            <div class="bg-white rounded-2xl p-4 border shadow-xs flex flex-col justify-between"
                 :class="(analytics360Data?.data?.breakdowns?.behavior?.score < 30) ? 'border-rose-300 bg-rose-50/40' : 'border-gray-200'">
              <div>
                <div class="flex items-center justify-between mb-1.5">
                  <span class="text-[10px] font-black uppercase tracking-wider text-gray-500">Poin Perilaku Riil</span>
                  <span class="text-base">⚖️</span>
                </div>
                <div class="flex items-baseline gap-2">
                  <span class="text-2xl font-black"
                        :class="(analytics360Data?.data?.breakdowns?.behavior?.score < 30) ? 'text-rose-600' : 'text-gray-900'"
                        x-text="(analytics360Data?.data?.breakdowns?.behavior?.score ?? 100) + ' Poin'"></span>
                </div>
                <p class="text-[10px] font-black mt-1"
                   :class="(analytics360Data?.data?.breakdowns?.behavior?.score < 30) ? 'text-rose-700' : 'text-emerald-700'"
                   x-text="analytics360Data?.data?.breakdowns?.behavior?.statusLabel || 'Santri Normal'"></p>
              </div>
              <div class="mt-3 pt-2.5 border-t border-gray-100 text-[10px] space-y-1">
                <div class="flex justify-between text-gray-600">
                  <span>Total Pelanggaran:</span>
                  <strong class="text-rose-600" x-text="(analytics360Data?.data?.breakdowns?.behavior?.violationsCount || 0) + ' Kasus'"></strong>
                </div>
                <template x-if="(analytics360Data?.data?.breakdowns?.behavior?.categorySummary || []).length">
                  <div class="flex flex-wrap gap-1 mt-1">
                    <template x-for="c in (analytics360Data?.data?.breakdowns?.behavior?.categorySummary || []).slice(0, 2)" :key="c.category">
                      <span class="bg-rose-100 text-rose-800 text-[9px] font-bold px-1.5 py-0.5 rounded"
                            x-text="c.category + ': ' + c.count + 'x (-' + c.pointsLost + ')'"></span>
                    </template>
                  </div>
                </template>
              </div>
            </div>

            <!-- KARTU 2: ABSENSI & PRESENSI -->
            <div class="bg-white rounded-2xl p-4 border shadow-xs flex flex-col justify-between"
                 :class="(analytics360Data?.data?.breakdowns?.attendance?.alpa > 0) ? 'border-amber-300 bg-amber-50/30' : 'border-gray-200'">
              <div>
                <div class="flex items-center justify-between mb-1.5">
                  <span class="text-[10px] font-black uppercase tracking-wider text-gray-500">Presensi & Kehadiran</span>
                  <span class="text-base">📅</span>
                </div>
                <div class="flex items-baseline gap-2">
                  <span class="text-2xl font-black text-gray-900" x-text="(analytics360Data?.data?.breakdowns?.attendance?.percentage ?? 100) + '%'"></span>
                  <span class="text-[10px] text-gray-400">Kehadiran</span>
                </div>
                <p class="text-[10px] text-gray-500 mt-1">
                  Total <span class="font-bold text-gray-800" x-text="analytics360Data?.data?.breakdowns?.attendance?.totalSessions || 0"></span> Sesi Pertemuan
                </p>
              </div>
              <div class="mt-3 pt-2.5 border-t border-gray-100 text-[10px] flex items-center justify-between">
                <span class="text-emerald-700">Hadir: <strong x-text="analytics360Data?.data?.breakdowns?.attendance?.hadir || 0"></strong></span>
                <span class="text-amber-700">Izin/Sakit: <strong x-text="(analytics360Data?.data?.breakdowns?.attendance?.izin || 0) + (analytics360Data?.data?.breakdowns?.attendance?.sakit || 0)"></strong></span>
                <span :class="(analytics360Data?.data?.breakdowns?.attendance?.alpa > 0) ? 'text-rose-600 font-black' : 'text-gray-400'">Alpa: <strong x-text="analytics360Data?.data?.breakdowns?.attendance?.alpa || 0"></strong></span>
              </div>
            </div>

            <!-- KARTU 3: HALAQOH & HAFALAN QUR'AN -->
            <div class="bg-white rounded-2xl p-4 border border-gray-200 shadow-xs flex flex-col justify-between">
              <div>
                <div class="flex items-center justify-between mb-1.5">
                  <span class="text-[10px] font-black uppercase tracking-wider text-gray-500">Halaqoh & Tahfidz</span>
                  <span class="text-base">📖</span>
                </div>
                <div class="flex items-baseline gap-2">
                  <span class="text-2xl font-black text-emerald-800" x-text="analytics360Data?.data?.breakdowns?.memorization?.totalSetoran || 0"></span>
                  <span class="text-[10px] text-gray-400">Total Setoran</span>
                </div>
                <p class="text-[10px] text-gray-600 mt-1 truncate" title="Setoran Terakhir">
                  Terakhir: <span class="font-bold text-gray-800" x-text="analytics360Data?.data?.breakdowns?.memorization?.lastSurah || '-'"></span>
                </p>
              </div>
              <div class="mt-3 pt-2.5 border-t border-gray-100 text-[10px] flex items-center justify-between text-gray-600">
                <span>Ziyadah: <strong class="text-emerald-700" x-text="analytics360Data?.data?.breakdowns?.memorization?.ziyadahBaru || 0"></strong></span>
                <span>Muroja'ah: <strong class="text-blue-700" x-text="analytics360Data?.data?.breakdowns?.memorization?.murojaah || 0"></strong></span>
                <span class="text-gray-400 font-mono" x-text="(analytics360Data?.data?.breakdowns?.memorization?.murajaahRatio || 0) + '% Muro'"></span>
              </div>
            </div>

            <!-- KARTU 4: AKADEMIK & KITAB KUNING -->
            <div class="bg-white rounded-2xl p-4 border border-gray-200 shadow-xs flex flex-col justify-between">
              <div>
                <div class="flex items-center justify-between mb-1.5">
                  <span class="text-[10px] font-black uppercase tracking-wider text-gray-500">Akademik & Kitab</span>
                  <span class="text-base">📚</span>
                </div>
                <div class="flex items-baseline gap-2">
                  <span class="text-2xl font-black text-gray-900" x-text="analytics360Data?.data?.breakdowns?.academic?.average || 78"></span>
                  <span class="text-[10px] text-gray-400">Rata-rata Nilai</span>
                </div>
                <p class="text-[10px] mt-1"
                   :class="(analytics360Data?.data?.breakdowns?.academic?.underKkm > 0) ? 'text-amber-700 font-bold' : 'text-gray-500'">
                  <span x-text="(analytics360Data?.data?.breakdowns?.academic?.underKkm || 0) + ' Mapel di bawah KKM'"></span>
                </p>
              </div>
              <div class="mt-3 pt-2.5 border-t border-gray-100 text-[10px] text-gray-500 truncate">
                <template x-if="(analytics360Data?.data?.breakdowns?.academic?.topSubjects || []).length">
                  <span>Unggulan: <strong class="text-emerald-700" x-text="analytics360Data?.data?.breakdowns?.academic?.topSubjects.slice(0, 2).join(', ')"></strong></span>
                </template>
                <template x-if="!(analytics360Data?.data?.breakdowns?.academic?.topSubjects || []).length">
                  <span>Evaluasi standar KKM kelas</span>
                </template>
              </div>
            </div>

          </div>

          <!-- SEKSI 1: RADAR CHART 5 PILAR & KARTU POTENSI BAKAT -->
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- RADAR 5 PILAR (7 COLS) -->
            <div class="lg:col-span-7 bg-white rounded-3xl p-6 shadow-sm border border-gray-100 flex flex-col justify-between">
              <div>
                <div class="flex items-center justify-between mb-2">
                  <h4 class="font-black text-sm text-gray-800 uppercase tracking-wider flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-[#0f5f4a]"></span>
                    Radar Perkembangan 5 Pilar Santri
                  </h4>
                  <span class="text-[10px] font-bold text-gray-400 bg-gray-100 px-2.5 py-0.5 rounded-full">Skala 0 - 100</span>
                </div>
                <p class="text-xs text-gray-500 mb-3">
                  Keseimbangan antara capaian hafalan Qur'an, kitab kuning, akhlak adab riil, ibadah harian, dan kepemimpinan sosial.
                </p>
              </div>

              <!-- RADAR CANVAS -->
              <div class="relative w-full aspect-square max-h-[290px] mx-auto flex items-center justify-center">
                <canvas id="radarPillarsCanvas"></canvas>
              </div>

              <!-- SKOR 5 PILAR -->
              <div class="grid grid-cols-5 gap-1.5 mt-3 pt-3 border-t border-gray-100 text-center text-[10px]">
                <div class="p-1 rounded bg-emerald-50">
                  <p class="text-gray-500">Tahfidz</p>
                  <p class="text-sm font-black text-emerald-900" x-text="analytics360Data?.data?.pillars?.studentScores?.[0] || 0"></p>
                </div>
                <div class="p-1 rounded bg-blue-50">
                  <p class="text-gray-500">Kitab</p>
                  <p class="text-sm font-black text-blue-900" x-text="analytics360Data?.data?.pillars?.studentScores?.[1] || 0"></p>
                </div>
                <div class="p-1 rounded" :class="(analytics360Data?.data?.pillars?.studentScores?.[2] || 0) < 40 ? 'bg-rose-100 border border-rose-300' : 'bg-amber-50'">
                  <p class="text-[9px] uppercase font-bold" :class="(analytics360Data?.data?.pillars?.studentScores?.[2] || 0) < 40 ? 'text-rose-700' : 'text-gray-500'">Akhlak</p>
                  <p class="text-sm font-black" :class="(analytics360Data?.data?.pillars?.studentScores?.[2] || 0) < 40 ? 'text-rose-900' : 'text-amber-900'" x-text="analytics360Data?.data?.pillars?.studentScores?.[2] || 0"></p>
                </div>
                <div class="p-1 rounded bg-teal-50">
                  <p class="text-gray-500">Ibadah</p>
                  <p class="text-sm font-black text-teal-900" x-text="analytics360Data?.data?.pillars?.studentScores?.[3] || 0"></p>
                </div>
                <div class="p-1 rounded bg-purple-50">
                  <p class="text-gray-500">Sosial</p>
                  <p class="text-sm font-black text-purple-900" x-text="analytics360Data?.data?.pillars?.studentScores?.[4] || 0"></p>
                </div>
              </div>
            </div>

            <!-- DETEKSI POTENSI & DIAGNOSIS BAKAT (5 COLS) -->
            <div class="lg:col-span-5 text-white rounded-3xl p-6 shadow-md flex flex-col justify-between"
                 :class="(analytics360Data?.data?.growthTrajectory?.totalBehaviorScore < 30) ? 'bg-gradient-to-br from-rose-700 via-rose-800 to-amber-900' : 'bg-gradient-to-br from-amber-600 via-amber-700 to-amber-800'">
              <div>
                <div class="flex items-center justify-between mb-3">
                  <span class="bg-white/20 backdrop-blur-md text-[10px] font-black uppercase tracking-widest px-3 py-1 rounded-full">
                    ★ TALENT & DIAGNOSTIC
                  </span>
                  <span class="text-2xl" x-text="(analytics360Data?.data?.growthTrajectory?.totalBehaviorScore < 30) ? '🛡️' : '✨'"></span>
                </div>
                <h3 class="text-xl font-black text-white leading-snug"
                    x-text="(analytics360Data?.data?.growthTrajectory?.totalBehaviorScore < 30) ? 'Diagnosis Karakter & Potensi' : 'Potensi & Bakat Menonjol'">
                </h3>
                <p class="text-xs text-amber-100 mt-1">
                  Analisis cerdas berdasarkan bukti catatan perilaku riil, capaian hafalan, evaluasi kitab, dan keaktifan santri.
                </p>

                <!-- LIST DETEKSI BAKAT / DIAGNOSIS -->
                <div class="space-y-2.5 mt-4">
                  <template x-for="t in (analytics360Data?.data?.talents || [])" :key="t.badge">
                    <div class="bg-white/10 backdrop-blur-md p-3.5 rounded-2xl border border-white/20">
                      <div class="flex items-center justify-between">
                        <p class="font-black text-sm text-amber-100 flex items-center gap-1.5">
                          <span x-text="t.icon === 'warning' ? '⚠️' : (t.icon === 'quran' ? '📖' : '🏆')"></span>
                          <span x-text="t.badge"></span>
                        </p>
                        <span class="text-[9px] font-bold bg-white text-gray-900 px-2 py-0.5 rounded-md uppercase" x-text="t.strength"></span>
                      </div>
                      <p class="text-[11px] text-white/90 mt-1.5 leading-relaxed" x-text="t.description"></p>
                    </div>
                  </template>
                </div>
              </div>

              <div class="mt-4 pt-3 border-t border-white/20 text-[10px] text-amber-100 italic">
                Rekomendasi diselaraskan untuk pendampingan terpadu di pesantren dan di rumah.
              </div>
            </div>
          </div>

          <!-- SEKSI 2: ANALISIS KEKUATAN (STRENGTHS) VS KELEMAHAN (WEAKNESSES) -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- KEKUATAN & AREA UNGGUL -->
            <div class="bg-white rounded-3xl p-6 shadow-sm border border-emerald-100 bg-emerald-50/20">
              <div class="flex items-center gap-2 mb-3">
                <span class="text-xl">🌟</span>
                <h4 class="font-black text-sm text-emerald-900 uppercase tracking-wider">
                  Kekuatan Utama Santri (Strengths)
                </h4>
              </div>
