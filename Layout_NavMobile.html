<!-- Layout Navigation Mobile -->
<nav class="app-mobile-nav md:hidden" role="navigation" aria-label="Navigasi mobile"
  @keydown.escape.window="mobileMoreOpen = false; mobileDrawerOpen = false">
  <div x-show="mobileDrawerOpen" x-transition.opacity class="app-mobile-drawer-backdrop"
    @click="mobileDrawerOpen = false"></div>

  <aside x-show="mobileDrawerOpen" x-transition class="app-mobile-drawer"
    aria-label="Menu samping mobile" @click.outside="mobileDrawerOpen = false">
    <div class="app-mobile-drawer-head">
      <div class="app-sidebar-logo">SA</div>
      <div class="min-w-0 flex-1">
        <p class="font-black text-gray-900 leading-tight">Santri Analytics</p>
        <p class="text-xs text-gray-500 truncate" x-text="user?.Role || '-'"></p>
      </div>
      <button type="button" @click="mobileDrawerOpen = false" class="app-mobile-drawer-close"
        aria-label="Tutup menu samping">&times;</button>
    </div>

    <nav class="app-mobile-drawer-list">
      <template x-for="group in ['utama', 'operasional', 'lainnya', 'administrator']" :key="group">
        <div class="app-mobile-drawer-group" x-show="visibleNavigationItems(group).length">
          <p x-show="group !== 'utama'" class="app-mobile-drawer-label"
            x-text="navigationGroupLabel(group)"></p>
          <template x-for="item in visibleNavigationItems(group)" :key="item.id">
            <button type="button" @click="handleNavigationItem(item)" class="app-mobile-drawer-item"
              :class="{ 'is-active': currentTab === item.id }">
              <span class="app-mobile-more-icon" x-html="navIcon(item.icon)"></span>
              <span x-text="item.label"></span>
            </button>
          </template>
        </div>
      </template>
      <button type="button" @click="openChangePasswordModal()" class="app-mobile-drawer-item">
        <span class="app-mobile-more-icon" x-html="navIcon('lock')"></span>
        Ganti Password
      </button>
    </nav>

    <button type="button" @click="logout()" class="app-mobile-drawer-logout">
      <span class="app-mobile-more-icon" x-html="navIcon('logout')"></span>
      Keluar
    </button>
  </aside>

  <div x-show="mobileMoreOpen" x-transition.opacity class="app-mobile-more-backdrop"
    @click="mobileMoreOpen = false"></div>
  <div x-show="mobileMoreOpen" x-transition class="app-mobile-more"
    @click.outside="mobileMoreOpen = false">
    <p class="text-xs font-black text-gray-400 uppercase tracking-widest mb-2">Menu lainnya</p>
    <template x-for="item in mobileMoreNavItems()" :key="item.id">
      <button type="button" @click="handleNavigationItem(item)" class="app-mobile-more-item"
        :class="{ 'is-active': currentTab === item.id }">
        <span class="app-mobile-more-icon" x-html="navIcon(item.icon)"></span>
        <span x-text="item.label"></span>
      </button>
    </template>
    <button type="button" @click="openChangePasswordModal()" class="app-mobile-more-item">
      <span class="app-mobile-more-icon" x-html="navIcon('lock')"></span>
      Ganti Password
    </button>
    <button type="button" @click="logout()" class="app-mobile-more-item text-red-600">
      <span class="app-mobile-more-icon" x-html="navIcon('logout')"></span>
      Keluar
    </button>
  </div>

  <div class="app-mobile-nav-grid">
    <template x-for="item in mobilePrimaryNavItems()" :key="item.id">
      <button type="button" @click="handleNavigationItem(item)" class="app-mobile-nav-item"
        :class="{ 'is-active': currentTab === item.id }">
        <span class="app-mobile-nav-icon" x-html="navIcon(item.icon)"></span>
        <span x-text="item.shortLabel"></span>
      </button>
    </template>
    <button type="button" @click.stop="mobileMoreOpen = !mobileMoreOpen" class="app-mobile-nav-item"
      :class="{ 'is-active': isMobileMoreActive() }" aria-haspopup="menu"
      :aria-expanded="mobileMoreOpen.toString()">
      <span class="app-mobile-nav-icon" x-html="navIcon('more')"></span>
      <span>Lainnya</span>
    </button>
  </div>
</nav>
